      <div style={{ marginBottom: 18 }}>
        <h2 style={h2Style}>リーダーボード</h2>
        <p style={subText}>レートは、過去221戦の成績(個人・チームメイト・直接対決。うち録画が残っている{SEED_REPLAYS.length}試合はチーム構成ごと)と記録した試合の勝敗・スコア(同じチームの味方と比べた得点の高さ)から推定しています(ChatGPT分析の評価を補助的に使用。試合数が少ない人ほど評価寄り)。試合を記録するたびに計算し直されます。名前をクリックするとスコアの詳細(項目別平均・推移)が見られます。AI1〜5はラベル違いなので、1体の「AI」としてまとめて表示しています。</p>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map((r, i) => {
          const wr = r.games ? (r.wins / r.games) * 100 : 0;
          const hasScores = r.scoreHistory && r.scoreHistory.length > 0;
          const isOpen = expanded.has(r.name);
          return (
            <div
              key={r.name}
              style={{ ...cardStyle, cursor: hasScores ? "pointer" : "default" }}
              onClick={() =>
                hasScores &&
                setExpanded((prev) => {
                  const next = new Set(prev);
                  if (next.has(r.name)) next.delete(r.name);
                  else next.add(r.name);
                  return next;
                })
              }
            >
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#8b7a6b", width: 22 }}>
                  {String(i + 1).padStart(2, "0")}
                </div>
                <div style={{ flex: "0 0 130px" }}>
                  <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 15, color: "#ede4d3" }} title={r.title || ""}>
                    {r.label || displayName(r.name)} {hasScores && <span style={{ color: "#665c4f", fontSize: 11 }}>{isOpen ? "▾" : "▸"}</span>}
                  </div>
                  <div style={{ marginTop: 4 }}>
                    <Badge elo={r.elo} />
                  </div>
                </div>
                <div style={{ flex: 1 }}>
                  <StatBar wins={r.wins} losses={r.losses} />
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#a89a86" }}>
                    <span>{r.games}戦 {r.wins}勝{r.losses}敗</span>
                    <span>{wr.toFixed(1)}%</span>
                  </div>
                </div>
                <div style={{ flex: "0 0 70px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 600, color: ageTier(r.elo).color }}>
                  {Math.round(r.elo)}
                </div>
              </div>
              {hasScores && !isOpen && (
                <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #3a3128", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#8b7a6b" }}>
                  直近平均総合得点: {Math.round(r.scoreHistory.reduce((s, h) => s + h.total, 0) / r.scoreHistory.length).toLocaleString()}
                  {" "}({r.scoreHistory.length}試合分の記録)
                </div>
              )}
              {hasScores && isOpen && <PlayerScoreDetail scoreHistory={r.scoreHistory} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Toggle({ label, active, onClick, color }) {
  return (
    <button
      onClick={onClick}
      style={{
        padding: "6px 14px",
        borderRadius: 8,
        border: `1px solid ${active ? (color || "#c9a227") : "#4a4136"}`,
        background: active ? `${color || "#c9a227"}22` : "transparent",
        color: active ? (color || "#c9a227") : "#a89a86",
        fontFamily: "'Inter', sans-serif",
        fontSize: 13,
        fontWeight: 600,
        cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
}

const SCORE_FIELDS = [
  { key: "military", label: "軍事" },
  { key: "economy", label: "経済" },
  { key: "tech", label: "テクノロジー" },
  { key: "society", label: "社会" },
];

function AddMatch({ agg, onSave }) {
  const [teamA, setTeamA] = useState([]);
  const [teamB, setTeamB] = useState([]);
  const [winner, setWinner] = useState(null);
  const [date, setDate] = useState(todayString);
  const [map, setMap] = useState("");
  const [notes, setNotes] = useState("");
  const [showScores, setShowScores] = useState(false);
  const [scores, setScores] = useState({});
  const [saved, setSaved] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [extractError, setExtractError] = useState(null);
  const [ocrWarnings, setOcrWarnings] = useState([]);
  const [ocrInfo, setOcrInfo] = useState("");
  const [ocrDebugText, setOcrDebugText] = useState("");
  const [ocrLogMessage, setOcrLogMessage] = useState("");
  // 前回保存以降のOCR実行のログID。保存時に最終スコアと修正差分を書き足す。
  const pendingOcrLogIds = useRef([]);

  const toggle = (name, team) => {
    const inA = teamA.includes(name);
    const inB = teamB.includes(name);
    if (team === "A") {
      if (inA) setTeamA(teamA.filter((n) => n !== name));
      else { setTeamA([...teamA, name]); setTeamB(teamB.filter((n) => n !== name)); }
    } else {
      if (inB) setTeamB(teamB.filter((n) => n !== name));
      else { setTeamB([...teamB, name]); setTeamA(teamA.filter((n) => n !== name)); }
    }
  };

  const setScoreField = (name, field, value) => {
    setScores((prev) => ({
      ...prev,
      [name]: { ...prev[name], [field]: value === "" ? undefined : Number(value) },
    }));
  };

  const handleImageUpload = async (file) => {
    if (!file) return;
    setExtracting(true);
    setExtractError(null);
    setOcrWarnings([]);
    setOcrInfo("");
    setOcrDebugText("");
    const logEntry = {
      id: Date.now(),
      createdAt: new Date().toISOString(),
      fileName: file.name || null,
      mediaType: file.type || null,
      fileSize: file.size,
      imageDataUrl: null,
      rawText: null,
      trace: [],
      parsed: null,
      scoresBefore: scores, // 前回の読み取り結果が残っていると、それとマージされる
      scoresAfterOcr: null,
      error: null,
    };
    try {
      const base64 = await fileToBase64(file);
      logEntry.imageDataUrl = `data:${file.type || "image/png"};base64,${base64}`;
      const text = await ocrExtractText(base64, file.type || "image/png");
      logEntry.rawText = text;
      console.log("OCR raw text:\n" + text);
      const { players: found, warnings, order, rows: ocrRows } = parseScoresFromOcrText(text, logEntry.trace);
      logEntry.parsed = found;
      logEntry.order = order;
      console.log("OCR parse trace:", logEntry.trace);

      // チーム分け・勝者は画像のピクセルから判定する(失敗してもスコアの自動入力は続ける)
      let inference = null;
      try {
        const analysis = analyzeScoreboardImage(await loadImageData(logEntry.imageDataUrl));
        logEntry.imageAnalysis = analysis;
        inference = inferTeamsAndWinner(order, analysis);
      } catch (e) {
        inference = { teamA: null, teamB: null, winner: null, warnings: [`チーム分け・勝者の判定中にエラーが発生しました: ${e && e.message ? e.message : e}`] };
      }
      logEntry.teamInference = inference;
      console.log("画像からのチーム・勝者判定:", logEntry.imageAnalysis, inference);
      if (inference.teamA && inference.teamB) {
        setTeamA(inference.teamA);
        setTeamB(inference.teamB);
        setWinner(inference.winner);
      }
      // 名簿にない行に割り当てたAIのスコア(勝ったチームのAIから AI1、AI2 …)
      const aiScores = {};
      (inference.rowNames || []).forEach((n, k) => {
        if (n && ratingKey(n) === AI_KEY && ocrRows[k]) {
          const [military, economy, tech, society] = ocrRows[k].values;
          aiScores[n] = { military, economy, tech, society };
        }
      });
      setOcrInfo(
        inference.teamA
          ? `チーム分け${inference.winner ? "・勝者" : ""}を画像から自動入力しました${
              inference.assignedAi ? `(名簿にない${inference.assignedAi}行は ${Object.keys(aiScores).sort().join("・")} として入力)` : ""
            }。下で確認してください。`
          : ""
      );

      const allWarnings = [...warnings, ...inference.warnings];
      logEntry.warnings = allWarnings;
      setOcrWarnings(allWarnings);
      if (allWarnings.length) setOcrDebugText(text);

      if (found.length === 0) {
        setExtractError("スコアを読み取れませんでした。手動で入力してください。下に読み取った生テキストを表示しています。");
        setOcrDebugText(text);
        return;
      }

      const next = { ...scores, ...aiScores };
      found.forEach((p) => {
        next[p.name] = { military: p.military, economy: p.economy, tech: p.tech, society: p.society };
      });
      logEntry.scoresAfterOcr = next;
      setScores(next);
      setShowScores(true);
    } catch (e) {
      console.error("OCR抽出エラー:", e);
      logEntry.error = e && e.message ? e.message : String(e);
      setExtractError("画像の読み取りに失敗しました: " + (e && e.message ? e.message : String(e)));
    } finally {
      pendingOcrLogIds.current.push(logEntry.id);
      ocrLogPut(logEntry);
      setExtracting(false);
    }
  };

  const handlePaste = (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image") !== -1) {
        const file = items[i].getAsFile();
        if (file) {
          e.preventDefault();
          handleImageUpload(file);
        }
        break;
      }
    }
  };

  const canSave = teamA.length > 0 && teamB.length > 0 && winner;
  const allPlayers = [...teamA, ...teamB];

  const handleSave = () => {
    if (!canSave) return;
    let cleanScores = null;
    if (showScores) {
      cleanScores = {};
      allPlayers.forEach((n) => {
        const s = scores[n];
        if (s && Object.values(s).some((v) => v !== undefined)) {
          cleanScores[n] = {
            military: s.military || 0,
            economy: s.economy || 0,
            tech: s.tech || 0,
            society: s.society || 0,
          };
        }
      });
      if (Object.keys(cleanScores).length === 0) cleanScores = null;
    }
    const matchId = Date.now();
    const scoresAtSave = scores;
    const logIds = pendingOcrLogIds.current;
    pendingOcrLogIds.current = [];
    logIds.forEach(async (logId) => {
      const entry = (await ocrLogGetAll()).find((e) => e.id === logId);
      ocrLogUpdate(logId, {
        savedAt: new Date().toISOString(),
        savedMatch: { id: matchId, date, map, teamA, teamB, winner },
        scoresAtSave, // 保存直前の入力欄の状態(チーム外の人の値も含む)
        finalScores: cleanScores,
        corrections: diffScores(entry && entry.scoresAfterOcr, cleanScores),
        // 画像から推定したチーム・勝者と、実際に保存した内容が違ったか
        teamCorrected: !!(entry && entry.teamInference && entry.teamInference.teamA) &&
          (JSON.stringify([...entry.teamInference.teamA].sort()) !== JSON.stringify([...teamA].sort()) ||
            JSON.stringify([...entry.teamInference.teamB].sort()) !== JSON.stringify([...teamB].sort())),
        winnerCorrected: !!(entry && entry.teamInference && entry.teamInference.winner) && entry.teamInference.winner !== winner,
      });
    });
    onSave({ id: matchId, date, map, teamA, teamB, winner, notes: notes || undefined, scores: cleanScores });
    setTeamA([]); setTeamB([]); setWinner(null); setDate(todayString()); setMap(""); setNotes(""); setScores({}); setShowScores(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const roster = [...HUMAN_NAMES, ...AI_NAMES];

  return (
    <div>
      <h2 style={h2Style}>試合を記録</h2>
      <p style={subText}>参加者をチームA・チームBに振り分けて、勝敗を記録してください。保存すると各プレイヤーのレート・相性データが自動更新されます。AI1〜5は区別用のラベルで、強さはすべて同じものとして扱います。</p>

      <div
        style={{ ...cardStyle, marginTop: 16, marginBottom: 8 }}
        onPaste={handlePaste}
        tabIndex={0}
      >
        <label style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227", display: "block", marginBottom: 8 }}>
          スコア画像から自動入力(軍事/経済/テクノロジー/社会)
        </label>
        <input
          type="file"
          accept="image/*"
          onChange={(e) => handleImageUpload(e.target.files[0])}
          style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#a89a86" }}
        />
        <div style={{ marginTop: 8, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif" }}>
          このカードをクリックしてから <kbd>Ctrl+V</kbd> でスクリーンショットを直接貼り付けることもできます。
        </div>
        {extracting && <div style={{ marginTop: 8, fontSize: 12, color: "#c9a227", fontFamily: "'Inter', sans-serif" }}>読み取り中...(数秒〜十数秒かかります)</div>}
        {extractError && <div style={{ marginTop: 8, fontSize: 12, color: "#c07a6f", fontFamily: "'Inter', sans-serif" }}>{extractError}</div>}
        {ocrDebugText && (
          <pre title="OCRが返した生テキスト" style={{ marginTop: 8, fontSize: 11, color: "#8b7a6b", background: "#171310", padding: 8, borderRadius: 6, whiteSpace: "pre-wrap", maxHeight: 200, overflow: "auto" }}>
            {ocrDebugText}
          </pre>
        )}
        {ocrInfo && <div style={{ marginTop: 8, fontSize: 12, color: "#8fa876", fontFamily: "'Inter', sans-serif" }}>✓ {ocrInfo}</div>}
        {ocrWarnings.length > 0 && (
          <div style={{ marginTop: 8, fontSize: 12, color: "#c98a4b", fontFamily: "'Inter', sans-serif", lineHeight: 1.6 }}>
            ⚠ 要確認(画像と見比べて手で直してください):
            {ocrWarnings.map((w, i) => <div key={i}>・{w}</div>)}
          </div>
        )}
        <div style={{ marginTop: 8, fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>
          画像からの読み取りによる下書きです。スコア・チーム分け・勝者(王冠マーク)を自動入力しますが、誤読することもあるので、保存前に必ず内容を確認・修正してください。
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>
          読み取りがおかしかったときは{" "}
          <button
            onClick={async () => {
              const n = await downloadOcrLogs();
              setOcrLogMessage(n > 0 ? `${n}件のログを保存しました` : "保存されたログがありません");
            }}
            style={{ background: "none", border: "none", padding: 0, color: "#c9a227", fontSize: 11, fontFamily: "'Inter', sans-serif", cursor: "pointer", textDecoration: "underline" }}
          >
            OCRデバッグログを保存
          </button>
          (画像・読み取り結果・修正内容。直近{OCR_LOG_MAX}回分をこのブラウザに記録しています){ocrLogMessage && ` — ${ocrLogMessage}`}
        </div>
        {Object.keys(scores).length > 0 && (
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #3a3128" }}>
            <div style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif", marginBottom: 6 }}>読み取り結果(A/Bボタンでチームに追加すると下の欄で編集できます):</div>
            {Object.entries(scores).map(([n, s]) => (
              <div key={n} style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: "#ede4d3" }}>
                {displayName(n)}: 軍{s.military ?? 0} / 経{s.economy ?? 0} / 技{s.tech ?? 0} / 社{s.society ?? 0}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 12, margin: "16px 0" }}>
        <input placeholder="日付(既定は今日。例 2026/9/22)" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
        <input placeholder="マップ/文明メモ(任意)" value={map} onChange={(e) => setMap(e.target.value)} style={inputStyle} />
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
        {roster.map((n) => {
          const inA = teamA.includes(n);
          const inB = teamB.includes(n);
          return (
            <div key={n} style={{ display: "flex", alignItems: "center", gap: 4, background: "#2a2420", borderRadius: 8, padding: "4px 4px 4px 10px", border: "1px solid #4a4136" }}>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", marginRight: 4 }}>{displayName(n)}</span>
              <Toggle label="A" active={inA} onClick={() => toggle(n, "A")} color="#8fa876" />
              <Toggle label="B" active={inB} onClick={() => toggle(n, "B")} color="#c98a4b" />
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 24, marginBottom: 20 }}>
        <TeamPreview title="Team A" names={teamA} color="#8fa876" agg={agg} />
        <TeamPreview title="Team B" names={teamB} color="#c98a4b" agg={agg} />
      </div>

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginBottom: 8 }}>勝ったのは?</div>
        <div style={{ display: "flex", gap: 10 }}>
          <Toggle label="Team A 勝利" active={winner === "A"} onClick={() => setWinner("A")} color="#8fa876" />
          <Toggle label="Team B 勝利" active={winner === "B"} onClick={() => setWinner("B")} color="#c98a4b" />
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <button
          onClick={() => setShowScores((v) => !v)}
          style={{ background: "none", border: "none", color: "#c9a227", fontFamily: "'Inter', sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0 }}
        >
          {showScores ? "▾ 詳細スコアを閉じる" : "▸ 詳細スコアを入力(任意)"}
        </button>

        {showScores && allPlayers.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {allPlayers.map((n) => {
              const s = scores[n] || {};
              const total = SCORE_FIELDS.reduce((sum, f) => sum + (s[f.key] || 0), 0);
              return (
                <div key={n} style={{ ...cardStyle, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", width: 90 }}>{displayName(n)}</div>
                  {SCORE_FIELDS.map((f) => (
                    <div key={f.key} style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      <label style={{ fontSize: 10, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>{f.label}</label>
                      <input
                        type="number"
                        value={s[f.key] ?? ""}
                        onChange={(e) => setScoreField(n, f.key, e.target.value)}
                        style={{ ...inputStyle, width: 80, padding: "6px 8px" }}
                      />
                    </div>
                  ))}
                  <div style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#c9a227" }}>
                    総合 {total.toLocaleString()}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ marginBottom: 20 }}>
        <label style={{ display: "block", fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginBottom: 6 }}>タイムライン・メモ(任意)</label>
        <textarea
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="例: 帝王の時代に入った順、誰が中盤で伸びたか、荒らしを受けた人など"
          rows={3}
          style={{ ...inputStyle, width: "100%", resize: "vertical", fontFamily: "'Inter', sans-serif" }}
        />
      </div>

      <button onClick={handleSave} disabled={!canSave} style={{ ...primaryButton, opacity: canSave ? 1 : 0.4, cursor: canSave ? "pointer" : "not-allowed" }}>
        {saved ? "保存しました ✓" : "この試合を保存"}
      </button>
    </div>
  );
}

function TeamPreview({ title, names, color, agg }) {
  const avgElo = names.length ? Math.round(names.reduce((s, n) => s + (agg.players[n]?.elo ?? BASE_ELO), 0) / names.length) : 0;
  return (
    <div style={{ flex: 1, background: "#221d18", border: `1px solid ${color}44`, borderRadius: 10, padding: 14 }}>
      <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color, fontSize: 14, marginBottom: 8 }}>{title}</div>
      {names.length === 0 && <div style={{ color: "#665c4f", fontSize: 13 }}>未選択</div>}
      {names.map((n) => (
        <div key={n} style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", marginBottom: 4 }}>
          {displayName(n)} <span style={{ color: "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }}>({Math.round(agg.players[n]?.elo ?? BASE_ELO)})</span>
        </div>
      ))}
      {names.length > 0 && (
        <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #3a3128", fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#a89a86" }}>
          平均レート: {avgElo}
        </div>
      )}
    </div>
  );
}

function TeamBuilder({ agg, matches }) {
  const [selected, setSelected] = useState([]);
  const roster = [...HUMAN_NAMES, ...AI_NAMES].filter((n) => (agg.players[n]?.games ?? 0) > 0 || CHATGPT_RATING[n] !== undefined);
  const session = useMemo(() => currentSession(matches), [matches]);
  const form = useMemo(() => sessionForm(session, agg), [session, agg]);
  const sessionIsRecent = session.length > 0 && Date.now() - session[session.length - 1].id <= SESSION_RECENT_MS;
  const [useSession, setUseSession] = useState(sessionIsRecent);

  const [roles, setRoles] = useState({}); // 前衛・後衛の指定。ないものは指定なし
  const [pairRules, setPairRules] = useState([]); // 同じチーム・別のチームの指定
  const [pairDraft, setPairDraft] = useState({ a: "", b: "", type: "same" });
  const addPairRule = () => {
    const { a, b, type } = pairDraft;
    if (!a || !b || a === b) return;
    // 同じ2人の指定は新しいもので置き換える
    setPairRules((rs) => [...rs.filter((r) => !((r.a === a && r.b === b) || (r.a === b && r.b === a))), { a, b, type }]);
    setPairDraft({ a: "", b: "", type });
  };
  const rstats = useMemo(() => roleStats(agg), [agg]);
  const prefOf = (n) => roleVerdict(rstats[ratingKey(n)]).side;
  const half = selected.length / 2;
  const canUseRoles = selected.length % 2 === 0 && half >= ROLE_MIN_TEAM;
  const activeRoles = canUseRoles ? Object.fromEntries(selected.filter((n) => roles[n]).map((n) => [n, roles[n]])) : {};

  const toggle = (n) => {
    setSelected((s) => (s.includes(n) ? s.filter((x) => x !== n) : [...s, n]));
  };
  const setRole = (n, r) => setRoles((m) => {
    const next = { ...m };
    if (r) next[n] = r; else delete next[n];
    return next;
  });

  const ratingOf = (n) => (agg.players[n]?.elo ?? BASE_ELO) + (useSession ? form.adj[n] || 0 : 0);
  const roleKey = JSON.stringify(activeRoles);
  const splits = useMemo(
    () => suggestSplits(selected, agg, ratingOf, useSession ? session : [], { roleOf: activeRoles, prefOf, pairRules }),
    [selected, agg, useSession, session, form, roleKey, rstats, pairRules]
  );
  const activePairRules = pairRules.filter((r) => selected.includes(r.a) && selected.includes(r.b));
  const flankCount = Object.values(activeRoles).filter((r) => r === "flank").length;
  const pocketCount = Object.values(activeRoles).filter((r) => r === "pocket").length;
  const lastMatch = session[session.length - 1];
  const pct = (p) => `${Math.round(p * 100)}%`;
  const signed = (v) => `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(Math.round(v))}`;

  return (
    <div>
      <h2 style={h2Style}>チーム分け提案</h2>
      <p style={subText}>今日参加するメンバーを選んでください(偶数人数)。レートと相性を合わせた実力差が小さい案を上位から提案します。AI1〜5は強さがすべて同じものとして計算されます。</p>

      {session.length > 0 && (
        <div style={{ ...cardStyle, marginTop: 16, borderColor: useSession ? "#c9a22766" : "#3a3128" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227" }}>
              直前の試合を踏まえる(
              {session[0].date && session[0].date !== lastMatch.date ? `${session[0].date}〜` : ""}
              {lastMatch.date || "日付なし"}・{session.length}試合)
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Toggle label={useSession ? "反映中" : "反映しない"} active={useSession} onClick={() => setUseSession((v) => !v)} />
              <Toggle label="前の試合のメンバーを選択" active={false} onClick={() => setSelected([...lastMatch.teamA, ...lastMatch.teamB])} />
            </div>
          </div>
          <div style={{ marginTop: 8, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7 }}>
            {form.log.map(({ match: m, expectedA, share, delta }, i) => (
              <div key={m.id}>
                {i + 1}戦目: Team {m.winner} 勝利
                (試合前の予想勝率 A {pct(expectedA)}{share !== null && ` / スコア比 ${Math.round(share * 100)}:${Math.round((1 - share) * 100)}`})
                → 勝ったチーム {signed(Math.abs(delta))}、負けたチーム {signed(-Math.abs(delta))}
              </div>
            ))}
            <div style={{ marginTop: 4, color: "#8b7a6b" }}>
              今日の調子:{" "}
              {Object.entries(form.adj)
                .sort((a, b) => b[1] - a[1])
                .map(([n, v]) => `${displayName(n)} ${signed(v)}`)
                .join(" / ")}
            </div>
            <div style={{ marginTop: 4, fontSize: 11, color: "#665c4f" }}>
              予想より勝ったチームのレートを一時的に上げ、負けたチームを下げて提案します(スコアが大差ほど強めに反映)。記録されるレートには影響しません。
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "16px 0 24px" }}>
        {roster.map((n) => (
          <Toggle key={n} label={displayName(n)} active={selected.includes(n)} onClick={() => toggle(n)} />
        ))}
      </div>

      {selected.length % 2 !== 0 && selected.length > 0 && (
        <div style={{ color: "#c98a4b", fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 16 }}>
          人数が奇数です。AIを1体追加するか、メンバーを調整してください。
        </div>
      )}

      {selected.length >= 2 && (
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227" }}>同じチーム・別のチームの指定(任意)</div>
          <div style={{ fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7, marginTop: 4 }}>
            「この2人は同じチーム」「この2人は別のチーム」を指定すると、それを満たす分け方だけを提案します。
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
            <select value={pairDraft.a} onChange={(e) => setPairDraft((d) => ({ ...d, a: e.target.value }))} style={selectStyle} aria-label="1人目">
              <option value="">1人目</option>
              {selected.map((n) => <option key={n} value={n}>{displayName(n)}</option>)}
            </select>
            <span style={{ fontSize: 12, color: "#8b7a6b" }}>と</span>
            <select value={pairDraft.b} onChange={(e) => setPairDraft((d) => ({ ...d, b: e.target.value }))} style={selectStyle} aria-label="2人目">
              <option value="">2人目</option>
              {selected.filter((n) => n !== pairDraft.a).map((n) => <option key={n} value={n}>{displayName(n)}</option>)}
            </select>
            <span style={{ fontSize: 12, color: "#8b7a6b" }}>を</span>
            <Toggle label="同じチーム" active={pairDraft.type === "same"} color="#8fa876" onClick={() => setPairDraft((d) => ({ ...d, type: "same" }))} />
            <Toggle label="別のチーム" active={pairDraft.type === "diff"} color="#c98a4b" onClick={() => setPairDraft((d) => ({ ...d, type: "diff" }))} />
            <Toggle label="追加" active={!!(pairDraft.a && pairDraft.b && pairDraft.a !== pairDraft.b)} onClick={addPairRule} />
          </div>
          {pairRules.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 10 }}>
              {pairRules.map((r) => {
                const active = activePairRules.includes(r);
                return (
                  <div key={`${r.a}|${r.b}`} style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: "'Inter', sans-serif", fontSize: 13, color: active ? "#ede4d3" : "#665c4f" }}>
                    <span style={{ fontSize: 11, fontWeight: 600, color: r.type === "same" ? "#8fa876" : "#c98a4b" }}>{r.type === "same" ? "同じチーム" : "別のチーム"}</span>
                    <span>{displayName(r.a)} × {displayName(r.b)}</span>
                    {!active && <span style={{ fontSize: 11 }}>(選ばれていない人がいるので使っていません)</span>}
                    <button
                      onClick={() => setPairRules((rs) => rs.filter((x) => x !== r))}
                      style={{ background: "transparent", border: "none", color: "#8b7a6b", cursor: "pointer", fontSize: 13 }}
                      aria-label="この指定を消す"
                    >
                      ✕
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {canUseRoles && (
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227" }}>前衛・後衛の指定(任意)</div>
          <div style={{ fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7, marginTop: 4 }}>
            指定した人がその役割になる分け方だけを提案します。各チームの前衛(両端)は2人、残り{half - 2}人が後衛です。
            指定しない人は、録画で前衛が得意な人から前衛に入れます。全員「指定なし」なら今までどおり役割を決めずに提案します。
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
            {selected.map((n) => {
              const pref = prefOf(n);
              return (
                <div key={n} style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ width: 120, fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>{displayName(n)}</span>
                  <Toggle label="指定なし" active={!roles[n]} onClick={() => setRole(n, null)} />
                  <Toggle label="前衛" active={roles[n] === "flank"} color="#c07a6f" onClick={() => setRole(n, "flank")} />
                  <Toggle label="後衛" active={roles[n] === "pocket"} color="#7f9bb5" onClick={() => setRole(n, "pocket")} />
                  {pref && <span style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>録画では{ROLE_JA[pref]}が得意</span>}
                </div>
              );
            })}
          </div>
          {(flankCount > 4 || pocketCount > 2 * (half - 2)) && (
            <div style={{ marginTop: 8, color: "#c98a4b", fontFamily: "'Inter', sans-serif", fontSize: 13 }}>
              {flankCount > 4 ? `前衛は両チーム合わせて4人までです(いま${flankCount}人)。` : `後衛は両チーム合わせて${2 * (half - 2)}人までです(いま${pocketCount}人)。`}
            </div>
          )}
          {Object.keys(activeRoles).length > 0 && (
            <div style={{ marginTop: 8, fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif", lineHeight: 1.7 }}>
              ゲームでは、ロビーの設定で「Team Together」と「Team Positions」をオンにし、案に出ている色の番号に各人を入れてください。
              チームの中で番号が最小と最大の人が前衛(両端)、間の番号の人が後衛になります(左右どちら向きに並ぶかは選べません)。
            </div>
          )}
        </div>
      )}

      {splits.map((s, i) => {
        // 各チームに表示している avg・相性の値と足し算が合うよう、丸めた後の値で内訳を出す(正ならTeam Aが上)
        const eloEdge = Math.round(s.eloA) - Math.round(s.eloB);
        const synergyEdge = Math.round(s.synergyA) - Math.round(s.synergyB);
        const totalEdge = eloEdge + synergyEdge;
        const edgeText = (v) => (v === 0 ? "差なし" : `${v > 0 ? "A" : "B"}+${Math.abs(v)}`);
        return (
        <div key={i} style={{ ...cardStyle, marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
            <div>
              <span style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color: "#c9a227", fontSize: 14 }}>
                案 {i + 1}
              </span>
              {s.alreadyPlayed && (
                <span style={{ marginLeft: 8, fontSize: 11, color: "#c98a4b", fontFamily: "'Inter', sans-serif" }}>今日すでに対戦した組み合わせ</span>
              )}
            </div>
            <div
              style={{ textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}
              title="実力 = 平均レート + 相性。相性は、一緒に組んだときの勝率が2人のレートから予想される勝率よりどれだけ高いか(低いか)で、試合数が少ないほど0に寄せています。要注意・好相性に表示されない小さな補正も含みます。実力差が小さい順に提案しています。"
            >
              <div style={{ fontSize: 12, color: "#a89a86" }}>
                実力差(相性込み) {Math.abs(totalEdge)}{totalEdge !== 0 && ` · Team ${totalEdge > 0 ? "A" : "B"}が上`}
              </div>
              <div style={{ fontSize: 10, color: "#665c4f", marginTop: 2 }}>
                平均レート {edgeText(eloEdge)} / 相性 {edgeText(synergyEdge)}
              </div>
              <div style={{ fontSize: 10, color: "#665c4f", marginTop: 2 }}>
                予想勝率 A {pct(s.winProbA)} : B {pct(1 - s.winProbA)}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 20 }}>
            <SplitTeam title="Team A" names={s.teamA} elo={s.eloA} synergy={s.synergyA} color="#8fa876" notes={s.notesA} roles={s.rolesA} colorStart={1} />
            <SplitTeam title="Team B" names={s.teamB} elo={s.eloB} synergy={s.synergyB} color="#c98a4b" notes={s.notesB} roles={s.rolesB} colorStart={s.teamA.length + 1} />
          </div>
        </div>
        );
      })}

      {selected.length >= 2 && selected.length % 2 === 0 && splits.length === 0 && (
        <div style={{ color: "#a89a86", fontSize: 13 }}>
          {Object.keys(activeRoles).length > 0 || activePairRules.length > 0
            ? "指定した前衛・後衛や同じチーム・別のチームの組み合わせでは2チームに分けられません。指定を減らしてください。"
            : "候補を計算中、またはメンバーが足りません。"}
        </div>
      )}
    </div>
  );
}

function SplitTeam({ title, names, elo, synergy, color, notes, roles, colorStart }) {
  const syn = Math.round(synergy);
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color, fontSize: 13, marginBottom: 6 }}>
        {title} <span style={{ color: "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>avg {Math.round(elo)}</span>
        <span style={{ color: syn > 0 ? "#8fa876" : syn < 0 ? "#c07a6f" : "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>
          {" "}· 相性 {syn > 0 ? "+" : syn < 0 ? "−" : "±"}{Math.abs(syn)}
        </span>
      </div>
      {roles
        ? roles.order.map((n, i) => {
            const role = roles.flank.includes(n) ? "flank" : "pocket";
            return (
              <div key={n} style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#8b7a6b" }}>色{colorStart + i} </span>
                <span style={{ fontSize: 11, fontWeight: 600, color: role === "flank" ? "#c07a6f" : "#7f9bb5" }}>{ROLE_JA[role]}</span>{" "}
                {displayName(n)}
                {roles.auto.includes(n) && <span style={{ fontSize: 10, color: "#665c4f" }}> (自動)</span>}
              </div>
            );
          })
        : names.map((n) => (
            <div key={n} style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>{displayName(n)}</div>
          ))}
      {notes.map((note, idx) => (
        <div key={idx} style={{ marginTop: 6, fontSize: 11, fontFamily: "'Inter', sans-serif", color: note.type === "good" ? "#8fa876" : "#c07a6f" }}>
          {note.type === "good" ? "◎ 好相性" : "✕ 要注意"}: {displayName(note.pair[0])}×{displayName(note.pair[1])} {note.bonus > 0 ? "+" : "−"}{Math.abs(Math.round(note.bonus))}
          ({note.games}戦 {(note.actual * 100).toFixed(0)}%、実力からの予想 {(note.expected * 100).toFixed(0)}%)
        </div>
      ))}
    </div>
  );
}

function Synergy({ agg }) {
  const [focus, setFocus] = useState(null);
  const pairs = Object.entries(agg.teammate)
    .map(([k, v]) => ({ pair: k.split("|"), ...v, wr: v.games ? v.wins / v.games : 0 }))
    .filter((p) => p.games >= 5 && !p.pair.some((n) => SEED_PLAYERS[n]?.isAI))
    .filter((p) => !focus || p.pair.includes(focus))
    .sort((a, b) => b.games - a.games);

  const h2hList = Object.entries(agg.h2h)
    .map(([k, v]) => ({ pair: k.split("|"), ...v }))
    .filter((p) => p.games >= 5 && !p.pair.some((n) => SEED_PLAYERS[n]?.isAI))
    .filter((p) => !focus || p.pair.includes(focus))
    .sort((a, b) => b.games - a.games);

  return (
    <div>
      <h2 style={h2Style}>相性データ</h2>
      <p style={subText}>5戦以上のペアのみ表示しています。名前をクリックすると、その人が絡む組み合わせだけに絞り込めます。</p>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "16px 0 24px" }}>
        {HUMAN_NAMES.filter((n) => (agg.players[n]?.games ?? 0) > 0).map((n) => (
          <Toggle key={n} label={displayName(n)} active={focus === n} onClick={() => setFocus(focus === n ? null : n)} />
        ))}
      </div>

      <h3 style={h3Style}>チームメイト時の勝率</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 28 }}>
        {pairs.map((p, i) => (
          <div key={i} style={{ ...cardStyle, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
              {displayName(p.pair[0])} × {displayName(p.pair[1])}
            </span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: p.wr >= 0.55 ? "#8fa876" : p.wr <= 0.45 ? "#c07a6f" : "#a89a86" }}>
              {p.games}戦 {(p.wr * 100).toFixed(1)}%
            </span>
          </div>
        ))}
      </div>

      <h3 style={h3Style}>直接対決</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {h2hList.map((p, i) => {
          const bWins = p.games - p.aWins;
          return (
            <div key={i} style={{ ...cardStyle, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
                {displayName(p.pair[0])} vs {displayName(p.pair[1])}
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#a89a86" }}>
                {p.aWins}勝 - {bWins}勝 (計{p.games})
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   総評(Claude Code による分析)
   文章は REVIEW_DATE 時点のデータを Claude Code が分析して書いた固定のテキスト。
   数値(レート・勝率・スコア構成・相性・直接対決)は表示のたびに最新データから計算する。
   文章を更新したいときは、Claude Code に「総評を最新データで書き直して」と頼む。
   ============================================================ */
/* ------------------------------------------------------------
   試合の途中の時点での傾向(録画から毎回計算する。録画を取り込み直すと自動で更新される)
   試合終了時の合計は、優勢になって余裕ができた後に増えた分(結果)を含むので、勝敗との関係は途中の時点で比べる。
   その時点から15分以上続いた試合だけを使い、勝負がほぼ決まった後の差は入れない(2026/10 ユーザー指摘)
   ------------------------------------------------------------ */
const MIDGAME_MARGIN = 15 * 60;

// 時点 cp(分)で、key(v=町の人, m=軍 など)の人間の平均が多かったチームが勝った数
function midgameCompare(cp, key, role = null) {
  let w = 0, n = 0;
  REPLAYS.forEach((r) => {
    if (r.edition === "HD" || (r.winner !== "A" && r.winner !== "B") || r.duration < cp * 60 + MIDGAME_MARGIN) return;
    const avg = (team) => {
      const v = team.filter((x) => ratingKey(x) !== AI_KEY && (!role || r.players[x]?.role === role))
        .map((x) => r.players[x]?.at?.[cp]?.[key]).filter((x) => x !== undefined);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    const a = avg(r.teamA), b = avg(r.teamB);
    if (a === null || b === null || a === b) return;
    n += 1;
    if ((a > b) === (r.winner === "A")) w += 1;
  });
  return { w, n, pct: n ? Math.round((100 * w) / n) : null };
}

// 順位相関(同順位は平均の順位)
function rankCorr(xs, ys) {
  const ranks = (v) => {
    const idx = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]);
    const r = new Array(v.length);
    for (let i = 0; i < idx.length;) {
      let k = i;
      while (k + 1 < idx.length && idx[k + 1][0] === idx[i][0]) k += 1;
      for (let m = i; m <= k; m++) r[idx[m][1]] = (i + k) / 2;
      i = k + 1;
    }
    return r;
  };
  const a = ranks(xs), b = ranks(ys);
  const ma = a.reduce((x, y) => x + y, 0) / a.length, mb = b.reduce((x, y) => x + y, 0) / b.length;
  let num = 0, da = 0, db = 0;
  a.forEach((x, i) => { num += (x - ma) * (b[i] - mb); da += (x - ma) ** 2; db += (b[i] - mb) ** 2; });
  return da && db ? num / Math.sqrt(da * db) : 0;
}

// 5分ごとの区間 [from, to)(区間の番号。0=0〜5分)での操作の数を、人間の平均で両チーム比べる。
// 区間の終わりから15分以上続いた試合だけを使う
function midgameActionCompare(from, to, cats, role = null) {
  let w = 0, n = 0;
  REPLAYS.forEach((r) => {
    if (r.edition === "HD" || (r.winner !== "A" && r.winner !== "B") || r.duration < to * 300 + MIDGAME_MARGIN) return;
    const avg = (team) => {
      const v = team.filter((x) => ratingKey(x) !== AI_KEY && (!role || r.players[x]?.role === role) && (r.players[x]?.aw?.length || 0) >= to)
        .map((x) => { let c = 0; for (let k = from; k < to; k++) cats.forEach((ci) => (c += r.players[x].aw[k][ci])); return c; });
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    const a = avg(r.teamA), b = avg(r.teamB);
    if (a === null || b === null || a === b) return;
    n += 1;
    if ((a > b) === (r.winner === "A")) w += 1;
  });
  return { w, n, pct: n ? Math.round((100 * w) / n) : null };
}

const MIDGAME = (() => {
  const players = [];
  REPLAYS.forEach((r) => {
    if (r.edition === "HD") return;
    Object.entries(r.players).forEach(([n, p]) => {
      if (ratingKey(n) === AI_KEY || !p.at) return;
      players.push({ r, n, p });
    });
  });
  const corrOf = (rows, fx, fy) => {
    const pts = rows.map(({ p }) => [fx(p), fy(p)]).filter(([x, y]) => x !== undefined && y !== undefined);
    return pts.length >= 20 ? Math.round(rankCorr(pts.map((q) => q[0]), pts.map((q) => q[1])) * 100) / 100 : null;
  };
  const flank = players.filter(({ p }) => p.role === "flank");
  // 前衛を15分時点の町の人・軍の多い/少ないで4つに分けた勝敗(30分以上続いた試合)
  const f15 = flank.filter(({ r, p }) => p.at["15"] && r.winner && r.duration >= 1800);
  const mv = median(f15.map(({ p }) => p.at["15"].v)) ?? 0, mm = median(f15.map(({ p }) => p.at["15"].m)) ?? 0;
  const cell = (vHigh, mHigh) => {
    const g = f15.filter(({ p }) => (p.at["15"].v > mv) === vHigh && (p.at["15"].m > mm) === mHigh);
    const wins = g.filter(({ r, n }) => (r.winner === "A") === r.teamA.includes(n)).length;
    return { wins, games: g.length };
  };
  const vFlank = ["15", "20", "25"].map((cp) => midgameCompare(cp, "v", "flank")).filter((x) => x.n);
  const pcts = vFlank.map((x) => x.pct);
  const ALL_CATS = [0, 1, 2, 3, 4, 5, 6];
  return {
    // 操作(eAPM): 0〜15分の合計・移動と指示、10〜15分の生産の命令(2 = 生産)
    actTotal015: midgameActionCompare(0, 3, ALL_CATS),
    actMove015: midgameActionCompare(0, 3, [0, 1]),
    queue1015: midgameActionCompare(2, 3, [2]),
    queue1015Flank: midgameActionCompare(2, 3, [2], "flank"),
    // 前衛の10〜15分の生産の命令(実際の時間の1分あたり)の中央値。診断の目安に使う
    queue1015FlankMedian: median(players.filter(({ r, p }) => p.role === "flank" && p.aw?.length >= 3).map(({ r, p }) => p.aw[2][2] / (5 / replaySpeed(r)))),
    m15: midgameCompare("15", "m"),
    m15Flank: midgameCompare("15", "m", "flank"),
    vFlankLo: pcts.length ? Math.min(...pcts) : null,
    vFlankHi: pcts.length ? Math.max(...pcts) : null,
    vFlankGames: vFlank[0]?.n ?? 0,
    corrFlank15: corrOf(flank, (p) => p.at["15"]?.v, (p) => p.at["15"]?.m),
    corr20to25: corrOf(players, (p) => p.at["20"]?.v, (p) => p.at["25"]?.m),
    cells: { vm: cell(true, true), Vm: cell(false, true), vM: cell(true, false), VM: cell(false, false) },
    medians: { v: mv, m: mm },
  };
})();
const pctRange = (lo, hi) => (lo === null ? "−" : lo === hi ? `${lo}%` : `${lo}〜${hi}%`);
const winText = (c) => `${c.wins}勝${c.games - c.wins}敗${c.games ? `(${Math.round((100 * c.wins) / c.games)}%)` : ""}`;

const SCORE_COLORS = { military: "#c07a6f", economy: "#8fa876", tech: "#7f9bb5", society: "#c9a227" };

function ScoreMixBar({ scoreHistory }) {
  const totals = SCORE_FIELDS.map((f) => scoreHistory.reduce((s, r) => s + (r[f.key] || 0), 0));
  const sum = totals.reduce((a, b) => a + b, 0);
  if (!sum) return <div style={{ fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>スコア付きの記録なし</div>;
  return (
    <div>
      <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", background: "#171310" }}>
        {SCORE_FIELDS.map((f, i) => (
          <div key={f.key} title={`${f.label} ${Math.round((totals[i] / sum) * 100)}%`} style={{ width: `${(totals[i] / sum) * 100}%`, background: SCORE_COLORS[f.key] }} />
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4, fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86" }}>
        {SCORE_FIELDS.map((f, i) => (
          <span key={f.key}>
            <span style={{ color: SCORE_COLORS[f.key] }}>■</span> {f.label} {Math.round((totals[i] / sum) * 100)}%
          </span>
        ))}
        <span style={{ color: "#665c4f" }}>({scoreHistory.length}試合・平均総合 {Math.round(sum / scoreHistory.length).toLocaleString()})</span>
      </div>
    </div>
  );
}

function PlayerReviewCard({ name, review, agg, player, rstat, roleStat }) {
  const advice = PLAYER_ADVICE[name];
  const p = player || agg.players[name];
  if (!p) return null;
  const others = HUMAN_NAMES.filter((m) => m !== name && (agg.players[m]?.games ?? 0) > 0);
  const partners = others
    .map((m) => ({ m, s: pairSynergy(name, m, agg) }))
    .filter((x) => x.s && x.s.games >= 5)
    .sort((a, b) => b.s.bonus - a.s.bonus);
  const best = partners.filter((x) => x.s.bonus >= 3).slice(0, 2);
  const worst = partners.filter((x) => x.s.bonus <= -3).slice(-2).reverse();
  // 直接対決で、実力から予想される勝率と10%以上違う相手(10戦以上)
  const h2h = others
    .map((m) => {
      const k = pairKey(name, m);
      const h = agg.h2h[k];
      if (!h || h.games < 10) return null;
      const wins = k.split("|")[0] === name ? h.aWins : h.games - h.aWins;
      const expected = eloWinProb((p.elo - agg.players[m].elo) / agg.ratingModel.teamSize);
      return { m, wins, games: h.games, diff: wins / h.games - expected };
    })
    .filter((x) => x && Math.abs(x.diff) >= 0.1)
    .sort((a, b) => b.diff - a.diff);
  const tier = ageTier(p.elo);
  const small = { fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };
  return (
    <div style={{ ...cardStyle, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 16, color: "#ede4d3" }} title={p.title || ""}>
          {p.label || displayName(name)}

function RoleCell({ st, role, ai }) {
  const small = { fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.6 };
  if (!st || !st.games) return <div style={{ ...small, color: "#665c4f" }}>{ROLE_JA[role]}: 録画なし</div>;
  const rate = st.decided ? st.wins / st.decided : null;
  const diff = st.decided ? (st.wins - st.expected) / st.decided : null;
  const mean = (a) => (a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null);
  const score = mean(st.scores.map((x) => x.total));
  return (
    <div style={small}>
      <span style={{ color: "#ede4d3", fontWeight: 700 }}>{ROLE_JA[role]}</span>{" "}
      <span style={{ fontFamily: "'JetBrains Mono', monospace", color: rate === null ? "#a89a86" : rate >= 0.5 ? "#8fa876" : "#c07a6f" }}>
        {st.wins}勝{st.decided - st.wins}敗{rate !== null ? `(${Math.round(rate * 100)}%)` : ""}
      </span>
      {diff !== null && (
        <span style={{ color: diff >= 0 ? "#8fa876" : "#c07a6f" }} title="両チームの平均レートから予想される勝率との差">
          {" "}予想比{diff >= 0 ? "+" : "−"}{Math.abs(Math.round(diff * 100))}%
        </span>
      )}
      {!ai && (<>
        <br />
        領主 {fmtTime(median(st.feudal))}・城主 {fmtTime(median(st.castle))}・帝王 {fmtTime(median(st.imperial))}
        <br />
        15分時点の軍 {st.m15.length ? median(st.m15) : "−"}・町の人 {mean(st.villagers) ?? "−"}・軍 {mean(st.military) ?? "−"}

  );
}

// 前衛・後衛 × 勝ち・負け の4パターンに分けた傾向。
// 前衛と後衛では進化のタイミングなどの戦略が違い、勝った試合と負けた試合では余裕の有無が違うため(2026/10 ユーザー要望)
function roleWinSplit(key) {
  const groups = [
    { role: "flank", won: true, label: "前衛・勝ち" }, { role: "flank", won: false, label: "前衛・負け" },
    { role: "pocket", won: true, label: "後衛・勝ち" }, { role: "pocket", won: false, label: "後衛・負け" },
    { role: null, won: null, label: "位置不明・勝敗不明" },
  ].map((g) => ({ ...g, games: 0, feudal: [], castle: [], imperial: [], m15: [], v25: [] }));
  REPLAYS.forEach((r) => {
    Object.entries(r.players).forEach(([n, p]) => {
      if (ratingKey(n) !== key) return;
      const won = r.winner ? (r.winner === "A") === r.teamA.includes(n) : null;
      const g = p.role && won !== null ? groups.find((x) => x.role === p.role && x.won === won) : groups[4];
      g.games += 1;
      ["feudal", "castle", "imperial"].forEach((age) => p.ages[age] !== undefined && g[age].push(p.ages[age]));
      if (p.at?.["15"]) g.m15.push(p.at["15"].m);
      if (p.at?.["25"]) g.v25.push(p.at["25"].v);
    });
  });
  return groups.filter((g) => g.games > 0);
}

// 町の人・軍の推移(5分ごとの累計の平均)。位置(前衛/後衛)と勝敗で絞り込める(2026/10 ユーザー要望)
// 軍は40分以降に多く作られる(試合の長さは中央値55分ほど)ので、表は60分、グラフは80分まで出す(2026/10 ユーザー指摘)
const PROD_CPS = ["5", "10", "15", "20", "25", "30", "35", "40", "45", "50", "55", "60"];
const PROD_MINUTES = 80; // グラフは0分から1分ごと
// 長い時点ほど試合数が少なくなるので、これより少ない時点はグラフの線を切る(表では薄く表示する)
const PROD_MIN_GAMES = 5;
const PROD_MIN_GAMES_GROUP = 10;
const PROD_METRICS = { v: "町の人", m: "軍" };

function productionByPlayer(keys, metric, role, result) {
  const acc = {};
  const all = {};
  const accMin = {};
  const allMin = [];
  REPLAYS.forEach((r) => {
    if (r.edition === "HD") return;
    Object.entries(r.players).forEach(([n, p]) => {
      const k = ratingKey(n);
      if (k === AI_KEY || !p.at) return;
      if (role !== "all" && p.role !== role) return;
      if (result !== "all") {
        if (!r.winner) return;
        const won = (r.winner === "A") === r.teamA.includes(n);
        if (won !== (result === "win")) return;
      }
      Object.entries(p.at).forEach(([cp, c]) => {
        (all[cp] = all[cp] || []).push(c[metric]);
        if (!keys.includes(k)) return;
        acc[k] = acc[k] || {};
        (acc[k][cp] = acc[k][cp] || []).push(c[metric]);
      });
      (p.pm?.[metric] || []).forEach((val, i) => {
        if (i > PROD_MINUTES) return;
        (allMin[i] = allMin[i] || []).push(val);
        if (!keys.includes(k)) return;
        accMin[k] = accMin[k] || [];
        (accMin[k][i] = accMin[k][i] || []).push(val);
      });
    });
  });
  const summarize = (arr) => (arr && arr.length ? { avg: arr.reduce((a, b) => a + b, 0) / arr.length, n: arr.length } : null);
  const players = {};
  keys.forEach((k) => (players[k] = Object.fromEntries(PROD_CPS.map((cp) => [cp, summarize(acc[k]?.[cp])]))));
  const group = Object.fromEntries(PROD_CPS.map((cp) => [cp, summarize(all[cp])]));
  // グラフ用の1分ごとの平均(0〜PROD_MINUTES 分)
  const minutes = [...Array(PROD_MINUTES + 1).keys()];
  const playersMin = {};
  keys.forEach((k) => (playersMin[k] = minutes.map((i) => summarize(accMin[k]?.[i]))));
  const groupMin = minutes.map((i) => summarize(allMin[i]));
  return { players, group, playersMin, groupMin };
}

// 見やすい目盛りの間隔(1・2・5・10…のどれか)
function niceStep(span, count = 5) {
  const raw = Math.max(span, 1) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const r = raw / mag;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
}

function ProductionLineChart({ data, keys, focus, setFocus, metric, from, to }) {
  const W = 640, H = 240, L = 40, R = 90, T = 12, B = 26;
  const inRange = (i) => i >= from && i <= to;
  // Y軸は、選んだ期間に入っている値の最小〜最大に合わせる(前半の小さな差も見えるように)
  const vals = [];
  const ok = (v, minN) => v && v.n >= minN;
  keys.forEach((k) => data.playersMin[k].forEach((v, i) => ok(v, PROD_MIN_GAMES) && inRange(i) && vals.push(v.avg)));
  data.groupMin.forEach((v, i) => ok(v, PROD_MIN_GAMES_GROUP) && inRange(i) && vals.push(v.avg));
  const lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 10;
  const step = niceStep(hi - lo);
  const bottom = Math.floor(lo / step) * step;
  const top = Math.max(bottom + step, Math.ceil(hi / step) * step);
  const x = (i) => L + ((i - from) * (W - L - R)) / Math.max(1, to - from);
  const y = (v) => T + (H - T - B) * (1 - (v - bottom) / (top - bottom));
  const path = (series, minN = PROD_MIN_GAMES) => {
    let d = "";
    series.forEach((v, i) => {
      if (!ok(v, minN) || !inRange(i)) return;
      d += `${d ? "L" : "M"}${x(i).toFixed(1)},${y(v.avg).toFixed(1)}`;
    });
    return d;
  };
  const ticks = [];
  for (let v = bottom; v <= top + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  const xStep = to - from <= 10 ? 1 : to - from <= 20 ? 2 : to - from <= 50 ? 5 : 10;
  const xTicks = [];
  for (let m = Math.ceil(from / xStep) * xStep; m <= to; m += xStep) xTicks.push(m);
  // 期間の始まりと終わりは必ず目盛りに出す(近すぎる目盛りは外す)
  if (xTicks[0] !== from) { if (xTicks.length && xTicks[0] - from < xStep / 2) xTicks.shift(); xTicks.unshift(from); }
  if (xTicks[xTicks.length - 1] !== to) { if (to - xTicks[xTicks.length - 1] < xStep / 2) xTicks.pop(); xTicks.push(to); }
  const lastPoint = (series, minN = PROD_MIN_GAMES) => {
    for (let i = Math.min(to, series.length - 1); i >= from; i--) if (ok(series[i], minN)) return { i, v: series[i].avg };
    return null;
  };
  const ordered = [...keys].sort((a, b) => (a === focus) - (b === focus)); // 強調する人を最後(一番上)に描く
  const fp = focus ? lastPoint(data.playersMin[focus]) : null;
  const gp = lastPoint(data.groupMin, PROD_MIN_GAMES_GROUP);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label={`${PROD_METRICS[metric]}の推移(${from}〜${to}分)`}>
      {ticks.map((v) => (
        <g key={v}>
          <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="#3a3128" strokeWidth="1" />
          <text x={L - 6} y={y(v) + 4} textAnchor="end" fontSize="10" fill="#8b7a6b" fontFamily="'JetBrains Mono', monospace">{v}</text>
        </g>
      ))}
      {xTicks.map((m) => (
        <text key={m} x={x(m)} y={H - 8} textAnchor="middle" fontSize="10" fill="#8b7a6b" fontFamily="'JetBrains Mono', monospace">{m}分</text>
      ))}
      <path d={path(data.groupMin, PROD_MIN_GAMES_GROUP)} fill="none" stroke="#a89a86" strokeWidth="2" strokeDasharray="5 4" />
      {gp && <text x={x(gp.i) + 6} y={y(gp.v) + 4} fontSize="10" fill="#a89a86" fontFamily="'Inter', sans-serif">全体の平均</text>}
      {ordered.map((k) => {
        const on = k === focus;
        const series = data.playersMin[k];
        const d = path(series);
        if (!d) return null;
        return (
          <g key={k} onMouseEnter={() => setFocus(k)} style={{ cursor: "pointer" }}>
            <path d={d} fill="none" stroke="transparent" strokeWidth="12" />
            <path d={d} fill="none" stroke={on ? "#d9b34a" : "#5a4f43"} strokeWidth={on ? 2.5 : 1.5} strokeLinejoin="round" strokeLinecap="round" />
            {on && xTicks.map((m) => {
              const v = series[m];
              return ok(v, PROD_MIN_GAMES) ? (
                <circle key={m} cx={x(m)} cy={y(v.avg)} r="4" fill="#d9b34a" stroke="#221d18" strokeWidth="2">
                  <title>{`${displayName(k)} ${m}分: ${PROD_METRICS[metric]} ${Math.round(v.avg * 10) / 10}(${v.n}試合の平均)`}</title>
                </circle>
              ) : null;
            })}
          </g>
        );
      })}
      {fp && <text x={x(fp.i) + 6} y={y(fp.v) - 6} fontSize="11" fontWeight="700" fill="#ede4d3" fontFamily="'Inter', sans-serif">{displayName(focus)}</text>}
    </svg>
  );
}

function ProductionHeatmap({ data, keys, focus, setFocus }) {
  // 時点ごとに、その時点の中で多い人ほど濃くする(時点が進むほど数が増えるので、列ごとに比べる)
  const range = Object.fromEntries(PROD_CPS.map((cp) => {
    const v = keys.map((k) => data.players[k][cp]?.avg).filter((x) => x !== undefined).map(Math.round); // 色は表示している整数で決める
    return [cp, v.length ? [Math.min(...v), Math.max(...v)] : [0, 0]];
  }));
  const cell = { ...monoSmall, fontSize: 11, padding: "4px 6px", textAlign: "right", whiteSpace: "nowrap" };
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ borderCollapse: "separate", borderSpacing: 2, minWidth: 680 }}>
        <thead>
          <tr>
            <th style={{ ...cell, textAlign: "left", color: "#665c4f" }}>プレイヤー</th>
            {PROD_CPS.map((cp) => <th key={cp} style={{ ...cell, color: "#665c4f" }}>{cp}分</th>)}
          </tr>
          <tr>
            <td style={{ ...cell, textAlign: "left", color: "#a89a86" }}>全体の平均</td>
            {PROD_CPS.map((cp) => <td key={cp} style={{ ...cell, color: "#a89a86" }}>{data.group[cp] ? Math.round(data.group[cp].avg) : "−"}</td>)}
          </tr>
          <tr>
            <td style={{ ...cell, textAlign: "left", color: "#665c4f" }}>(続いていた試合数)</td>
            {PROD_CPS.map((cp) => <td key={cp} style={{ ...cell, color: "#665c4f" }}>{data.group[cp]?.n ?? 0}</td>)}
          </tr>
        </thead>
        <tbody>
          {keys.map((k) => (
            <tr key={k} onClick={() => setFocus(k)} style={{ cursor: "pointer" }}>
              <td style={{ ...cell, textAlign: "left", color: k === focus ? "#d9b34a" : "#ede4d3", fontWeight: k === focus ? 700 : 400 }}>{displayName(k)}</td>
              {PROD_CPS.map((cp) => {
                const v = data.players[k][cp];
                if (!v) return <td key={cp} style={{ ...cell, color: "#4a4136" }}>−</td>;
                const [lo, hi] = range[cp];
                const t = hi > lo ? (Math.round(v.avg) - lo) / (hi - lo) : 0; // 全員同じ値の時点は色を付けない
                const few = v.n < PROD_MIN_GAMES;
                return (
                  <td key={cp} title={`${displayName(k)} ${cp}分: ${Math.round(v.avg)}(${v.n}試合の平均)`}
                    style={{ ...cell, borderRadius: 4, background: `rgba(217, 179, 74, ${(0.06 + 0.62 * t).toFixed(2)})`, color: t > 0.55 ? "#1b1712" : "#ede4d3", opacity: few ? 0.45 : 1, outline: k === focus ? "1px solid #d9b34a" : "none" }}>
                    {Math.round(v.avg)}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ------------------------------------------------------------

   選択や画面の移動は録画に残らないので入らない。「指示」は町の人の採集と軍の攻撃が同じ命令なので分けられない
   ------------------------------------------------------------ */
// desc は画面に出す説明。録画(DE の42試合・約24万回の命令)で中身を確かめて書いた(2026/10)
const ACTION_CATS = [

  { key: "gather", label: "集合地点", color: "#a89a86", desc: "建物の集合地点(生産したユニットが向かう場所)の設定" },
  { key: "other", label: "その他", color: "#665c4f",
    desc: "多い順に、生産の取り消し・建物への駐留・遠投投石機の組み立てと解体(特殊な命令)、ユニットや建物の削除、町の鐘、市場での売買、駐留の解除、畑や簗の自動予約の切り替え、地図上の合図、仕事に戻る、貢ぎ物、投了など。全体の操作の約5%です" },
];
const AGE_KEYS = ["dark", "feudal", "castle", "imperial"];
const AGE_SHORT = { dark: "暗黒", feudal: "領主", castle: "城主", imperial: "帝王" };

function playerFilterOk(r, n, p, role, result) {
  if (ratingKey(n) === AI_KEY) return false;
  if (role !== "all" && p.role !== role) return false;
  if (result !== "all") {
    if (!r.winner) return false;
    if (((r.winner === "A") === r.teamA.includes(n)) !== (result === "win")) return false;
  }
  return true;
}

// 時代(all/dark/feudal/castle/imperial)ごとの、種類別の1分あたりの操作数
function eapmByPlayer(keys, role, result, age) {
  const acc = {};
  REPLAYS.forEach((r) => {
    const sp = replaySpeed(r);
    Object.entries(r.players).forEach(([n, p]) => {
      const k = ratingKey(n);
      if (!keys.includes(k) || !p.ac || !playerFilterOk(r, n, p, role, result)) return;
      const a = (acc[k] = acc[k] || { min: 0, counts: ACTION_CATS.map(() => 0), games: 0 });
      a.games += 1;
      Object.entries(p.ac).forEach(([g, v]) => {
        if (age !== "all" && g !== age) return;
        a.min += v[0] / 60 / sp;
        ACTION_CATS.forEach((c, i) => (a.counts[i] += v[i + 1]));
      });
    });
  });
  return Object.fromEntries(keys.map((k) => {
    const a = acc[k];
    if (!a || a.min < 1) return [k, null];
    const rates = a.counts.map((c) => c / a.min);
    return [k, { rates, total: rates.reduce((x, y) => x + y, 0), games: a.games }];
  }));
}

// 5分ごとの1分あたりの操作数(cat が null なら合計)
const EAPM_WINDOWS = [...Array(12).keys()].map((i) => i * 5);
function eapmByWindow(keys, role, result, cat) {
  const acc = {};
  const all = EAPM_WINDOWS.map(() => []);
  REPLAYS.forEach((r) => {
    const sp = replaySpeed(r);
    Object.entries(r.players).forEach(([n, p]) => {
      const k = ratingKey(n);
      if (!p.aw || !playerFilterOk(r, n, p, role, result)) return;
      p.aw.forEach((counts, i) => {
        const c = cat === null ? counts.reduce((x, y) => x + y, 0) : counts[cat];
        const v = c / (5 / sp); // 5分(ゲーム内時間)= 5 / 速度 分(実際の時間)
        all[i].push(v);
        if (!keys.includes(k)) return;
        ((acc[k] = acc[k] || EAPM_WINDOWS.map(() => []))[i]).push(v);
      });
    });
  });
  const avg = (a) => (a && a.length ? { avg: a.reduce((x, y) => x + y, 0) / a.length, n: a.length } : null);
  return {
    players: Object.fromEntries(keys.map((k) => [k, EAPM_WINDOWS.map((_, i) => avg(acc[k]?.[i]))])),
    group: all.map(avg),
  };
}

        <span style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>5分ごと</span>
        <Toggle label="合計" active={cat === null} onClick={() => setCat(null)} />
        {ACTION_CATS.slice(0, 5).map((c, i) => <Toggle key={c.key} label={c.label} active={cat === i} onClick={() => setCat(i)} />)}
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ borderCollapse: "separate", borderSpacing: 2, minWidth: 680 }}>
          <thead>
            <tr>
              <th style={{ ...cell, textAlign: "left", color: "#665c4f" }}>プレイヤー</th>
              {EAPM_WINDOWS.map((w) => <th key={w} style={{ ...cell, color: "#665c4f" }}>{w}〜{w + 5}</th>)}
            </tr>
            <tr>
              <td style={{ ...cell, textAlign: "left", color: "#a89a86" }}>全体の平均</td>
              {byWindow.group.map((v, i) => <td key={i} style={{ ...cell, color: "#a89a86" }}>{v ? Math.round(v.avg) : "−"}</td>)}
            </tr>
          </thead>
          <tbody>
            {keys.map((k) => (
              <tr key={k}>
                <td style={{ ...cell, textAlign: "left", color: "#ede4d3" }}>{displayName(k)}</td>
                {byWindow.players[k].map((v, i) => {
                  if (!v) return <td key={i} style={{ ...cell, color: "#4a4136" }}>−</td>;
                  const [lo, hi] = range[i];
                  const t = hi > lo ? Math.min(1, Math.max(0, (Math.round(v.avg) - lo) / (hi - lo))) : 0;
                  return (
                    <td key={i} title={`${displayName(k)} ${EAPM_WINDOWS[i]}〜${EAPM_WINDOWS[i] + 5}分: ${v.avg.toFixed(1)}(${v.n}試合の平均)`}
                      style={{ ...cell, borderRadius: 4, background: `rgba(217, 179, 74, ${(0.06 + 0.62 * t).toFixed(2)})`, color: t > 0.55 ? "#1b1712" : "#ede4d3", opacity: v.n < PROD_MIN_GAMES ? 0.45 : 1 }}>
                      {Math.round(v.avg)}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ ...small, marginTop: 4 }}>
        5分ごとの区間(ゲーム内時間)の1分あたりの命令の数の平均です。同じ区間の中で多い人ほど濃く、試合数が{PROD_MIN_GAMES}未満のところは薄くしています。その区間の最後まで続いた試合だけで平均しています。
      </div>
    </div>
  );
}

function ReplayAnalysis({ agg }) {
  const stats = useMemo(() => replayStats(), []);
  const ratingOf = (k) => agg.ratingModel.ratings[k] ?? priorRating(k);
  const names = Object.keys(stats).filter((k) => stats[k].games >= 3).sort((a, b) => ratingOf(b) - ratingOf(a));
  const chartKeys = useMemo(() => names.filter((k) => k !== AI_KEY && stats[k].unitGames >= 3), [names.join(",")]);
  const civTotals = {};
  Object.entries(stats).forEach(([k, s]) => {
    if (k === AI_KEY) return;
    Object.entries(s.civs).forEach(([c, v]) => {
      const t = (civTotals[c] = civTotals[c] || { games: 0, wins: 0, decided: 0, players: new Set() });
      t.games += v.games;
      t.wins += v.wins;
      t.decided += v.decided;
      t.players.add(k);
    });
  });
  const civRows = Object.entries(civTotals).sort((a, b) => b[1].games - a[1].games);
  const first = REPLAYS[0], last = REPLAYS[REPLAYS.length - 1];
  const small = { fontSize: 12, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };

  if (!REPLAYS.length) {
    return (
      <div>
        <h2 style={h2Style}>録画分析</h2>
        <p style={subText}>録画データがありません。tools/import_replays.py で取り込んでください。</p>
      </div>
    );
  }
  return (
    <div>
      <h2 style={h2Style}>録画分析</h2>
      <p style={subText}>
        AoE2 の録画ファイル {REPLAYS.length}試合({replayDate(first)}〜{replayDate(last)}。うち2023/12〜2024/1 の{REPLAYS.filter((r) => r.edition === "HD").length}試合は AoE2 HD(2013年版)、ほかは DE)から取り出したデータです。
        HD の録画では生産数が取れないので、町の人や軍の数は DE の試合だけで計算しています。
        録画には各プレイヤーの操作だけが入っていて、スコアは入っていません。時代進化は「時代に到達した時刻」(研究を始めた時刻に研究時間 領主2:10・城主2:40・帝王3:10 を足したもの。ゲーム内時間)、研究は「研究を始めた時刻」、
        生産数は「キューに入れた数」で、あとで取り消した分や資源不足で作られなかった分も混じるので目安です。
        民兵系は民兵〜近衛剣士のように、アップグレード後のユニットも含みます。eAPM は実際の時間の1分あたりの操作数で、録画に残る命令(移動・生産・建設・研究など)だけを数えています。ユニットの選択や画面の移動は入らないので、ゲーム内やほかのツールで表示される APM より低めに出ます。各プレイヤーの表は、前衛(両端)・後衛(内側)と勝ち・負けで分けた中央値です(前衛と後衛では進化の戦略が違い、勝ち負けでは余裕の有無が違うため)。「15分の軍」「25分の町の人」はその時点までに作った数で、勝負が決まる前の様子を表します。帝王の時代は、到達した試合だけの中央値です。
      </p>

      <h3 style={{ ...h3Style, marginTop: 20 }}>町の人・軍の推移(5分ごと)</h3>
      <ProductionCharts keys={chartKeys} />

      <h3 style={h3Style}>操作(eAPM)の内訳</h3>
      <EapmSection keys={chartKeys} />

      <h3 style={h3Style}>プレイヤー別の傾向(現在のレート順)</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
        {names.map((k) => {
          const s = stats[k];
          return (
            <div key={k} style={cardStyle}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 14, color: "#ede4d3" }}>
                  {k === AI_KEY ? "AI(AI1〜5の合算)" : displayName(k)}
                </span>
                <span style={{ ...monoSmall, fontSize: 12 }}>
                  {s.games}試合{s.decided ? `・${s.wins}勝${s.decided - s.wins}敗` : ""}
                </span>
              </div>
              {k === AI_KEY ? (
                <div style={{ ...small, marginTop: 4 }}>
                  文明: {s.topCivs.slice(0, 6).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
                  <br />
                  <span style={{ color: "#665c4f" }}>AIの操作はほとんど録画に残らないため、時代進化や生産の傾向は出せません。</span>
                </div>
              ) : (<>
              <div style={{ ...small, marginTop: 4 }}>
                時代進化(全試合の中央値): 領主 {fmtTime(median(s.feudal))}・城主 {fmtTime(median(s.castle))}・帝王 {fmtTime(median(s.imperial))}
                <span style={{ color: "#665c4f" }}>(帝王の時代まで行った試合 {s.imperial.length}/{s.games})</span>
                <br />
                eAPM {Math.round(median(s.eapm))}・町の人 平均{s.villagers.length ? Math.round(s.villagers.reduce((a, b) => a + b, 0) / s.villagers.length) : "−"}人
                {s.techs.Wheelbarrow ? `・手押し車 ${fmtTime(median(s.techs.Wheelbarrow))}` : ""}
                {s.techs["Double-Bit Axe"] ? `・両刃斧 ${fmtTime(median(s.techs["Double-Bit Axe"]))}` : ""}
                {s.techs["Horse Collar"] ? `・引き具 ${fmtTime(median(s.techs["Horse Collar"]))}` : ""}
                <br />
                主な軍: {s.topUnits.map((x) => `${unitName(x.unit)} ${Math.round(x.perGame)}`).join("・")}
                <span style={{ color: "#665c4f" }}>(1試合あたり)</span>
                <br />
                文明: {s.topCivs.slice(0, 4).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
              </div>
              <div style={{ marginTop: 6 }}>
                <UnitMixBar mix={s.mix} note="(軍の生産数の内訳)" />
              </div>
              <RoleWinTable k={k} />
              </>)}
            </div>
          );
        })}
      </div>

      <h3 style={h3Style}>文明別の成績(人間のみ)</h3>
      <div style={{ ...cardStyle, marginBottom: 24, overflowX: "auto" }}>
        <div style={{ minWidth: 420 }}>
          {civRows.map(([c, t]) => (
            <div key={c} style={{ display: "grid", gridTemplateColumns: "120px 70px 80px 1fr", gap: 8, padding: "3px 0", ...monoSmall, fontSize: 12 }}>
              <span style={{ color: "#ede4d3" }}>{civName(c)}</span>
              <span>{t.games}試合</span>
              <span style={{ color: t.decided && t.wins / t.decided >= 0.5 ? "#8fa876" : "#c07a6f" }}>
                {t.decided ? `${t.wins}勝${t.decided - t.wins}敗` : "−"}
              </span>
              <span style={{ color: "#8b7a6b" }}>{[...t.players].map(displayName).join(", ")}</span>
            </div>
          ))}
        </div>
        <div style={{ ...small, fontSize: 11, color: "#665c4f", marginTop: 6 }}>
          ほとんどの人が毎回同じ文明を使っているので、文明の勝率はほぼ「その文明を使う人の勝率」です。文明そのものの強さとしては読めません。
        </div>
      </div>

      <h3 style={h3Style}>試合一覧(新しい順)</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {[...REPLAYS].reverse().map((r) => (
          <div key={r.id} style={cardStyle}>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#8b7a6b" }}>
              {replayDate(r)} {r.start.slice(11)}・{mapName(r.map)}・{fmtTime(r.duration)}
              {r.edition === "HD" ? "・HD" : ""}
              {r.start < REPLAY_SEED_END ? "" : "・このツールの記録と同じ試合"}
            </div>
            <div style={{ marginTop: 4, fontFamily: "'Inter', sans-serif", fontSize: 12, lineHeight: 1.6 }}>
              <span style={{ color: r.winner === "A" ? "#8fa876" : "#a89a86" }}>A{r.winner === "A" ? "(勝)" : ""}: {teamWithCivs(r.teamA, r)}</span>
              <br />
              <span style={{ color: r.winner === "B" ? "#8fa876" : "#a89a86" }}>B{r.winner === "B" ? "(勝)" : ""}: {teamWithCivs(r.teamB, r)}</span>
            </div>
            <ReplayToggle replay={r} label="詳細" />
          </div>
        ))}
      </div>
    </div>
  );
}

];
