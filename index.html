function ScoreMixBar({ scoreHistory }) {
  const totals = SCORE_FIELDS.map((f) => scoreHistory.reduce((s, r) => s + (r[f.key] || 0), 0));
  const sum = totals.reduce((a, b) => a + b, 0);
  if (!sum) return <div style={{ fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>スコア付きの記録なし</div>;
  return (
    <div>
      <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", background: "#171310" }}>
        {SCORE_FIELDS.map((f, i) => (
          <div key={f.key} title={`${f.label} ${Math.round((totals[i] / sum) * 100)}%`} style={{ width: `${(totals[i] / sum) * 100}%`, background: SCORE_COLORS[f.key] }} />
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4, fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86" }}>
        {SCORE_FIELDS.map((f, i) => (
          <span key={f.key}>
            <span style={{ color: SCORE_COLORS[f.key] }}>■</span> {f.label} {Math.round((totals[i] / sum) * 100)}%
          </span>
        ))}
        <span style={{ color: "#665c4f" }}>({scoreHistory.length}試合・平均総合 {Math.round(sum / scoreHistory.length).toLocaleString()})</span>
      </div>
    </div>
  );
}

function PlayerReviewCard({ name, review, agg }) {
  const p = agg.players[name];
  if (!p) return null;
  const others = HUMAN_NAMES.filter((m) => m !== name && (agg.players[m]?.games ?? 0) > 0);
  const partners = others
    .map((m) => ({ m, s: pairSynergy(name, m, agg) }))
    .filter((x) => x.s && x.s.games >= 5)
    .sort((a, b) => b.s.bonus - a.s.bonus);
  const best = partners.filter((x) => x.s.bonus >= 3).slice(0, 2);
  const worst = partners.filter((x) => x.s.bonus <= -3).slice(-2).reverse();
  // 直接対決で、実力から予想される勝率と10%以上違う相手(10戦以上)
  const h2h = others
    .map((m) => {
      const k = pairKey(name, m);
      const h = agg.h2h[k];
      if (!h || h.games < 10) return null;
      const wins = k.split("|")[0] === name ? h.aWins : h.games - h.aWins;
      const expected = eloWinProb((p.elo - agg.players[m].elo) / agg.ratingModel.teamSize);
      return { m, wins, games: h.games, diff: wins / h.games - expected };
    })
    .filter((x) => x && Math.abs(x.diff) >= 0.1)
    .sort((a, b) => b.diff - a.diff);
  const tier = ageTier(p.elo);
  const small = { fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };
  return (
    <div style={{ ...cardStyle, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 16, color: "#ede4d3" }}>{displayName(name)}</span>
        <Badge elo={p.elo} />
        <span style={{ fontSize: 12, color: "#c9a227", fontFamily: "'Inter', sans-serif", fontWeight: 600 }}>{review.type}</span>
        <span style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: tier.color }}>
          {Math.round(p.elo)} <span style={{ color: "#8b7a6b", fontSize: 11 }}>· {p.games}戦 勝率{Math.round((p.wins / p.games) * 100)}%</span>
        </span>
      </div>
      <p style={{ ...subText, maxWidth: "none", color: "#ede4d3", marginTop: 10 }}>{review.summary}</p>
      <ul style={{ margin: "6px 0 10px", paddingLeft: 18, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7 }}>
        {review.points.map((pt, i) => <li key={i}>{pt}</li>)}
      </ul>
      <div style={{ borderTop: "1px solid #3a3128", paddingTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
        <div style={{ fontSize: 10, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>最新データ</div>
        <ScoreMixBar scoreHistory={p.scoreHistory} />
        {(best.length > 0 || worst.length > 0) && (
          <div style={small}>
            相性(実力を差し引いた補正):
            {best.map((x) => <span key={x.m} style={{ color: "#8fa876" }}> ◎{displayName(x.m)} +{Math.round(x.s.bonus)}</span>)}
            {worst.map((x) => <span key={x.m} style={{ color: "#c07a6f" }}> ✕{displayName(x.m)} −{Math.abs(Math.round(x.s.bonus))}</span>)}
          </div>
        )}
        {h2h.length > 0 && (
          <div style={small}>
            直接対決で実力以上/以下:
            {h2h.map((x) => (
              <span key={x.m} style={{ color: x.diff > 0 ? "#8fa876" : "#c07a6f" }}>
                {" "}{displayName(x.m)} {x.wins}勝{x.games - x.wins}敗
              </span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function PlayerReviews({ agg }) {
  const names = Object.keys(PLAYER_REVIEWS)
    .filter((n) => agg.players[n])
    .sort((a, b) => agg.players[b].elo - agg.players[a].elo);
  return (
    <div>
      <h2 style={h2Style}>総評</h2>
      <p style={subText}>
        Claude Code が {REVIEW_BASIS} を分析した総評です({REVIEW_DATE} 時点)。文章は分析時点のもので、各カード下部の「最新データ」は記録が増えるたびに自動で更新されます。
      </p>

      <h3 style={{ ...h3Style, marginTop: 20 }}>全体の傾向</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
        {REVIEW_OVERVIEW.map((o) => (
          <div key={o.title} style={cardStyle}>
            <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 13, color: "#ede4d3" }}>{o.title}</div>
            <p style={{ ...subText, maxWidth: "none", marginTop: 4 }}>{o.body}</p>
          </div>
        ))}
      </div>

      <h3 style={h3Style}>プレイヤー別(現在のレート順)</h3>
      {names.map((n) => (
        <PlayerReviewCard key={n} name={n} review={PLAYER_REVIEWS[n]} agg={agg} />
      ))}
      <p style={{ ...subText, fontSize: 12 }}>{MINOR_PLAYER_NOTE}</p>
    </div>
  );
}

/* ============================================================
   スタイル
   ============================================================ */
const h2Style = { fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 20, color: "#ede4d3", letterSpacing: "0.02em", margin: 0 };
const h3Style = { fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 14, color: "#c9a227", margin: "0 0 10px" };
const subText = { fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginTop: 6, maxWidth: 640, lineHeight: 1.6 };
const cardStyle = { background: "#221d18", border: "1px solid #3a3128", borderRadius: 10, padding: "12px 16px" };
const inputStyle = { flex: 1, background: "#221d18", border: "1px solid #4a4136", borderRadius: 8, padding: "8px 12px", color: "#ede4d3", fontFamily: "'Inter', sans-serif", fontSize: 13, outline: "none" };
const primaryButton = { background: "linear-gradient(135deg,#d9b34a,#c98a4b)", color: "#1b1712", border: "none", borderRadius: 8, padding: "10px 22px", fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, letterSpacing: "0.03em" };

// Google Apps Script のデプロイURL(.../exec)。設定するとFreeプランでもスプレッドシートに永続保存されます。
// 未設定の間はClaudeの共有ストレージ(要Pro以上)にフォールバックします。
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0M_D_YU1ZU79PGtw3_hesCasn8kbKXFGE18REqgd3nbxy8a-kuSFo_Rim3BT6VX1_/exec";

async function loadMatches() {
  if (GAS_URL) {
    const res = await fetch(GAS_URL);
    const json = await res.json();
    return Array.isArray(json) ? json : [];
  }
  const r = await window.storage.get("aoe2_matches", true);
  return r && r.value ? JSON.parse(r.value) : [];
}

async function saveMatches(next) {
  if (GAS_URL) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // プリフライトを避けるためtext/plainで送信
      body: JSON.stringify(next),
    });
    return;
  }
  await window.storage.set("aoe2_matches", JSON.stringify(next), true);
}

function MatchScoreDetail({ scores }) {
  const [open, setOpen] = useState(false);
  const entries = Object.entries(scores);
  return (
    <div style={{ marginTop: 4 }}>
      <button
        onClick={() => setOpen((v) => !v)}
        style={{ background: "none", border: "none", padding: 0, color: "#c9a227", fontSize: 11, fontFamily: "'Inter', sans-serif", cursor: "pointer" }}
      >
        {open ? "▾ 詳細スコアを閉じる" : "▸ 詳細スコアを見る"}
      </button>
      {open && (
        <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 2 }}>
          {entries.map(([n, s]) => {
            const total = (s.military || 0) + (s.economy || 0) + (s.tech || 0) + (s.society || 0);
            return (
              <div
                key={n}
                style={{
                  display: "grid",
                  gridTemplateColumns: "84px repeat(5, 1fr)",
                  gap: 4,
                  fontSize: 11,
                  fontFamily: "'JetBrains Mono', monospace",
                  color: "#a89a86",
                }}
              >
                <span style={{ color: "#ede4d3" }}>{displayName(n)}</span>
                <span style={{ textAlign: "right" }}>軍{s.military || 0}</span>
                <span style={{ textAlign: "right" }}>経{s.economy || 0}</span>
                <span style={{ textAlign: "right" }}>技{s.tech || 0}</span>
                <span style={{ textAlign: "right" }}>社{s.society || 0}</span>
                <span style={{ textAlign: "right", color: "#c9a227" }}>総{total}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MatchHistory({ matches, onDelete }) {
  const [confirmId, setConfirmId] = useState(null);

  return (
    <div>
      <h2 style={h2Style}>試合履歴</h2>
      <p style={subText}>
        ここに表示されるのは、あなたやお友達がこのツールから記録した試合です(過去221戦分の元データや、スコア画像から登録した最初の1戦はここには出ません)。
        誤って入力した試合は削除できます。削除するとレート・戦績・相性データも自動で再計算されます。
      </p>

      {matches.length === 0 && (
        <div style={{ color: "#665c4f", fontSize: 13, fontFamily: "'Inter', sans-serif", marginTop: 16 }}>
          まだ記録がありません。
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 16 }}>
        {[...matches].reverse().map((m) => (
          <div key={m.id} style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#8b7a6b" }}>
                  {m.date || "日付なし"} {m.map ? `・${m.map}` : ""}
                </div>
                <div style={{ marginTop: 6, fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
                  <span style={{ color: m.winner === "A" ? "#8fa876" : "#a89a86" }}>
                    Team A{m.winner === "A" ? "(勝)" : ""}: {m.teamA.map(displayName).join(", ")}
                  </span>
                  <br />
                  <span style={{ color: m.winner === "B" ? "#8fa876" : "#a89a86" }}>
                    Team B{m.winner === "B" ? "(勝)" : ""}: {m.teamB.map(displayName).join(", ")}
                  </span>
                </div>
                {m.notes && (
                  <div style={{ marginTop: 6, fontSize: 12, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>{m.notes}</div>
                )}
                {m.scores && <MatchScoreDetail scores={m.scores} />}
              </div>
              <div>
                {confirmId === m.id ? (
                  <div style={{ display: "flex", gap: 6 }}>
                    <button
                      onClick={() => { onDelete(m.id); setConfirmId(null); }}
                      style={{ background: "#a8524a", color: "#ede4d3", border: "none", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                    >
                      本当に削除
                    </button>
                    <button
                      onClick={() => setConfirmId(null)}
                      style={{ background: "transparent", color: "#a89a86", border: "1px solid #4a4136", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}
                    >
                      キャンセル
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setConfirmId(m.id)}
                    style={{ background: "transparent", color: "#c07a6f", border: "1px solid #a8524a55", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}
                  >
                    削除
                  </button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  useFonts();
  const [matches, setMatches] = useState([]);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("board");

  useEffect(() => {
    (async () => {
      try {
        const loaded = await loadMatches();
        setMatches(loaded);
      } catch (e) {
        // 初回でデータが無い場合などはここに来る
      }
      setReady(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setMatches(next);
    try {
      await saveMatches(next);
    } catch (e) {
      console.error("保存に失敗しました", e);
    }
  }, []);

  const handleAddMatch = (m) => {
    persist([...matches, m]);
  };

  const handleDeleteMatch = (id) => {
    persist(matches.filter((m) => m.id !== id));
  };

  const agg = useMemo(() => computeAggregates(matches), [matches]);

  if (!ready) {
    return <div style={{ padding: 40, color: "#a89a86", fontFamily: "'Inter', sans-serif" }}>読み込み中...</div>;
  }

  const tabs = [
    { id: "board", label: "リーダーボード" },
    { id: "add", label: "試合を記録" },
    { id: "history", label: "試合履歴" },
    { id: "build", label: "チーム分け提案" },
    { id: "synergy", label: "相性データ" },
    { id: "review", label: "総評" },
  ];

  return (
    <div style={{ background: "#1b1712", minHeight: "100%", padding: 24, borderRadius: 12 }}>
      <div style={{ marginBottom: 22 }}>
        <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 24, color: "#d9b34a", letterSpacing: "0.03em" }}>
          AOE2 チーム分けトラッカー
        </div>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#665c4f", marginTop: 2 }}>
          記録試合数: {matches.length} (シード: 過去221戦)
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 24, borderBottom: "1px solid #3a3128", paddingBottom: 12 }}>
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{
              background: tab === t.id ? "#2a2420" : "transparent",
              color: tab === t.id ? "#d9b34a" : "#a89a86",
              border: tab === t.id ? "1px solid #d9b34a55" : "1px solid transparent",
              borderRadius: 8,
              padding: "8px 16px",
              fontFamily: "'Cinzel', serif",
              fontWeight: 700,
              fontSize: 13,
              letterSpacing: "0.02em",
              cursor: "pointer",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {tab === "board" && <Leaderboard agg={agg} />}
      {tab === "add" && <AddMatch agg={agg} onSave={handleAddMatch} />}
      {tab === "history" && <MatchHistory matches={matches} onDelete={handleDeleteMatch} />}
      {tab === "build" && <TeamBuilder agg={agg} matches={matches} />}
      {tab === "synergy" && <Synergy agg={agg} />}
      {tab === "review" && <PlayerReviews agg={agg} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
