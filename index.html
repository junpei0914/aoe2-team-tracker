  matches.forEach((m) => {
    const a = humans(m.teamA), b = humans(m.teamB);
    const d = parseLooseDate(m.date);
    const candidates = REPLAYS.filter((r) => {
      if (used.has(r.id)) return false;
      const ra = humans(r.teamA), rb = humans(r.teamB);
      if (!((ra === a && rb === b) || (ra === b && rb === a))) return false;
      return !d || Math.abs(new Date(r.start.slice(0, 10)) - d) / 86400000 <= 2;
    });
    // 同じ組み合わせで何度も戦った日は、勝ったチームも一致するものを優先する
    const winnerHumans = m.winner === "A" ? a : m.winner === "B" ? b : null;
    const pick = candidates.find((r) => r.winner && humans(r.winner === "A" ? r.teamA : r.teamB) === winnerHumans) || candidates[0];
    if (pick) {
      used.add(pick.id);
      links[m.id] = pick;
    }
  });
  return links;
}

// REPLAY_SEED_END 以降の録画のうち、ツールで記録した試合と対応しないものを、試合として扱う(スコアなし)。
// id はほかの記録と同じく時刻(ミリ秒)。試合の終了時刻にしておくと「今日の試合」の判定にもそのまま使える
function replayOnlyMatches(links) {
  const linked = new Set(Object.values(links).map((r) => r.id));
  return REPLAYS.filter((r) => r.start >= REPLAY_SEED_END && r.winner && !linked.has(r.id)).map((r) => {
    const [y, mo, d] = r.start.slice(0, 10).split("-").map(Number);
    return {
      id: new Date(r.start).getTime() + r.duration * 1000,
      date: `${y}/${mo}/${d}`,
      map: mapName(r.map),
      teamA: r.teamA,
      teamB: r.teamB,
      winner: r.winner,
      source: "replay",
      replay: r,
    };
  });
}

// 録画からプレイヤーごとの傾向をまとめる(AI1〜5は「AI」に合算)
function replayStats(replays = REPLAYS) {
  const stats = {};
  replays.forEach((r) => {
    Object.entries(r.players).forEach(([n, p]) => {
      const key = ratingKey(n);
      const s = (stats[key] = stats[key] || { games: 0, decided: 0, wins: 0, feudal: [], castle: [], imperial: [], eapm: [], villagers: [], units: {}, civs: {}, techs: {} });
      const team = r.teamA.includes(n) ? "A" : "B";
      s.games += 1;
      const civ = (s.civs[p.civ] = s.civs[p.civ] || { games: 0, wins: 0, decided: 0 });
      civ.games += 1;
      if (r.winner) {
        s.decided += 1;
        civ.decided += 1;
        if (r.winner === team) {
          s.wins += 1;
          civ.wins += 1;
        }
      }
      ["feudal", "castle", "imperial"].forEach((age) => p.ages[age] !== undefined && s[age].push(p.ages[age]));
      s.eapm.push(p.eapm);
      s.villagers.push(p.units.Villager || 0);
      Object.entries(p.units).forEach(([u, c]) => (s.units[u] = (s.units[u] || 0) + c));
      Object.entries(p.techs).forEach(([t, sec]) => (s.techs[t] = s.techs[t] || []).push(sec));
    });
  });
  Object.values(stats).forEach((s) => {
    const mil = Object.entries(s.units).filter(([u]) => !NON_MILITARY.has(u));
    const total = mil.reduce((x, [, c]) => x + c, 0) || 1;
    s.mix = UNIT_CATEGORY.map((c) => ({ ...c, share: mil.filter(([u]) => unitCategory(u) === c.key).reduce((x, [, n]) => x + n, 0) / total }));
    s.topUnits = mil.sort((a, b) => b[1] - a[1]).slice(0, 4).map(([u, c]) => ({ unit: u, perGame: c / s.games }));
    s.topCivs = Object.entries(s.civs).sort((a, b) => b[1].games - a[1].games);
  });
  return stats;
}

const BASE_ELO = 1500;

function pairKey(a, b) {
  return [a, b].sort().join("|");
}

// チーム平均レートの差 d から、勝つ確率を返す(Eloと同じ尺度)
function eloWinProb(d) {
  return 1 / (1 + Math.pow(10, -d / 400));
}

/* ------------------------------------------------------------
   レートの推定
   過去221戦は試合ごとの記録がなく集計値(個人の勝敗・チームメイト時の成績・直接対決の成績)しかないため、
   Eloを1試合ずつ流すことはできない。そこで「チームの強さ=メンバーのレートの平均」というEloと同じモデルで、
   集計値と記録済みの試合をもっともよく説明するレートを最尤推定する(毎回ゼロから計算し直す)。
   ・集計値は、同じ人以外のメンバーを平均的なプレイヤーとみなして使う
     例: xとyの直接対決 → チーム平均の差は (r_x − r_y) / 平均チーム人数
   ・1試合が集計の中で何回も数えられている(個人8回・直接対決16回など)ので、1試合=1回分になるよう重みを下げる
   ・記録済みの試合はチーム構成が分かっているのでそのまま使う
   ・ChatGPTの評価(なければ1500)を事前分布の中心にする(標準偏差 RATING_PRIOR_SD)。
     試合数の多い人はデータが優先され、少ない人は評価寄りになる
   ・AI1〜5は「誰が勝った方から順に記録されたか」でラベルが偏っているので、1人の「AI」としてまとめて推定する
   ------------------------------------------------------------ */
const RATING_PRIOR_SD = 200; // 評価をどれだけ信じるか。100〜300で比較し、データと評価の中間として200にした
const SEED_GAMES = 221;
const AI_KEY = "AI";
const ratingKey = (n) => (SEED_PLAYERS[n]?.isAI || /^AI\d*$/.test(n) ? AI_KEY : n);

function priorRating(key) {
  return CHATGPT_RATING[key] !== undefined ? BASE_ELO + (CHATGPT_RATING[key] - 85) * 14 : BASE_ELO;
}

const SEED_OBS = (() => {
  const ind = {};
  Object.entries(SEED_PLAYERS).forEach(([n, v]) => {
    const k = ratingKey(n);
    ind[k] = ind[k] || { games: 0, wins: 0 };
    ind[k].games += v.games;
    ind[k].wins += v.wins;
  });
  const mergePairs = (src, winsOf) => {
    const acc = {};
    Object.entries(src).forEach(([k, v]) => {
      const [x, y] = k.split("|"); // 直接対決の aWins は x(ソート順で先)の勝ち数
      const a = ratingKey(x), b = ratingKey(y);
      if (a === b) return; // AI同士
      const key = a + "|" + b;
      acc[key] = acc[key] || { a, b, games: 0, wins: 0 };
      acc[key].games += v.games;
      acc[key].wins += winsOf(v);
    });
    return acc;
  };
  const h2hAcc = mergePairs(SEED_H2H, (v) => v.aWins);
  const tmAcc = mergePairs(SEED_TEAMMATE, (v) => v.wins);

  // 集計に含まれている録画の試合を差し引く(その試合はチーム構成ごと estimateRatings で使う)。
  // 元の集計の記入ミスで録画の方が多くなる組み合わせが少しある(AI×MJHotcake で2試合)ので、0未満にはしない
  const take = (o, won) => {
    if (!o) return;
    o.games = Math.max(0, o.games - 1);
    if (won) o.wins -= 1;
    o.wins = Math.min(o.games, Math.max(0, o.wins));
  };
  SEED_REPLAYS.forEach((r) => {
    const A = r.teamA.map(ratingKey), B = r.teamB.map(ratingKey);
    const wonA = r.winner === "A";
    A.forEach((k) => take(ind[k], wonA));
    B.forEach((k) => take(ind[k], !wonA));
    [[A, wonA], [B, !wonA]].forEach(([team, won]) => {
      for (let i = 0; i < team.length; i++) {
        for (let j = i + 1; j < team.length; j++) {
          if (team[i] !== team[j]) take(tmAcc[[team[i], team[j]].sort().join("|")], won);
        }
      }
    });
    A.forEach((a) => B.forEach((b) => {
      if (a === b) return;
      const [x, y] = [a, b].sort();
      take(h2hAcc[x + "|" + y], (wonA ? a : b) === x);
    }));
  });
  const seedGameCount = SEED_GAMES - SEED_REPLAYS.length;

  const playerGames = Object.values(ind).reduce((s, v) => s + v.games, 0);
  const teamSize = playerGames / (2 * seedGameCount);
  const h2h = Object.values(h2hAcc);
  const tm = Object.values(tmAcc);
  const perGame = (list) => list.reduce((s, o) => s + o.games, 0) / seedGameCount;
  // 個人・直接対決・チームメイトの3通りで同じ試合を見ているので、さらに1/3にする
  const wInd = 1 / ((playerGames / seedGameCount) * 3);
  const wH2h = 1 / (perGame(h2h) * 3);
  const wTm = 1 / (perGame(tm) * 3);
  const obs = [
    ...Object.entries(ind).map(([a, v]) => ({ type: "ind", a, games: v.games, wins: v.wins, w: wInd })),
    ...h2h.map((o) => ({ type: "h2h", ...o, w: wH2h })),
    ...tm.map((o) => ({ type: "tm", ...o, w: wTm })),
  ];
  return { obs, teamSize, seedGames: ind };
})();

function estimateRatings(matches) {
  const { obs, teamSize: N, seedGames } = SEED_OBS;
  const weight = {}; // 平均的なプレイヤー(μ)を計算するときの重み=出場数
  Object.entries(seedGames).forEach(([k, v]) => (weight[k] = v.games));
  // 集計から差し引いた録画の試合も、チーム構成が分かる試合として使う
  const recorded = [...SEED_REPLAYS, ...matches]
    .filter((m) => (m.winner === "A" || m.winner === "B") && (m.teamA || []).length && (m.teamB || []).length)
    .map((m) => ({ A: m.teamA.map(ratingKey), B: m.teamB.map(ratingKey), actualA: m.winner === "A" ? 1 : 0 }));
  recorded.forEach((m) => m.A.concat(m.B).forEach((k) => (weight[k] = (weight[k] || 0) + 1)));
  const keys = Object.keys(weight);
  const totalWeight = keys.reduce((s, k) => s + weight[k], 0);
  const scoreTeams = buildScoreTeams(matches);
  const c = Math.LN10 / 400;
  const r = {};
  keys.forEach((k) => (r[k] = priorRating(k)));
  let mu = BASE_ELO;

  // 1回目は勝敗だけで推定し、その結果からスコアとレートの関係(scoreModel)を求めて、2回目にスコアも加えて推定し直す
  const fit = (scoreModel) => {
    for (let it = 0; it < 1000; it++) {
      mu = keys.reduce((s, k) => s + r[k] * weight[k], 0) / totalWeight;
      const g = {};
      keys.forEach((k) => (g[k] = -(r[k] - priorRating(k)) / (RATING_PRIOR_SD * RATING_PRIOR_SD)));
      obs.forEach((o) => {
        let d;
        if (o.type === "ind") d = (r[o.a] - mu) / N;
        else if (o.type === "h2h") d = (r[o.a] - r[o.b]) / N;
        else d = (r[o.a] + r[o.b] - 2 * mu) / N;
        const grad = (o.w * (o.wins - o.games * eloWinProb(d)) * c) / N;
        g[o.a] += grad;
        if (o.type === "h2h") g[o.b] -= grad;
        else if (o.type === "tm") g[o.b] += grad;
      });
      recorded.forEach((m) => {
        const avg = (t) => t.reduce((s, k) => s + r[k], 0) / t.length;
        const grad = (m.actualA - eloWinProb(avg(m.A) - avg(m.B))) * c;
        m.A.forEach((k) => (g[k] += grad / m.A.length));
        m.B.forEach((k) => (g[k] -= grad / m.B.length));
      });
      if (scoreModel) {
        const { beta, sigma } = scoreModel;
        scoreTeams.forEach((team) => {
          const meanR = team.reduce((s, p) => s + r[p.key], 0) / team.length;
          team.forEach((p) => {
            const e = p.z - beta * (r[p.key] - meanR);
            g[p.key] += (SCORE_WEIGHT * beta * e) / (sigma * sigma);
          });
        });
      }
      let maxStep = 0;
      keys.forEach((k) => {
        const step = 400 * g[k];
        r[k] += step;
        maxStep = Math.max(maxStep, Math.abs(step));
      });
      if (maxStep < 0.01) break;
    }
  };

  fit(null);
  const scoreModel = fitScoreModel(scoreTeams, r);
  if (scoreModel) fit(scoreModel);
  return { ratings: r, mu, teamSize: N, scoreModel };
}

/* ------------------------------------------------------------
   スコアの反映
   勝ったチームは全員スコアが高くなるので、「同じチームの味方と比べてどれだけスコアが高いか」
   (総合得点の対数 − チーム平均)を個人の貢献とみなす。これが「味方と比べたレートの高さ」に比例する
   (z ≈ beta × (本人のレート − チーム平均レート)、ばらつき sigma)というモデルで、レートの推定に加える。
   beta と sigma は記録済みの試合からその都度推定する(2026/9: 100点差でスコア約1.29倍、相関0.76)。
   スコアは役割(翼/ポケット)や文明の影響も受け、1試合でも勝敗よりはるかに多くの情報を持ってしまうため、
   SCORE_WEIGHT で割り引いている(1試合のスコアの影響が、事前の評価の半分弱程度になる)。
   ------------------------------------------------------------ */
const SCORE_WEIGHT = 0.25;
const SCORE_MIN_POINTS = 16; // これより少ないと beta を信頼できないのでスコアは使わない

function buildScoreTeams(matches) {
  const teams = [];
  matches.forEach((m) => {
    if (!m.scores) return;
    [m.teamA || [], m.teamB || []].forEach((team) => {
      const members = team
        .filter((n) => m.scores[n])
        .map((n) => {
          const s = m.scores[n];
          const total = (s.military || 0) + (s.economy || 0) + (s.tech || 0) + (s.society || 0);
          return { key: ratingKey(n), logScore: Math.log(total + 100) };
        });
      if (members.length < 2) return;
      const mean = members.reduce((s, p) => s + p.logScore, 0) / members.length;
      teams.push(members.map((p) => ({ key: p.key, z: p.logScore - mean })));
    });
  });
  return teams;
}

function fitScoreModel(scoreTeams, r) {
  const pts = [];
  scoreTeams.forEach((team) => {
    const meanR = team.reduce((s, p) => s + r[p.key], 0) / team.length;
    team.forEach((p) => pts.push({ x: r[p.key] - meanR, z: p.z }));
  });
  if (pts.length < SCORE_MIN_POINTS) return null;
  const sxx = pts.reduce((s, p) => s + p.x * p.x, 0);
  if (sxx === 0) return null;
  const beta = pts.reduce((s, p) => s + p.x * p.z, 0) / sxx;
  if (!(beta > 0)) return null;
  const sigma = Math.max(0.2, Math.sqrt(pts.reduce((s, p) => s + (p.z - beta * p.x) ** 2, 0) / (pts.length - 1)));
  return { beta, sigma, points: pts.length };
}

const AGE_TIERS = [
  { min: 1650, name: "帝王", jp: "Imperial", color: "#d9b34a", glow: "rgba(217,179,74,0.35)" },
  { min: 1560, name: "城主", jp: "Castle", color: "#c98a4b", glow: "rgba(201,138,75,0.28)" },

  { min: -Infinity, name: "暗黒", jp: "Dark", color: "#8b7a6b", glow: "rgba(139,122,107,0.2)" },

function ageTier(elo) {

const ALL_NAMES = Object.keys(SEED_PLAYERS);
const HUMAN_NAMES = ALL_NAMES.filter((n) => !SEED_PLAYERS[n].isAI);
const AI_NAMES = ALL_NAMES.filter((n) => SEED_PLAYERS[n].isAI);

// 記録済みデータに合わせた日付表記(例: 2026/9/22)。「試合を記録」の既定値に使う
function todayString() {
  const d = new Date();
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

function displayName(n) {
  return n === "max#2" ? "max(2)" : n;
}

function normalizeForMatch(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// 画像/OCRから読み取った名前の表記ゆれ・誤読(例: "Bishi_sawada"→"ishi_sawada", "iselo2sei"→"isclo2sei")を、
// 既知のロスター名に寄せる。完全一致→名前を含む→名前の断片→あいまい一致(編集距離)の順に試す。
// どの方法で一致したか(exact/partial/fragment/fuzzy)も返す。OCRデバッグログのトレースに使う。
// 注意: 以前は "st"→stone のような2文字の断片や、数値行 "42"→urio0042 まで名前扱いしてしまい、
// 直前の人の数値の取り込みが打ち切られて空欄になったり、架空のプレイヤーに数値が入ったりしていた。
const SHORT_NAME_LEN = 3; // ino / max / AI1 など。部分一致・断片一致は誤爆しやすいので単語単位の一致のみ
function matchToRosterNameDetailed(rawName) {
  const norm = normalizeForMatch(rawName);
  if (!norm || norm.length < 2 || /^\d+$/.test(norm)) return null;
  const words = (rawName || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

  for (const n of ALL_NAMES) {
    if (normalizeForMatch(n) === norm) return { name: n, method: "exact" };
  }
  // 行の中に名前がまるごと含まれる(クランタグ付きなど)。長い名前を優先
  const byLength = [...ALL_NAMES].sort((a, b) => normalizeForMatch(b).length - normalizeForMatch(a).length);
  for (const n of byLength) {
    const nNorm = normalizeForMatch(n);
    const hit = nNorm.length <= SHORT_NAME_LEN ? words.includes(nNorm) : norm.includes(nNorm);
    if (hit) return { name: n, method: "partial" };
  }
  // 名前の一部しか読めなかった場合(末尾の欠けなど)。短すぎる断片は採用しない
  for (const n of byLength) {
    const nNorm = normalizeForMatch(n);
    if (nNorm.length > SHORT_NAME_LEN && norm.length >= Math.max(4, nNorm.length - 2) && nNorm.includes(norm)) {
      return { name: n, method: "fragment" };
    }
  }
  let best = null;
  let bestDist = Infinity;
  let tie = false;
  ALL_NAMES.forEach((n) => {
    const nNorm = normalizeForMatch(n);
    // 短い名前は同じ長さの行のみ・1文字違いまで(例: "lno"→ino)
    if (nNorm.length <= SHORT_NAME_LEN && norm.length !== nNorm.length) return;
    const dist = levenshtein(norm, nNorm);
    const threshold = Math.max(1, Math.floor(nNorm.length / 4));
    if (dist > threshold) return;
    if (dist < bestDist) {
      best = n;
      bestDist = dist;
      tie = false;
    } else if (dist === bestDist) {
      tie = true;
    }
  });
  return best && !tie ? { name: best, method: "fuzzy", dist: bestDist } : null;
}

function matchToRosterName(rawName) {
  const m = matchToRosterNameDetailed(rawName);
  return m ? m.name : null;
}

// スコアボード画像をApps Script経由でGoogleドライブの無料OCRにかけ、テキストを取得する
async function ocrExtractText(base64Data, mediaType) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ type: "ocr_extract", image: base64Data, mediaType: mediaType || "image/png" }),
  });
  const raw = await res.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    throw new Error("サーバーの応答がJSONではありません: " + raw.slice(0, 300));
  }
  if (data.error) throw new Error(data.error);
  return data.text || "";
}

// OCRの1行を「数値トークン」と「それ以外(名前部分)」に分ける。"junpei 5,680 6365" のように
// 名前と数値が同じ行に出力されることもあるため。
function splitOcrLine(line) {
  const nums = [];
  const rest = [];
  line.split(/\s+/).filter(Boolean).forEach((tok) => {
    if (/^\d[\d,，]*$/.test(tok)) nums.push(Number(tok.replace(/[,，]/g, "")));
    else rest.push(tok);
  });
  return { nums, namePart: rest.join(" ") };
}

// 見出し・凡例の文言。名前の候補から除外する
const OCR_HEADER_WORDS = [
  "プレイヤー", "軍事", "経済", "經濟", "テクノロジー", "社会", "社會", "総合得点", "総合", "得点",
  "チーム", "チー", "最高得点", "勝者", "最優秀プレイヤー", "player", "military", "economy", "technology", "society", "team",
];
function isOcrHeaderLine(text) {
  const t = (text || "").replace(/[\s☆★・、。「」|]/g, "");
  if (t.length < 2) return true;
  const lower = t.toLowerCase();
  return OCR_HEADER_WORDS.some((w) => lower.includes(w.toLowerCase()));
}

// OCRテキストを解析する。Googleドライブ経由のOCRは表組みを1列にバラして返すため、
// 「名前→その人の数値5個」の順に並ぶこともあれば、「名前が数人分まとめて並び、そのあとに
// 数値が行順で5個ずつ続く」形になることもある。そこで、
//   1. 数値をすべて拾って5個(軍事/経済/テクノロジー/社会/総合)ずつのブロックに区切る
//      (「4項目の合計=総合」が成り立つかで区切り位置を検証する)
//   2. 名前(ロスターにない名前=AIなども含む)を出現順に並べ、ブロックへ順番に割り当てる
// という方式にしている。AIは名前が毎回変わるためロスターに一致しないが、1行として数えないと
// それ以降のスコアが1人ずつずれてしまう(2026/9/22 の不具合)。そのためロスターにない名前も
// 「不明なプレイヤー」として行に数え、スコアは自動入力しない。
// 確信が持てないものは warnings に積み、推測で埋めずに手動確認を促す。あくまで下書き用。
// 戻り値の order は画面上の行順(ロスターにない行は null)で、画像からのチーム・勝者判定に使う。
// trace に配列を渡すと、各行・各ブロックをどう解釈したかを記録する(OCRデバッグログ用)。
const OCR_BLOCK_SIZE = 5;
const OCR_MAX_SKIP = 2; // 合計が合わないとき、ゴミ数値とみなして読み飛ばす最大個数

function parseScoresFromOcrText(text, trace) {
  const log = (e) => { if (trace) trace.push(e); };
  const lines = text
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
  const warnings = [];
  const sumOk = (v) => v.length === OCR_BLOCK_SIZE && v[0] + v[1] + v[2] + v[3] === v[4];

  // 1. 行を「名前」と「数値」に振り分ける
  const nameItems = [];
  const numItems = [];
  lines.forEach((line, i) => {
    const { nums, namePart } = splitOcrLine(line);
    if (namePart) {
      const m = matchToRosterNameDetailed(namePart);
      if (m) {
        nameItems.push({ line: i, name: m.name });
        log({ line: i, text: line, as: "name", name: m.name, method: m.method, dist: m.dist });
      } else if (isOcrHeaderLine(namePart)) {
        log({ line: i, text: line, as: "ignored" });
      } else {
        nameItems.push({ line: i, name: null, text: namePart });
        log({ line: i, text: line, as: "unknown_name" });
      }
    }
    nums.forEach((v) => numItems.push({ line: i, v }));
    if (nums.length) log({ line: i, text: line, as: "number", count: nums.length });
  });

  // 2. 数値を5個ずつのブロックに区切る
  const blocks = [];
  let i = 0;
  while (i + OCR_BLOCK_SIZE <= numItems.length) {
    let skip = 0;
    for (; skip <= OCR_MAX_SKIP; skip++) {
      if (i + skip + OCR_BLOCK_SIZE > numItems.length) break;
      if (sumOk(numItems.slice(i + skip, i + skip + OCR_BLOCK_SIZE).map((x) => x.v))) break;
    }
    const start = skip > OCR_MAX_SKIP || i + skip + OCR_BLOCK_SIZE > numItems.length ? i : i + skip;
    const values = numItems.slice(start, start + OCR_BLOCK_SIZE).map((x) => x.v);
    if (start > i) log({ as: "skipped_numbers", values: numItems.slice(i, start).map((x) => x.v) });
    blocks.push({ values, line: numItems[start].line, ok: sumOk(values) });
    i = start + OCR_BLOCK_SIZE;
  }
  if (numItems.length - i > 0) log({ as: "leftover_numbers", count: numItems.length - i });

  // 3. 名前をブロックへ順番に割り当てる
  const players = [];
  const order = [];
  let unknownRows = 0;
  blocks.forEach((b, k) => {
    const item = nameItems[k];
    if (!item || item.name === null) {
      order.push(null);
      unknownRows++;
      log({ as: "unknown_row", block: k, text: item ? item.text : null, values: b.values });
      return;
    }
    if (players.some((p) => p.name === item.name)) {
      order.push(null);
      log({ as: "duplicate_ignored", name: item.name, values: b.values });
      warnings.push(`${displayName(item.name)} が2回読み取られたため、2回目は無視しました。`);
      return;
    }
    const [military, economy, tech, society] = b.values;
    const warning = b.ok ? null : `4項目の合計(${military + economy + tech + society})が総合(${b.values[4]})と一致しません。`;
    if (warning) warnings.push(`${displayName(item.name)}: ${warning}`);
    order.push(item.name);
    players.push({ name: item.name, military, economy, tech, society, rawNums: b.values, warning });
  });

  const unusedNames = nameItems.slice(blocks.length).filter((x) => x.name);
  if (unusedNames.length) {
    warnings.push(`${unusedNames.map((x) => displayName(x.name)).join("・")} は名前は見つかりましたが、対応する数値が読み取れませんでした。`);
  }
  // rows は行順のスコア。名簿にない行(AIなど)も値を持っているので、あとでAIに割り当てられる
  const rows = blocks.map((b, k) => ({ name: order[k], values: b.values, ok: b.ok }));
  return { players, warnings, order, rows, unknownRows };
}

/* ------------------------------------------------------------
   スコアボード画像のピクセル解析(チーム分け・勝者の判定)
   OCRの文字には盾の中のチーム番号や王冠マークが出てこないため、画像そのものを見て判定する。
   ・行: 左端のアイコン枠(暗い画素)が縦に並ぶ位置
   ・勝者: 名前の旗の右側にある王冠(くすんだ金色の画素)の量。旗の長さで位置がずれるので幅を持たせている
   ・チーム: 右端の盾。チーム番号ごとに形・色が違う(1=赤い雫型、2=白赤の盾など)ので、
     盾を6x8マスの模様に要約し、似ている行同士を同じチームとみなす(番号自体は読まない)
   2026/9 時点の AoE2 DE の結果画面(スコアタブ)を、スコア表の部分だけ切り抜いた画像で調整している。
   ------------------------------------------------------------ */
const CROWN_THRESHOLD = 0.07; // 王冠あり: 0.105〜0.18 / なし: 0.04以下(行間隔の2乗あたりの画素数。実画像4枚で計測)
const SHIELD_SAME_TEAM_MAX_DIFF = 12; // 48マス中の違うマス数。同じチーム: 0〜3 / 別チーム: 30前後

function loadImageData(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
    };
    img.onerror = () => reject(new Error("画像を読み込めませんでした"));
    img.src = dataUrl;
  });
}

function analyzeScoreboardImage(imageData) {
  const { width: W, height: H, data } = imageData;
  const px = (x, y) => {
    const o = (y * W + x) * 4;
    return [data[o], data[o + 1], data[o + 2]];
  };
  const isDark = (p) => p[0] + p[1] + p[2] < 200;
  const dist = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]);

  // 画像の縁取りや余白など、縦に長く続く暗い列は行の検出から除外する
  const border = new Set();
  let stripStart = null;
  for (let x = 0; x < Math.round(W * 0.2); x++) {
    let n = 0;
    for (let y = 0; y < H; y++) if (isDark(px(x, y))) n++;
    if (n > 0.7 * H) border.add(x);
    else if (stripStart === null && n > 0.25 * H) stripStart = x; // 左端のアイコン枠が始まる列
  }
  if (stripStart === null) return { rows: [], error: "行を検出できませんでした" };
  const stripEnd = Math.min(W, stripStart + Math.max(4, Math.round(W * 0.025)));
  // 見出しの下などの横線
  const hline = new Set();
  for (let y = 0; y < H; y++) {
    let n = 0, total = 0;
    for (let x = 0; x < W; x += 4) {
      total++;
      const p = px(x, y);
      if (p[0] + p[1] + p[2] < 400) n++;
    }
    if (n > 0.5 * total) hline.add(y);
  }

  const runs = [];
  let start = null, end = null, gap = 0;
  for (let y = 0; y < H; y++) {
    let n = 0;
    if (!hline.has(y)) for (let x = stripStart; x < stripEnd; x++) if (!border.has(x) && isDark(px(x, y))) n++;
    if (n >= 2) { // 明るい色の紋章だと、枠の左右の線の2画素しか暗くならない行がある
      if (start === null) start = y;
      end = y;
      gap = 0;
    } else if (start !== null && ++gap > 3) {
      runs.push([start, end]);
      start = null;
    }
  }
  if (start !== null) runs.push([start, end]);
  if (runs.length < 2) return { rows: [], error: "行を検出できませんでした" };
  const lens = runs.map(([s, e]) => e - s).sort((a, b) => a - b);
  const medLen = lens[Math.floor(lens.length / 2)];
  const rowRanges = runs.filter(([s, e]) => e - s >= 0.5 * medLen);
  if (rowRanges.length < 2) return { rows: [], error: "行を検出できませんでした" };
  const pitches = rowRanges.slice(1).map((r, k) => r[0] - rowRanges[k][0]).sort((a, b) => a - b);
  const pitch = pitches[Math.floor((pitches.length - 1) / 2)];

  const rows = rowRanges.map(([s, e]) => {
    const ym = Math.round((s + e) / 2);
    // 行の背景色(総合得点の列と盾の列の間の何もない所)
    const samples = [0.83, 0.84, 0.85, 0.86].map((f) => px(Math.min(W - 1, Math.round(W * f)), ym));
    const bg = [0, 1, 2].map((c) => samples.map((p) => p[c]).sort((a, b) => a - b)[2]);

    let left = 0;
    while (left < W && (border.has(left) || !isDark(px(left, ym)))) left++;

    // 名前の旗(バナー)の右端を探す。AIは名前が長く旗も長いため、位置を固定にすると
    // 旗の色を王冠と誤検出してしまう(2026/9/22 の不具合)
    const rowH = e - s + 1;
    let bannerEnd = left;
    let gap = 0;
    for (let x = left; x < Math.min(W, left + Math.round(8 * pitch)); x++) {
      let nonBg = 0;
      for (let y = s; y <= e; y++) if (dist(px(x, y), bg) >= 45) nonBg++;
      if (nonBg >= rowH * 0.15) {
        bannerEnd = x;
        gap = 0;
      } else if (++gap > Math.round(0.1 * pitch)) break;
    }

    // 王冠: 旗のすぐ右側。鮮やかな黄・橙(旗そのものの色)は除外し、くすんだ金色だけ数える。
    // 顔写真(行の高さいっぱいの暗い矩形)に入る手前で打ち切る
    const x0 = Math.min(W, bannerEnd + Math.round(0.1 * pitch));
    const xLimit = Math.min(W, bannerEnd + Math.round(1.6 * pitch));
    let x1 = xLimit;
    for (let x = x0; x < xLimit; x++) {
      let darkCount = 0;
      for (let y = s; y <= e; y++) if (isDark(px(x, y))) darkCount++;
      if (darkCount >= rowH * 0.5) {
        x1 = x;
        break;
      }
    }
    let crownPx = 0;
    for (let x = x0; x < x1; x++) {
      for (let y = s; y <= e; y++) {
        const p = px(x, y);
        const [r, g, b] = p;
        if (dist(p, bg) < 45 || (r > 200 && b < 80)) continue;
        if (r >= g && g >= b && r - b >= 50 && g >= 0.55 * r) crownPx++;
      }
    }
    const crown = crownPx / (pitch * pitch);

    // 盾: 右端の領域で、背景と違う画素が集まった一番大きな塊。
    // 画像の縁取りや余白のように行の高さいっぱいに続く列は除外する
    const xStart = Math.round(W * 0.86);
    const colCount = [];
    for (let x = xStart; x < W; x++) {
      let n = 0, total = 0;
      for (let y = s; y <= e; y++) {
        if (hline.has(y)) continue;
        total++;
        if (dist(px(x, y), bg) >= 60) n++;
      }
      colCount.push(n >= 2 && n < 0.9 * total ? n : 0);
    }
    // 白赤に塗り分けた盾は中央で途切れて見えることがあるので、近い塊はつなげる
    const maxGap = Math.max(2, Math.round(pitch * 0.3));
    let best = null, cur = null;
    colCount.forEach((n, k) => {
      if (n > 0) {
        if (!cur || k - cur.end > maxGap) cur = { start: k, end: k, sum: 0 };
        cur.end = k;
        cur.sum += n;
        if (!best || cur.sum > best.sum) best = { ...cur };
      }
    });
    let bx0 = W, bx1 = -1, by0 = H, by1 = -1;
    if (best) {
      bx0 = xStart + best.start;
      bx1 = xStart + best.end;
      for (let x = bx0; x <= bx1; x++) {
        for (let y = s; y <= e; y++) {
          if (hline.has(y) || dist(px(x, y), bg) < 60) continue;
          by0 = Math.min(by0, y); by1 = Math.max(by1, y);
        }
      }
    }
    let shield = null;
    if (bx1 >= 0 && bx1 - bx0 >= 5 && by1 - by0 >= 5) {
      const GX = 6, GY = 8;
      shield = "";
      for (let gy = 0; gy < GY; gy++) {
        for (let gx = 0; gx < GX; gx++) {
          const cx0 = bx0 + Math.floor(((bx1 - bx0 + 1) * gx) / GX);
          const cx1 = Math.max(cx0 + 1, bx0 + Math.floor(((bx1 - bx0 + 1) * (gx + 1)) / GX));
          const cy0 = by0 + Math.floor(((by1 - by0 + 1) * gy) / GY);
          const cy1 = Math.max(cy0 + 1, by0 + Math.floor(((by1 - by0 + 1) * (gy + 1)) / GY));
          const cls = { b: 0, l: 0, r: 0, d: 0 }; // 背景/白系/色つき/黒系
          for (let x = cx0; x < cx1; x++) {
            for (let y = cy0; y < cy1; y++) {
              const p = px(x, y);
              if (dist(p, bg) < 60) cls.b++;
              else if (p[0] + p[1] + p[2] < 180) cls.d++;
              else if (Math.max(...p) - Math.min(...p) < 50) cls.l++;
              else cls.r++;
            }
          }
          shield += Object.keys(cls).reduce((a, k) => (cls[k] > cls[a] ? k : a), "b");
        }
      }
    }
    return { top: s, bottom: e, crown: Math.round(crown * 1000) / 1000, shield, shieldBox: shield ? [bx0, by0, bx1, by1] : null };
  });
  return { rows, pitch };
}

// OCRで分かった行順の名前と、画像解析の結果から、チーム分けと勝者を推定する。
// 確信が持てないときは teamA/teamB/winner を null のまま返し、理由を warnings に入れる。
function inferTeamsAndWinner(order, analysis) {
  const result = { teamA: null, teamB: null, winner: null, warnings: [] };
  const rows = (analysis && analysis.rows) || [];
  if (analysis && analysis.error) {
    result.warnings.push(`チーム分け・勝者を判定できませんでした(${analysis.error})。スコア表の部分だけを切り抜いた画像だと判定しやすくなります。`);
    return result;
  }
  if (rows.length !== order.length) {
    result.warnings.push(`チーム分け・勝者を判定できませんでした(画像の行数 ${rows.length} と読み取れた名前の数 ${order.length} が一致しません)。`);
    return result;
  }
  if (rows.some((r) => !r.shield)) {
    result.warnings.push("チーム分けを判定できませんでした(チームの盾マークが見つかりません)。");
    return result;
  }
  const diff = (a, b) => [...a].filter((c, k) => c !== b[k]).length;
  const clusters = []; // { sig, idx: [] }
  rows.forEach((r, k) => {
    const c = clusters.find((cl) => diff(cl.sig, r.shield) <= SHIELD_SAME_TEAM_MAX_DIFF);
    if (c) c.idx.push(k);
    else clusters.push({ sig: r.shield, idx: [k] });
  });
  if (clusters.length !== 2) {
    result.warnings.push(`チーム分けを判定できませんでした(盾マークが${clusters.length}種類に分かれました。2チーム戦のみ対応しています)。`);
    return result;
  }
  const [a, b] = clusters;

  // 途中で投了・切断した人には、チームが勝っても王冠が付かない(2026/9/20 の iselo2sei)。
  // そのため「王冠が付いた人が1人以上いて、全員が同じチーム」なら、そのチームを勝者とする
  const crowned = rows.map((r) => r.crown >= CROWN_THRESHOLD);
  const anyCrowned = (cl) => cl.idx.some((k) => crowned[k]);
  if (anyCrowned(a) && !anyCrowned(b)) result.winner = "A";
  else if (anyCrowned(b) && !anyCrowned(a)) result.winner = "B";
  else if (!anyCrowned(a) && !anyCrowned(b)) result.warnings.push("勝者を判定できませんでした(王冠マークが見つかりません)。");
  else result.warnings.push("勝者を判定できませんでした(両方のチームに王冠マークがあるように見えます)。");

  // 名簿にない行(AI)に AI1 から順に番号を振る。これまでの記録と同じく、勝ったチームのAIを優先する。
  // AIは全員が同じレートを共有するので、勝敗さえ合っていれば番号の振り方は結果に影響しない。
  const rowNames = [...order];
  const unknownIdx = (cl) => cl.idx.filter((k) => !order[k]);
  const unknownCount = unknownIdx(a).length + unknownIdx(b).length;
  if (unknownCount > 0) {
    if (!result.winner) {
      result.warnings.push(`名簿にない行が${unknownCount}行あります。勝者が判定できなかったため、AIを自動で割り当てていません。`);
    } else if (unknownCount > AI_NAMES.length) {
      result.warnings.push(`名簿にない行が${unknownCount}行あり、AIの数(${AI_NAMES.length}体)を超えています。手動で入力してください。`);
    } else {
      const winCluster = result.winner === "A" ? a : b;
      const loseCluster = result.winner === "A" ? b : a;
      [...unknownIdx(winCluster), ...unknownIdx(loseCluster)].forEach((k, i) => (rowNames[k] = AI_NAMES[i]));
      result.assignedAi = unknownCount;
    }
  }
  result.rowNames = rowNames;
  // 画像の一番上の人のチームを Team A にする
  result.teamA = a.idx.map((k) => rowNames[k]).filter(Boolean);
  result.teamB = b.idx.map((k) => rowNames[k]).filter(Boolean);
  const unassigned = rowNames.filter((n) => !n).length;
  if (unassigned > 0 && result.winner) {
    result.warnings.push(`名簿にない行が${unassigned}行あります。必要に応じて手動で追加してください。`);
  }
  return result;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}

// OCRの不具合調査用ログ。貼り付けた画像・OCR生テキスト・解析トレース・自動入力結果・保存時の最終値を
// ブラウザのIndexedDBに残し、「OCRデバッグログを保存」ボタンでJSONとしてダウンロードできる。
// 調査手順は CLAUDE.md の「OCR不具合の調査」を参照。ログ記録の失敗が本来の処理を妨げないよう、すべて握りつぶす。
const OCR_LOG_DB = "aoe2_ocr_debug";
const OCR_LOG_STORE = "logs";
const OCR_LOG_MAX = 30;

function openOcrLogDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(OCR_LOG_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(OCR_LOG_STORE, { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function ocrLogRequest(mode, fn) {
  return openOcrLogDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(OCR_LOG_STORE, mode);
    const req = fn(tx.objectStore(OCR_LOG_STORE));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}

// IndexedDBが使えない環境(一部のサンドボックス等)でも、少なくとも開いている間のログはダウンロードできるようメモリにも持つ
const ocrLogMemory = new Map();

async function ocrLogGetAll() {
  const merged = new Map();
  try {
    const all = await ocrLogRequest("readonly", (st) => st.getAll());
    (all || []).forEach((e) => merged.set(e.id, e));
  } catch (e) {
    console.warn("OCRデバッグログの読み込みに失敗:", e);
  }
  ocrLogMemory.forEach((e, id) => merged.set(id, e));
  return [...merged.values()].sort((a, b) => a.id - b.id);
}

async function ocrLogPut(entry) {
  ocrLogMemory.set(entry.id, entry);
  if (ocrLogMemory.size > OCR_LOG_MAX) ocrLogMemory.delete(ocrLogMemory.keys().next().value);
  try {
    await ocrLogRequest("readwrite", (st) => st.put(entry));
    const all = await ocrLogGetAll();
    const excess = all.slice(0, Math.max(0, all.length - OCR_LOG_MAX));
    if (excess.length) await ocrLogRequest("readwrite", (st) => { excess.forEach((e) => st.delete(e.id)); });
  } catch (e) {
    console.warn("OCRデバッグログの保存に失敗:", e);
  }
}

async function ocrLogUpdate(id, patch) {
  if (ocrLogMemory.has(id)) ocrLogMemory.set(id, { ...ocrLogMemory.get(id), ...patch });
  try {
    const cur = await ocrLogRequest("readonly", (st) => st.get(id));
    if (cur) await ocrLogRequest("readwrite", (st) => st.put({ ...cur, ...patch }));
  } catch (e) {
    console.warn("OCRデバッグログの更新に失敗:", e);
  }
}

async function downloadOcrLogs() {
  const logs = await ocrLogGetAll();
  const payload = { exportedAt: new Date().toISOString(), roster: ALL_NAMES, logs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const pad = (v) => String(v).padStart(2, "0");
  a.href = url;
  a.download = `aoe2-ocr-log-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return logs.length;
}

// OCRで自動入力された値と保存時の最終値の差分(ユーザーが手で直した箇所)
function diffScores(ocrScores, finalScores) {
  const diff = [];
  const names = new Set([...Object.keys(ocrScores || {}), ...Object.keys(finalScores || {})]);
  names.forEach((n) => {
    SCORE_FIELDS.forEach(({ key }) => {
      const before = ocrScores && ocrScores[n] ? ocrScores[n][key] ?? null : null;
      const after = finalScores && finalScores[n] ? finalScores[n][key] ?? null : null;
      if (before !== after) diff.push({ name: n, field: key, ocr: before, final: after });
    });
  });
  return diff;
}

/* ============================================================
   集計ロジック: シード + 記録済み試合を通してElo・戦績・相性を再計算
   ============================================================ */
function computeAggregates(userMatches) {
  const players = {};
  ALL_NAMES.forEach((n) => {
    const seed = SEED_PLAYERS[n];
    players[n] = { games: seed.games, wins: seed.wins, losses: seed.losses, elo: BASE_ELO, isAI: seed.isAI, scoreHistory: [] };
  });
  const teammate = {};
  Object.entries(SEED_TEAMMATE).forEach(([k, v]) => (teammate[k] = { ...v }));
  const h2h = {};
  Object.entries(SEED_H2H).forEach(([k, v]) => (h2h[k] = { ...v }));

  const ensurePlayer = (n) => {
    if (!players[n]) players[n] = { games: 0, wins: 0, losses: 0, elo: BASE_ELO, isAI: n.startsWith("AI"), scoreHistory: [] };
  };

  const matches = [...SEED_MATCHES, ...userMatches];

  matches.forEach((m) => {
    const teamA = m.teamA || [];
    const teamB = m.teamB || [];
    teamA.concat(teamB).forEach(ensurePlayer);
    if (teamA.length === 0 || teamB.length === 0) return;

    if (m.winner === "A" || m.winner === "B") {
      teamA.forEach((n) => {
        players[n].games += 1;
        if (m.winner === "A") players[n].wins += 1;
        else players[n].losses += 1;
      });
      teamB.forEach((n) => {
        players[n].games += 1;
        if (m.winner === "B") players[n].wins += 1;
        else players[n].losses += 1;
      });
      if (m.scores) {
        Object.entries(m.scores).forEach(([n, s]) => {
          ensurePlayer(n);
          const total = (s.military || 0) + (s.economy || 0) + (s.tech || 0) + (s.society || 0);
          players[n].scoreHistory.push({ matchId: m.id, date: m.date, total, ...s });
        });
      }
      // チームメイト
      [teamA, teamB].forEach((team) => {
        const won = (team === teamA && m.winner === "A") || (team === teamB && m.winner === "B");
        for (let i = 0; i < team.length; i++) {
          for (let j = i + 1; j < team.length; j++) {
            const k = pairKey(team[i], team[j]);
            if (!teammate[k]) teammate[k] = { games: 0, wins: 0 };
            teammate[k].games += 1;
            if (won) teammate[k].wins += 1;
          }
        }
      });
      // 直接対決
      teamA.forEach((a) => {
        teamB.forEach((b) => {
          const [x, y] = [a, b].sort();
          const k = `${x}|${y}`;
          if (!h2h[k]) h2h[k] = { games: 0, aWins: 0 };
          h2h[k].games += 1;
          const winnerName = m.winner === "A" ? a : b;
          if (winnerName === x) h2h[k].aWins += 1;
        });
      });
    }
  });

  // レートは記録済みの全試合と過去の集計からまとめて推定する(Eloの差分更新はしない)
  const ratingModel = estimateRatings(matches);
  Object.keys(players).forEach((n) => {
    players[n].elo = ratingModel.ratings[ratingKey(n)] ?? priorRating(ratingKey(n));
  });

  const synergyModel = buildSynergyModel(players, teammate, ratingModel);
  return { players, teammate, h2h, ratingModel, synergyModel };
}

/* ============================================================
   チーム分け候補生成
   ============================================================ */
function combinations(arr, k) {
  const result = [];
  const helper = (start, combo) => {
    if (combo.length === k) {
      result.push([...combo]);
      return;
    }
    for (let i = start; i < arr.length; i++) {
      combo.push(arr[i]);
      helper(i + 1, combo);
      combo.pop();
    }
  };
  helper(0, []);
  return result;
}

/* ------------------------------------------------------------
   相性
   ペアで組んだときの勝率は、相性よりも2人それぞれの強さでほぼ決まる(弱い人は誰と組んでも勝率が低い)。
   そこで「2人のレートから予想される勝率」との差を相性とみなす。さらに試合数が少ないほど偶然の偏りが
   大きいので、経験ベイズで0に寄せる。SYNERGY_TAU は本当の相性の散らばり(勝率で±9%程度)で、
   2026/9 時点のデータから「観測されたばらつき − 試合数から見込まれる偶然のばらつき」で推定した値。
   結果はチーム平均レートと同じ単位(そのペアが同じチームにいると、チーム平均が何点分強くなるか)で返す。
   ------------------------------------------------------------ */
const SYNERGY_NOTE_MIN = 10; // これ以上の補正があるペアを「好相性/要注意」として表示

// 相性の元になる「予想との差」を、全体の偏り・各人の偏り・ペア固有の部分に分ける。
// 例: ishi_sawada は誰と組んでも予想より勝っている → それはレートが低めに出ているせいで、相性ではない。
// ペア固有の部分だけを相性とし、その本当の散らばり(tau)を「観測されたばらつき − 偶然のばらつき」で推定する。
function buildSynergyModel(players, teammate, ratingModel) {
  const { mu, teamSize } = ratingModel;
  const pairs = Object.entries(teammate)
    .map(([k, v]) => {
      const [a, b] = k.split("|");
      if (ratingKey(a) === AI_KEY || ratingKey(b) === AI_KEY || !v.games || !players[a] || !players[b]) return null;
      const expected = eloWinProb((players[a].elo + players[b].elo - 2 * mu) / teamSize);
      return { a, b, games: v.games, expected, resid: v.wins / v.games - expected };
    })
    .filter(Boolean);
  const totalGames = pairs.reduce((s, p) => s + p.games, 0) || 1;
  const globalMean = pairs.reduce((s, p) => s + p.resid * p.games, 0) / totalGames;
  const offsetAcc = {};
  pairs.forEach((p) => [p.a, p.b].forEach((n) => {
    offsetAcc[n] = offsetAcc[n] || { sum: 0, games: 0 };
    offsetAcc[n].sum += (p.resid - globalMean) * p.games;
    offsetAcc[n].games += p.games;
  }));
  // 各人の偏りも、試合数が少ないうちは0に寄せる(20試合分の0を足す)
  const offset = {};
  Object.entries(offsetAcc).forEach(([n, o]) => (offset[n] = o.sum / (o.games + 20)));
  const specific = (p) => p.resid - globalMean - (offset[p.a] || 0) - (offset[p.b] || 0);
  const excess = pairs.reduce((s, p) => s + p.games * specific(p) ** 2 - p.expected * (1 - p.expected), 0) / totalGames;
  const tau = Math.max(0.03, Math.sqrt(Math.max(0, excess)));
  return { globalMean, offset, tau };
}

function pairSynergy(a, b, agg) {
  if (ratingKey(a) === AI_KEY || ratingKey(b) === AI_KEY) return null; // AIのラベルは偏っているので対象外
  const rec = agg.teammate[pairKey(a, b)];
  if (!rec || rec.games === 0) return null;
  const { mu, teamSize } = agg.ratingModel;
  const { globalMean, offset, tau } = agg.synergyModel;
  const expected = eloWinProb((agg.players[a].elo + agg.players[b].elo - 2 * mu) / teamSize);
  const actual = rec.wins / rec.games;
  const specific = actual - expected - globalMean - (offset[a] || 0) - (offset[b] || 0);
  const noise = (expected * (1 - expected)) / rec.games;
  const shrink = (tau * tau) / (tau * tau + noise); // 試合数が少ないほど0に寄せる
  const bonus = (specific * shrink) / ((expected * (1 - expected) * Math.LN10) / 400);
  return { games: rec.games, actual, expected: expected + globalMean + (offset[a] || 0) + (offset[b] || 0), bonus };
}

function synergyScoreForTeam(team, agg) {
  let score = 0;
  const notes = [];
  for (let i = 0; i < team.length; i++) {
    for (let j = i + 1; j < team.length; j++) {
      const s = pairSynergy(team[i], team[j], agg);
      if (!s) continue;
      score += s.bonus;
      if (Math.abs(s.bonus) >= SYNERGY_NOTE_MIN) {
        notes.push({ pair: [team[i], team[j]], ...s, type: s.bonus > 0 ? "good" : "bad" });
      }
    }
  }
  notes.sort((x, y) => Math.abs(y.bonus) - Math.abs(x.bonus));
  return { score, notes };
}

const splitKey = (teamA, teamB) => [[...teamA].sort().join(","), [...teamB].sort().join(",")].sort().join("/");

// ratingOf: 各人のレート(直前の試合を踏まえる場合は今日の調子を足したもの)
// previousMatches: 同じ日の試合。同じ組み合わせの案に印を付ける
function suggestSplits(selected, agg, ratingOf, previousMatches = []) {
  if (selected.length < 2 || selected.length % 2 !== 0) return [];
  const half = selected.length / 2;
  const fixed = selected[0];
  const rest = selected.slice(1);
  const combosForFixedTeam = combinations(rest, half - 1);
  const played = new Set(previousMatches.map((m) => splitKey(m.teamA, m.teamB)));
  const splits = [];
  combosForFixedTeam.forEach((combo) => {
    const teamA = [fixed, ...combo].sort();
    const teamB = rest.filter((n) => !combo.includes(n)).sort();
    const eloA = teamA.reduce((s, n) => s + ratingOf(n), 0) / teamA.length;
    const eloB = teamB.reduce((s, n) => s + ratingOf(n), 0) / teamB.length;
    const synA = synergyScoreForTeam(teamA, agg);
    const synB = synergyScoreForTeam(teamB, agg);
    const edge = eloA + synA.score - (eloB + synB.score); // 正ならTeam Aが上
    splits.push({
      teamA, teamB, eloA, eloB, diff: Math.abs(edge),
      winProbA: eloWinProb(edge),
      synergyA: synA.score, synergyB: synB.score,
      notesA: synA.notes, notesB: synB.notes,
      alreadyPlayed: played.has(splitKey(teamA, teamB)),
    });
  });
  splits.sort((a, b) => a.diff - b.diff);
  return splits.slice(0, 5);
}

/* ------------------------------------------------------------
   直前の試合を踏まえた提案
   同じ日の試合(最後の記録から12時間以内)の結果から「今日の調子」を出し、レートに一時的に足す。
   予想より勝ったチームは上げ、負けたチームは下げる(Eloと同じ考え方で、Kを大きめにした一時的な補正)。
   スコアが大差だった試合ほど強めに反映する。記録そのもの(通常のレート)には影響しない。
   ------------------------------------------------------------ */
const SESSION_GAP_MS = 12 * 60 * 60 * 1000;
const SESSION_RECENT_MS = 24 * 60 * 60 * 1000;
const SESSION_K = 40;

function currentSession(matches) {
  const recorded = matches.filter((m) => typeof m.id === "number" && (m.winner === "A" || m.winner === "B")).sort((a, b) => a.id - b.id);
  if (!recorded.length) return [];
  const last = recorded[recorded.length - 1].id;
  return recorded.filter((m) => last - m.id <= SESSION_GAP_MS);
}

function teamScoreShareA(m) {
  if (!m.scores) return null;
  const total = (team) => team.reduce((s, n) => {
    const x = m.scores[n];
    return s + (x ? (x.military || 0) + (x.economy || 0) + (x.tech || 0) + (x.society || 0) : 0);
  }, 0);
  const a = total(m.teamA), b = total(m.teamB);
  return a + b > 0 ? a / (a + b) : null;
}

function sessionForm(session, agg) {
  const adj = {};
  const log = [];
  session.forEach((m) => {
    const rating = (n) => (agg.players[n]?.elo ?? BASE_ELO) + (adj[n] || 0);
    const avg = (t) => t.reduce((s, n) => s + rating(n), 0) / t.length;
    const expectedA = eloWinProb(avg(m.teamA) - avg(m.teamB));
    const actualA = m.winner === "A" ? 1 : 0;
    const share = teamScoreShareA(m);
    // スコア比 50:50 なら1倍、62.5:37.5 で1.5倍、75:25 以上で2倍
    const factor = share === null ? 1 : 1 + Math.min(1, Math.abs(share - 0.5) * 4);
    const delta = SESSION_K * factor * (actualA - expectedA);
    m.teamA.forEach((n) => { if (ratingKey(n) !== AI_KEY) adj[n] = (adj[n] || 0) + delta; });
    m.teamB.forEach((n) => { if (ratingKey(n) !== AI_KEY) adj[n] = (adj[n] || 0) - delta; });
    log.push({ match: m, expectedA, share, factor, delta });
  });
  return { adj, log };
}

                <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #3a3128", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#8b7a6b" }}>
                  直近平均総合得点: {Math.round(r.scoreHistory.reduce((s, h) => s + h.total, 0) / r.scoreHistory.length).toLocaleString()}
                  {" "}({r.scoreHistory.length}試合分の記録)
                </div>
              )}
              {hasScores && isOpen && <PlayerScoreDetail scoreHistory={r.scoreHistory} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Toggle({ label, active, onClick, color }) {
  return (
    <button
      onClick={onClick}
      style={{
        padding: "6px 14px",
        borderRadius: 8,
        border: `1px solid ${active ? (color || "#c9a227") : "#4a4136"}`,
        background: active ? `${color || "#c9a227"}22` : "transparent",
        color: active ? (color || "#c9a227") : "#a89a86",
        fontFamily: "'Inter', sans-serif",
        fontSize: 13,
        fontWeight: 600,
        cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
}

const SCORE_FIELDS = [
  { key: "military", label: "軍事" },
  { key: "economy", label: "経済" },
  { key: "tech", label: "テクノロジー" },
  { key: "society", label: "社会" },
];

function AddMatch({ agg, onSave }) {
  const [teamA, setTeamA] = useState([]);
  const [teamB, setTeamB] = useState([]);
  const [winner, setWinner] = useState(null);
  const [date, setDate] = useState(todayString);
  const [map, setMap] = useState("");
  const [notes, setNotes] = useState("");
  const [showScores, setShowScores] = useState(false);
  const [scores, setScores] = useState({});
  const [saved, setSaved] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [extractError, setExtractError] = useState(null);
  const [ocrWarnings, setOcrWarnings] = useState([]);
  const [ocrInfo, setOcrInfo] = useState("");
  const [ocrDebugText, setOcrDebugText] = useState("");
  const [ocrLogMessage, setOcrLogMessage] = useState("");
  // 前回保存以降のOCR実行のログID。保存時に最終スコアと修正差分を書き足す。
  const pendingOcrLogIds = useRef([]);

  const toggle = (name, team) => {
    const inA = teamA.includes(name);
    const inB = teamB.includes(name);
    if (team === "A") {
      if (inA) setTeamA(teamA.filter((n) => n !== name));
      else { setTeamA([...teamA, name]); setTeamB(teamB.filter((n) => n !== name)); }
    } else {
      if (inB) setTeamB(teamB.filter((n) => n !== name));
      else { setTeamB([...teamB, name]); setTeamA(teamA.filter((n) => n !== name)); }
    }
  };

  const setScoreField = (name, field, value) => {
    setScores((prev) => ({
      ...prev,
      [name]: { ...prev[name], [field]: value === "" ? undefined : Number(value) },
    }));
  };

  const handleImageUpload = async (file) => {
    if (!file) return;
    setExtracting(true);
    setExtractError(null);
    setOcrWarnings([]);
    setOcrInfo("");
    setOcrDebugText("");
    const logEntry = {
      id: Date.now(),
      createdAt: new Date().toISOString(),
      fileName: file.name || null,
      mediaType: file.type || null,
      fileSize: file.size,
      imageDataUrl: null,
      rawText: null,
      trace: [],
      parsed: null,
      scoresBefore: scores, // 前回の読み取り結果が残っていると、それとマージされる
      scoresAfterOcr: null,
      error: null,
    };
    try {
      const base64 = await fileToBase64(file);
      logEntry.imageDataUrl = `data:${file.type || "image/png"};base64,${base64}`;
      const text = await ocrExtractText(base64, file.type || "image/png");
      logEntry.rawText = text;
      console.log("OCR raw text:\n" + text);
      const { players: found, warnings, order, rows: ocrRows } = parseScoresFromOcrText(text, logEntry.trace);
      logEntry.parsed = found;
      logEntry.order = order;
      console.log("OCR parse trace:", logEntry.trace);

      // チーム分け・勝者は画像のピクセルから判定する(失敗してもスコアの自動入力は続ける)
      let inference = null;
      try {
        const analysis = analyzeScoreboardImage(await loadImageData(logEntry.imageDataUrl));
        logEntry.imageAnalysis = analysis;
        inference = inferTeamsAndWinner(order, analysis);
      } catch (e) {
        inference = { teamA: null, teamB: null, winner: null, warnings: [`チーム分け・勝者の判定中にエラーが発生しました: ${e && e.message ? e.message : e}`] };
      }
      logEntry.teamInference = inference;
      console.log("画像からのチーム・勝者判定:", logEntry.imageAnalysis, inference);
      if (inference.teamA && inference.teamB) {
        setTeamA(inference.teamA);
        setTeamB(inference.teamB);
        setWinner(inference.winner);
      }
      // 名簿にない行に割り当てたAIのスコア(勝ったチームのAIから AI1、AI2 …)
      const aiScores = {};
      (inference.rowNames || []).forEach((n, k) => {
        if (n && ratingKey(n) === AI_KEY && ocrRows[k]) {
          const [military, economy, tech, society] = ocrRows[k].values;
          aiScores[n] = { military, economy, tech, society };
        }
      });
      setOcrInfo(
        inference.teamA
          ? `チーム分け${inference.winner ? "・勝者" : ""}を画像から自動入力しました${
              inference.assignedAi ? `(名簿にない${inference.assignedAi}行は ${Object.keys(aiScores).sort().join("・")} として入力)` : ""
            }。下で確認してください。`
          : ""
      );

      const allWarnings = [...warnings, ...inference.warnings];
      logEntry.warnings = allWarnings;
      setOcrWarnings(allWarnings);
      if (allWarnings.length) setOcrDebugText(text);

      if (found.length === 0) {
        setExtractError("スコアを読み取れませんでした。手動で入力してください。下に読み取った生テキストを表示しています。");
        setOcrDebugText(text);
        return;
      }

      const next = { ...scores, ...aiScores };
      found.forEach((p) => {
        next[p.name] = { military: p.military, economy: p.economy, tech: p.tech, society: p.society };
      });
      logEntry.scoresAfterOcr = next;
      setScores(next);
      setShowScores(true);
    } catch (e) {
      console.error("OCR抽出エラー:", e);
      logEntry.error = e && e.message ? e.message : String(e);
      setExtractError("画像の読み取りに失敗しました: " + (e && e.message ? e.message : String(e)));
    } finally {
      pendingOcrLogIds.current.push(logEntry.id);
      ocrLogPut(logEntry);
      setExtracting(false);
    }
  };

  const handlePaste = (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image") !== -1) {
        const file = items[i].getAsFile();
        if (file) {
          e.preventDefault();
          handleImageUpload(file);
        }
        break;
      }
    }
  };

  const canSave = teamA.length > 0 && teamB.length > 0 && winner;
  const allPlayers = [...teamA, ...teamB];

  const handleSave = () => {
    if (!canSave) return;
    let cleanScores = null;
    if (showScores) {
      cleanScores = {};
      allPlayers.forEach((n) => {
        const s = scores[n];
        if (s && Object.values(s).some((v) => v !== undefined)) {
          cleanScores[n] = {
            military: s.military || 0,
            economy: s.economy || 0,
            tech: s.tech || 0,
            society: s.society || 0,
          };
        }
      });
      if (Object.keys(cleanScores).length === 0) cleanScores = null;
    }
    const matchId = Date.now();
    const scoresAtSave = scores;
    const logIds = pendingOcrLogIds.current;
    pendingOcrLogIds.current = [];
    logIds.forEach(async (logId) => {
      const entry = (await ocrLogGetAll()).find((e) => e.id === logId);
      ocrLogUpdate(logId, {
        savedAt: new Date().toISOString(),
        savedMatch: { id: matchId, date, map, teamA, teamB, winner },
        scoresAtSave, // 保存直前の入力欄の状態(チーム外の人の値も含む)
        finalScores: cleanScores,
        corrections: diffScores(entry && entry.scoresAfterOcr, cleanScores),
        // 画像から推定したチーム・勝者と、実際に保存した内容が違ったか
        teamCorrected: !!(entry && entry.teamInference && entry.teamInference.teamA) &&
          (JSON.stringify([...entry.teamInference.teamA].sort()) !== JSON.stringify([...teamA].sort()) ||
            JSON.stringify([...entry.teamInference.teamB].sort()) !== JSON.stringify([...teamB].sort())),
        winnerCorrected: !!(entry && entry.teamInference && entry.teamInference.winner) && entry.teamInference.winner !== winner,
      });
    });
    onSave({ id: matchId, date, map, teamA, teamB, winner, notes: notes || undefined, scores: cleanScores });
    setTeamA([]); setTeamB([]); setWinner(null); setDate(todayString()); setMap(""); setNotes(""); setScores({}); setShowScores(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const roster = [...HUMAN_NAMES, ...AI_NAMES];

  return (
    <div>
      <h2 style={h2Style}>試合を記録</h2>
      <p style={subText}>参加者をチームA・チームBに振り分けて、勝敗を記録してください。保存すると各プレイヤーのレート・相性データが自動更新されます。AI1〜5は区別用のラベルで、強さはすべて同じものとして扱います。</p>

      <div
        style={{ ...cardStyle, marginTop: 16, marginBottom: 8 }}
        onPaste={handlePaste}
        tabIndex={0}
      >
        <label style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227", display: "block", marginBottom: 8 }}>
          スコア画像から自動入力(軍事/経済/テクノロジー/社会)
        </label>
        <input
          type="file"
          accept="image/*"
          onChange={(e) => handleImageUpload(e.target.files[0])}
          style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#a89a86" }}
        />
        <div style={{ marginTop: 8, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif" }}>
          このカードをクリックしてから <kbd>Ctrl+V</kbd> でスクリーンショットを直接貼り付けることもできます。
        </div>
        {extracting && <div style={{ marginTop: 8, fontSize: 12, color: "#c9a227", fontFamily: "'Inter', sans-serif" }}>読み取り中...(数秒〜十数秒かかります)</div>}
        {extractError && <div style={{ marginTop: 8, fontSize: 12, color: "#c07a6f", fontFamily: "'Inter', sans-serif" }}>{extractError}</div>}
        {ocrDebugText && (
          <pre title="OCRが返した生テキスト" style={{ marginTop: 8, fontSize: 11, color: "#8b7a6b", background: "#171310", padding: 8, borderRadius: 6, whiteSpace: "pre-wrap", maxHeight: 200, overflow: "auto" }}>
            {ocrDebugText}
          </pre>
        )}
        {ocrInfo && <div style={{ marginTop: 8, fontSize: 12, color: "#8fa876", fontFamily: "'Inter', sans-serif" }}>✓ {ocrInfo}</div>}
        {ocrWarnings.length > 0 && (
          <div style={{ marginTop: 8, fontSize: 12, color: "#c98a4b", fontFamily: "'Inter', sans-serif", lineHeight: 1.6 }}>
            ⚠ 要確認(画像と見比べて手で直してください):
            {ocrWarnings.map((w, i) => <div key={i}>・{w}</div>)}
          </div>
        )}
        <div style={{ marginTop: 8, fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>
          画像からの読み取りによる下書きです。スコア・チーム分け・勝者(王冠マーク)を自動入力しますが、誤読することもあるので、保存前に必ず内容を確認・修正してください。
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>
          読み取りがおかしかったときは{" "}
          <button
            onClick={async () => {
              const n = await downloadOcrLogs();
              setOcrLogMessage(n > 0 ? `${n}件のログを保存しました` : "保存されたログがありません");
            }}
            style={{ background: "none", border: "none", padding: 0, color: "#c9a227", fontSize: 11, fontFamily: "'Inter', sans-serif", cursor: "pointer", textDecoration: "underline" }}
          >
            OCRデバッグログを保存
          </button>
          (画像・読み取り結果・修正内容。直近{OCR_LOG_MAX}回分をこのブラウザに記録しています){ocrLogMessage && ` — ${ocrLogMessage}`}
        </div>
        {Object.keys(scores).length > 0 && (
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #3a3128" }}>
            <div style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif", marginBottom: 6 }}>読み取り結果(A/Bボタンでチームに追加すると下の欄で編集できます):</div>
            {Object.entries(scores).map(([n, s]) => (
              <div key={n} style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: "#ede4d3" }}>
                {displayName(n)}: 軍{s.military ?? 0} / 経{s.economy ?? 0} / 技{s.tech ?? 0} / 社{s.society ?? 0}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 12, margin: "16px 0" }}>
        <input placeholder="日付(既定は今日。例 2026/9/22)" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
        <input placeholder="マップ/文明メモ(任意)" value={map} onChange={(e) => setMap(e.target.value)} style={inputStyle} />
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
        {roster.map((n) => {
          const inA = teamA.includes(n);
          const inB = teamB.includes(n);
          return (
            <div key={n} style={{ display: "flex", alignItems: "center", gap: 4, background: "#2a2420", borderRadius: 8, padding: "4px 4px 4px 10px", border: "1px solid #4a4136" }}>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", marginRight: 4 }}>{displayName(n)}</span>
              <Toggle label="A" active={inA} onClick={() => toggle(n, "A")} color="#8fa876" />
              <Toggle label="B" active={inB} onClick={() => toggle(n, "B")} color="#c98a4b" />
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 24, marginBottom: 20 }}>
        <TeamPreview title="Team A" names={teamA} color="#8fa876" agg={agg} />
        <TeamPreview title="Team B" names={teamB} color="#c98a4b" agg={agg} />
      </div>

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginBottom: 8 }}>勝ったのは?</div>
        <div style={{ display: "flex", gap: 10 }}>
          <Toggle label="Team A 勝利" active={winner === "A"} onClick={() => setWinner("A")} color="#8fa876" />
          <Toggle label="Team B 勝利" active={winner === "B"} onClick={() => setWinner("B")} color="#c98a4b" />
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <button
          onClick={() => setShowScores((v) => !v)}
          style={{ background: "none", border: "none", color: "#c9a227", fontFamily: "'Inter', sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0 }}
        >
          {showScores ? "▾ 詳細スコアを閉じる" : "▸ 詳細スコアを入力(任意)"}
        </button>

        {showScores && allPlayers.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {allPlayers.map((n) => {
              const s = scores[n] || {};
              const total = SCORE_FIELDS.reduce((sum, f) => sum + (s[f.key] || 0), 0);
              return (
                <div key={n} style={{ ...cardStyle, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", width: 90 }}>{displayName(n)}</div>
                  {SCORE_FIELDS.map((f) => (
                    <div key={f.key} style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                      <label style={{ fontSize: 10, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>{f.label}</label>
                      <input
                        type="number"
                        value={s[f.key] ?? ""}
                        onChange={(e) => setScoreField(n, f.key, e.target.value)}
                        style={{ ...inputStyle, width: 80, padding: "6px 8px" }}
                      />
                    </div>
                  ))}
                  <div style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#c9a227" }}>
                    総合 {total.toLocaleString()}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ marginBottom: 20 }}>
        <label style={{ display: "block", fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginBottom: 6 }}>タイムライン・メモ(任意)</label>
        <textarea
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="例: 帝王の時代に入った順、誰が中盤で伸びたか、荒らしを受けた人など"
          rows={3}
          style={{ ...inputStyle, width: "100%", resize: "vertical", fontFamily: "'Inter', sans-serif" }}
        />
      </div>

      <button onClick={handleSave} disabled={!canSave} style={{ ...primaryButton, opacity: canSave ? 1 : 0.4, cursor: canSave ? "pointer" : "not-allowed" }}>
        {saved ? "保存しました ✓" : "この試合を保存"}
      </button>
    </div>
  );
}

function TeamPreview({ title, names, color, agg }) {
  const avgElo = names.length ? Math.round(names.reduce((s, n) => s + (agg.players[n]?.elo ?? BASE_ELO), 0) / names.length) : 0;
  return (
    <div style={{ flex: 1, background: "#221d18", border: `1px solid ${color}44`, borderRadius: 10, padding: 14 }}>
      <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color, fontSize: 14, marginBottom: 8 }}>{title}</div>
      {names.length === 0 && <div style={{ color: "#665c4f", fontSize: 13 }}>未選択</div>}
      {names.map((n) => (
        <div key={n} style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3", marginBottom: 4 }}>
          {displayName(n)} <span style={{ color: "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }}>({Math.round(agg.players[n]?.elo ?? BASE_ELO)})</span>
        </div>
      ))}
      {names.length > 0 && (
        <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #3a3128", fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#a89a86" }}>
          平均レート: {avgElo}
        </div>
      )}
    </div>
  );
}

function TeamBuilder({ agg, matches }) {
  const [selected, setSelected] = useState([]);
  const roster = [...HUMAN_NAMES, ...AI_NAMES].filter((n) => (agg.players[n]?.games ?? 0) > 0 || CHATGPT_RATING[n] !== undefined);
  const session = useMemo(() => currentSession(matches), [matches]);
  const form = useMemo(() => sessionForm(session, agg), [session, agg]);
  const sessionIsRecent = session.length > 0 && Date.now() - session[session.length - 1].id <= SESSION_RECENT_MS;
  const [useSession, setUseSession] = useState(sessionIsRecent);

  const toggle = (n) => {
    setSelected((s) => (s.includes(n) ? s.filter((x) => x !== n) : [...s, n]));
  };

  const ratingOf = (n) => (agg.players[n]?.elo ?? BASE_ELO) + (useSession ? form.adj[n] || 0 : 0);
  const splits = useMemo(
    () => suggestSplits(selected, agg, ratingOf, useSession ? session : []),
    [selected, agg, useSession, session, form]
  );
  const lastMatch = session[session.length - 1];
  const pct = (p) => `${Math.round(p * 100)}%`;
  const signed = (v) => `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(Math.round(v))}`;

  return (
    <div>
      <h2 style={h2Style}>チーム分け提案</h2>
      <p style={subText}>今日参加するメンバーを選んでください(偶数人数)。レートと相性を合わせた実力差が小さい案を上位から提案します。AI1〜5は強さがすべて同じものとして計算されます。</p>

      {session.length > 0 && (
        <div style={{ ...cardStyle, marginTop: 16, borderColor: useSession ? "#c9a22766" : "#3a3128" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, color: "#c9a227" }}>
              直前の試合を踏まえる(
              {session[0].date && session[0].date !== lastMatch.date ? `${session[0].date}〜` : ""}
              {lastMatch.date || "日付なし"}・{session.length}試合)
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Toggle label={useSession ? "反映中" : "反映しない"} active={useSession} onClick={() => setUseSession((v) => !v)} />
              <Toggle label="前の試合のメンバーを選択" active={false} onClick={() => setSelected([...lastMatch.teamA, ...lastMatch.teamB])} />
            </div>
          </div>
          <div style={{ marginTop: 8, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7 }}>
            {form.log.map(({ match: m, expectedA, share, delta }, i) => (
              <div key={m.id}>
                {i + 1}戦目: Team {m.winner} 勝利
                (試合前の予想勝率 A {pct(expectedA)}{share !== null && ` / スコア比 ${Math.round(share * 100)}:${Math.round((1 - share) * 100)}`})
                → 勝ったチーム {signed(Math.abs(delta))}、負けたチーム {signed(-Math.abs(delta))}
              </div>
            ))}
            <div style={{ marginTop: 4, color: "#8b7a6b" }}>
              今日の調子:{" "}
              {Object.entries(form.adj)
                .sort((a, b) => b[1] - a[1])
                .map(([n, v]) => `${displayName(n)} ${signed(v)}`)
                .join(" / ")}
            </div>
            <div style={{ marginTop: 4, fontSize: 11, color: "#665c4f" }}>
              予想より勝ったチームのレートを一時的に上げ、負けたチームを下げて提案します(スコアが大差ほど強めに反映)。記録されるレートには影響しません。
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "16px 0 24px" }}>
        {roster.map((n) => (
          <Toggle key={n} label={displayName(n)} active={selected.includes(n)} onClick={() => toggle(n)} />
        ))}
      </div>

      {selected.length % 2 !== 0 && selected.length > 0 && (
        <div style={{ color: "#c98a4b", fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 16 }}>
          人数が奇数です。AIを1体追加するか、メンバーを調整してください。
        </div>
      )}

      {splits.map((s, i) => {
        // 各チームに表示している avg・相性の値と足し算が合うよう、丸めた後の値で内訳を出す(正ならTeam Aが上)
        const eloEdge = Math.round(s.eloA) - Math.round(s.eloB);
        const synergyEdge = Math.round(s.synergyA) - Math.round(s.synergyB);
        const totalEdge = eloEdge + synergyEdge;
        const edgeText = (v) => (v === 0 ? "差なし" : `${v > 0 ? "A" : "B"}+${Math.abs(v)}`);
        return (
        <div key={i} style={{ ...cardStyle, marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
            <div>
              <span style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color: "#c9a227", fontSize: 14 }}>
                案 {i + 1}
              </span>
              {s.alreadyPlayed && (
                <span style={{ marginLeft: 8, fontSize: 11, color: "#c98a4b", fontFamily: "'Inter', sans-serif" }}>今日すでに対戦した組み合わせ</span>
              )}
            </div>
            <div
              style={{ textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}
              title="実力 = 平均レート + 相性。相性は、一緒に組んだときの勝率が2人のレートから予想される勝率よりどれだけ高いか(低いか)で、試合数が少ないほど0に寄せています。要注意・好相性に表示されない小さな補正も含みます。実力差が小さい順に提案しています。"
            >
              <div style={{ fontSize: 12, color: "#a89a86" }}>
                実力差(相性込み) {Math.abs(totalEdge)}{totalEdge !== 0 && ` · Team ${totalEdge > 0 ? "A" : "B"}が上`}
              </div>
              <div style={{ fontSize: 10, color: "#665c4f", marginTop: 2 }}>
                平均レート {edgeText(eloEdge)} / 相性 {edgeText(synergyEdge)}
              </div>
              <div style={{ fontSize: 10, color: "#665c4f", marginTop: 2 }}>
                予想勝率 A {pct(s.winProbA)} : B {pct(1 - s.winProbA)}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 20 }}>
            <SplitTeam title="Team A" names={s.teamA} elo={s.eloA} synergy={s.synergyA} color="#8fa876" notes={s.notesA} />
            <SplitTeam title="Team B" names={s.teamB} elo={s.eloB} synergy={s.synergyB} color="#c98a4b" notes={s.notesB} />
          </div>
        </div>
        );
      })}

      {selected.length >= 2 && selected.length % 2 === 0 && splits.length === 0 && (
        <div style={{ color: "#a89a86", fontSize: 13 }}>候補を計算中、またはメンバーが足りません。</div>
      )}
    </div>
  );
}

function SplitTeam({ title, names, elo, synergy, color, notes }) {
  const syn = Math.round(synergy);
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, color, fontSize: 13, marginBottom: 6 }}>
        {title} <span style={{ color: "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>avg {Math.round(elo)}</span>
        <span style={{ color: syn > 0 ? "#8fa876" : syn < 0 ? "#c07a6f" : "#8b7a6b", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>
          {" "}· 相性 {syn > 0 ? "+" : syn < 0 ? "−" : "±"}{Math.abs(syn)}
        </span>
      </div>
      {names.map((n) => (
        <div key={n} style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>{displayName(n)}</div>
      ))}
      {notes.map((note, idx) => (
        <div key={idx} style={{ marginTop: 6, fontSize: 11, fontFamily: "'Inter', sans-serif", color: note.type === "good" ? "#8fa876" : "#c07a6f" }}>
          {note.type === "good" ? "◎ 好相性" : "✕ 要注意"}: {displayName(note.pair[0])}×{displayName(note.pair[1])} {note.bonus > 0 ? "+" : "−"}{Math.abs(Math.round(note.bonus))}
          ({note.games}戦 {(note.actual * 100).toFixed(0)}%、実力からの予想 {(note.expected * 100).toFixed(0)}%)
        </div>
      ))}
    </div>
  );
}

function Synergy({ agg }) {
  const [focus, setFocus] = useState(null);
  const pairs = Object.entries(agg.teammate)
    .map(([k, v]) => ({ pair: k.split("|"), ...v, wr: v.games ? v.wins / v.games : 0 }))
    .filter((p) => p.games >= 5 && !p.pair.some((n) => SEED_PLAYERS[n]?.isAI))
    .filter((p) => !focus || p.pair.includes(focus))
    .sort((a, b) => b.games - a.games);

  const h2hList = Object.entries(agg.h2h)
    .map(([k, v]) => ({ pair: k.split("|"), ...v }))
    .filter((p) => p.games >= 5 && !p.pair.some((n) => SEED_PLAYERS[n]?.isAI))
    .filter((p) => !focus || p.pair.includes(focus))
    .sort((a, b) => b.games - a.games);

  return (
    <div>
      <h2 style={h2Style}>相性データ</h2>
      <p style={subText}>5戦以上のペアのみ表示しています。名前をクリックすると、その人が絡む組み合わせだけに絞り込めます。</p>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "16px 0 24px" }}>
        {HUMAN_NAMES.filter((n) => (agg.players[n]?.games ?? 0) > 0).map((n) => (
          <Toggle key={n} label={displayName(n)} active={focus === n} onClick={() => setFocus(focus === n ? null : n)} />
        ))}
      </div>

      <h3 style={h3Style}>チームメイト時の勝率</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 28 }}>
        {pairs.map((p, i) => (
          <div key={i} style={{ ...cardStyle, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
              {displayName(p.pair[0])} × {displayName(p.pair[1])}
            </span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: p.wr >= 0.55 ? "#8fa876" : p.wr <= 0.45 ? "#c07a6f" : "#a89a86" }}>
              {p.games}戦 {(p.wr * 100).toFixed(1)}%
            </span>
          </div>
        ))}
      </div>

      <h3 style={h3Style}>直接対決</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {h2hList.map((p, i) => {
          const bWins = p.games - p.aWins;
          return (
            <div key={i} style={{ ...cardStyle, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
                {displayName(p.pair[0])} vs {displayName(p.pair[1])}
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#a89a86" }}>
                {p.aWins}勝 - {bWins}勝 (計{p.games})
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

      <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", background: "#171310" }}>
        {SCORE_FIELDS.map((f, i) => (
          <div key={f.key} title={`${f.label} ${Math.round((totals[i] / sum) * 100)}%`} style={{ width: `${(totals[i] / sum) * 100}%`, background: SCORE_COLORS[f.key] }} />
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4, fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86" }}>
        {SCORE_FIELDS.map((f, i) => (
          <span key={f.key}>
            <span style={{ color: SCORE_COLORS[f.key] }}>■</span> {f.label} {Math.round((totals[i] / sum) * 100)}%
          </span>
        ))}
        <span style={{ color: "#665c4f" }}>({scoreHistory.length}試合・平均総合 {Math.round(sum / scoreHistory.length).toLocaleString()})</span>
      </div>
    </div>
  );
}

function PlayerReviewCard({ name, review, agg, player, rstat }) {
  const p = player || agg.players[name];
  if (!p) return null;
  const others = HUMAN_NAMES.filter((m) => m !== name && (agg.players[m]?.games ?? 0) > 0);
  const partners = others
    .map((m) => ({ m, s: pairSynergy(name, m, agg) }))
    .filter((x) => x.s && x.s.games >= 5)
    .sort((a, b) => b.s.bonus - a.s.bonus);
  const best = partners.filter((x) => x.s.bonus >= 3).slice(0, 2);
  const worst = partners.filter((x) => x.s.bonus <= -3).slice(-2).reverse();
  // 直接対決で、実力から予想される勝率と10%以上違う相手(10戦以上)
  const h2h = others
    .map((m) => {
      const k = pairKey(name, m);
      const h = agg.h2h[k];
      if (!h || h.games < 10) return null;
      const wins = k.split("|")[0] === name ? h.aWins : h.games - h.aWins;
      const expected = eloWinProb((p.elo - agg.players[m].elo) / agg.ratingModel.teamSize);
      return { m, wins, games: h.games, diff: wins / h.games - expected };
    })
    .filter((x) => x && Math.abs(x.diff) >= 0.1)
    .sort((a, b) => b.diff - a.diff);
  const tier = ageTier(p.elo);
  const small = { fontSize: 11, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };
  return (
    <div style={{ ...cardStyle, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 16, color: "#ede4d3" }} title={p.title || ""}>
          {p.label || displayName(name)}
        </span>
        <Badge elo={p.elo} />
        <span style={{ fontSize: 12, color: "#c9a227", fontFamily: "'Inter', sans-serif", fontWeight: 600 }}>{review.type}</span>
        <span style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: tier.color }}>
          {Math.round(p.elo)} <span style={{ color: "#8b7a6b", fontSize: 11 }}>· {p.games}戦 勝率{Math.round((p.wins / p.games) * 100)}%</span>
        </span>
      </div>
      <p style={{ ...subText, maxWidth: "none", color: "#ede4d3", marginTop: 10 }}>{review.summary}</p>
      <ul style={{ margin: "6px 0 10px", paddingLeft: 18, fontSize: 12, color: "#a89a86", fontFamily: "'Inter', sans-serif", lineHeight: 1.7 }}>
        {review.points.map((pt, i) => <li key={i}>{pt}</li>)}
      </ul>
      <div style={{ borderTop: "1px solid #3a3128", paddingTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
        <div style={{ fontSize: 10, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>最新データ</div>
        <ScoreMixBar scoreHistory={p.scoreHistory} />
        {rstat && name === AI_KEY && (
          <div style={small}>
            録画 {rstat.games}試合: 文明 {rstat.topCivs.slice(0, 4).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
          </div>
        )}
        {rstat && name !== AI_KEY && (
          <div style={small}>
            録画 {rstat.games}試合: 時代進化(中央値)領主 {fmtTime(median(rstat.feudal))}・城主 {fmtTime(median(rstat.castle))}・帝王 {fmtTime(median(rstat.imperial))}
            ・eAPM {Math.round(median(rstat.eapm))}
            <br />
            文明: {rstat.topCivs.slice(0, 3).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
            {" "}/ 主な軍: {rstat.topUnits.slice(0, 3).map((x) => unitName(x.unit)).join("・")}
            <div style={{ marginTop: 3 }}><UnitMixBar mix={rstat.mix} /></div>
          </div>
        )}
        {(best.length > 0 || worst.length > 0) && (
          <div style={small}>
            相性(実力を差し引いた補正):
            {best.map((x) => <span key={x.m} style={{ color: "#8fa876" }}> ◎{displayName(x.m)} +{Math.round(x.s.bonus)}</span>)}
            {worst.map((x) => <span key={x.m} style={{ color: "#c07a6f" }}> ✕{displayName(x.m)} −{Math.abs(Math.round(x.s.bonus))}</span>)}
          </div>
        )}
        {h2h.length > 0 && (
          <div style={small}>
            直接対決で実力以上/以下:
            {h2h.map((x) => (
              <span key={x.m} style={{ color: x.diff > 0 ? "#8fa876" : "#c07a6f" }}>
                {" "}{displayName(x.m)} {x.wins}勝{x.games - x.wins}敗
              </span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
