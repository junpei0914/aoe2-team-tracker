// 時代(ages の並び)以降に作った軍を合計する。録画には戦闘の結果が残らず、何体残っているかは分からないので、
// 「その時代に入ってから何を作ったか」で主力を判断する(城主の時代は騎士、帝王の時代は民兵系、のような切り替えを見るため)
function unitsSince(p, age) {
  const order = ["dark", "feudal", "castle", "imperial"];
  const out = {};
  order.slice(order.indexOf(age)).forEach((g) => Object.entries(p.ua?.[g] || {}).forEach(([k, v]) => (out[k] = (out[k] || 0) + v)));
  return out;
}
// 時代ごとの主な軍(例: 「城主 騎士系 19・槍兵系 18 / 帝王 槍兵系 470・民兵系 449」)
function unitsByAgeText(p, n = 2) {
  if (!p.ua) return "";
  return ["feudal", "castle", "imperial"].filter((g) => p.ua[g] && Object.keys(p.ua[g]).length)
    .map((g) => `${AGE_SHORT[g]} ${topUnitsText(p.ua[g], n)}`).join(" / ");
}

function militaryMix(units) {
  const tot = {};
  let sum = 0;
  Object.entries(units || {}).forEach(([u, c]) => {
    if (NON_MILITARY.has(u)) return;
    const k = unitCategory(u);
    tot[k] = (tot[k] || 0) + c;
    sum += c;
  });
  const main = Object.keys(tot).sort((a, b) => tot[b] - tot[a])[0] || null;
  return { tot, sum, main, share: (k) => (sum ? (tot[k] || 0) / sum : 0) };
}
const countUnits = (units, list) => list.reduce((s, u) => s + (units?.[u] || 0), 0);
const topUnitsText = (units, n = 3) =>
  Object.entries(units || {}).filter(([u]) => !NON_MILITARY.has(u)).sort((a, b) => b[1] - a[1]).slice(0, n)
    .map(([u, c]) => `${unitName(u)} ${c}`).join("・");

// 録画の1試合について、そのプレイヤーの「良かった点」と「こうするとよかった点」を時刻つきで返す。
// rstat は replayStats() のその人の分(いつもの時刻と比べるため)
function diagnoseReplay(r, name, rstat) {
  const p = r.players[name];
  if (!p) return { good: [], advice: [], notes: [] };
  const civ = p.civ, t = p.techs || {}, a = p.ages || {}, b = p.buildings || {}, u = p.units || {};
  const hd = r.edition === "HD";
  const end = p.resign !== null && p.resign !== undefined ? Math.min(p.resign, r.duration) : r.duration;
  const free = (x) => (FREE_TECHS[civ] || []).includes(x);
  const role = p.role || null;
  const bench = AGE_BENCH[role || "any"];
  // いつもの時刻は、同じ役割の試合だけで比べる(前衛と後衛で進化のタイミングが大きく違うため)
  const sameRole = REPLAYS.map((x) => x.players[name]).filter((q) => q && (q.role || null) === role);
  const own = (k) => {
    const arr = sameRole.map((q) => q.ages?.[k]).filter((v) => v !== undefined);
    if (arr.length >= 3) return median(arr);
    return rstat && rstat[k]?.length >= 3 ? median(rstat[k]) : null;
  };
  const roleWord = role ? `${ROLE_JA[role]}のときの` : "";
  const good = [], advice = [], notes = [];
  const add = (list, time, text) => list.push({ time, text });
  const isA = r.teamA.includes(name);
  const won = r.winner ? (r.winner === "A") === isA : null;
  const humans = Object.keys(r.players).filter((n) => ratingKey(n) !== AI_KEY);
  const foes = Object.keys(r.players).filter((n) => r.teamA.includes(n) !== isA);
  const mates = Object.keys(r.players).filter((n) => n !== name && r.teamA.includes(n) === isA);

  if (p.resign !== null && p.resign !== undefined && p.resign < r.duration - 60) notes.push(`${fmtTime(p.resign)} に投了`);
  if (hd) notes.push("AoE2 HD の録画なので、生産数・建物は分からない(時代進化と研究だけで判定)");
  if (p.ua) notes.push(`時代ごとに作った軍: ${unitsByAgeText(p) || "なし"}`);
  notes.unshift(role ? `この試合の位置: ${ROLE_LONG[role]}` : "この試合の位置: 判定できない(2v2 など)");
  if (!hd) {
    mates.filter((n) => ratingKey(n) !== AI_KEY && r.players[n].units).forEach((n) => {
      const q = r.players[n];
      const qEnd = q.resign !== null && q.resign !== undefined ? q.resign : r.duration;
      const qm = militaryMix(q.units).sum;
      if (qEnd > 1800 && qm < 30) notes.push(`味方の ${displayName(n)} は軍${qm}体・町の人${q.units.Villager || 0}人で、ほとんど戦えていない(実質的に人数が少ない試合)`);
    });
  }

  // 時代進化
  ["feudal", "castle", "imperial"].forEach((age) => {
    const at = a[age], m = own(age), [lo, hi] = bench[age];
    const benchText = `${role ? ROLE_JA[role] + "の" : ""}目安は ${fmtTime(lo)}〜${fmtTime(hi)}`;
    if (at === undefined) {
      if (age === "feudal" && end > 900) add(advice, hi, `領主の時代に進化していない(録画に研究の記録がない)`);
      if (age === "castle" && a.feudal !== undefined && end > 1800) add(advice, hi, `30分を過ぎても城主の時代に進化していない。城主の時代は町の中心の追加・兵のアップグレード・城が解禁される大事な時代`);
      if (age === "imperial" && a.castle !== undefined && end > 2700) add(advice, hi, `45分を過ぎても帝王の時代に進化していない。長い試合では、帝王の時代のアップグレード(近衛剣士・重石弓射手・徴用など)の差が大きくなる`);
      return;
    }
    const slow = at > hi + (age === "feudal" ? 60 : 180) || (m !== null && at > m + (age === "feudal" ? 60 : 150));
    if (slow) {
      const how = {
        feudal: role === "flank"
          ? "前衛は相手の前衛とすぐぶつかるので、暗黒の時代は町の中心を止めずに町の人を作り、早めに領主の時代へ上がって射手・斥候などを出したい"
          : "暗黒の時代は町の中心で町の人を途切れさせずに作り、21〜22人で進化を始める",
        castle: role === "pocket"
          ? "後衛は攻められにくいので、領主の時代は内政を優先して早めに城主の時代へ上がり、騎士などの強い軍と町の中心の追加で前衛を支えたい"
          : role === "flank"
            ? "前衛は領主の時代の戦いが長くなりやすいが、守れているうちに食料と黄金を貯めて城主の時代へ。遅れるほど相手の城主の時代の軍に押される"
            : "領主の時代の研究(両刃斧・手押し車)を済ませたら、軍を作りながらも食料と黄金を貯めて進化を始める",
        imperial: "城主の時代のうちに町の中心を増やして町の人を100人前後にし、黄金を掘る人を増やす",
      }[age];
      add(advice, at, `${AGE_JA[age]}への進化が ${fmtTime(at)}(${m !== null ? `${roleWord}いつもは ${fmtTime(m)}、` : ""}${benchText})。${how}`);
    } else if (age === "castle" && role === "flank" && won === false && at < bench.castle[0] - 120) {
      add(advice, at, `前衛で城主の時代へ ${fmtTime(at)} と早く進んでいる。前衛は領主の時代から攻められやすいので、城主を急ぐなら、その間に守りの軍や壁が手薄になっていなかったか振り返りを`);
    } else if (at <= lo + (age === "feudal" ? 30 : 60)) {
      add(good, at, `${AGE_JA[age]} ${fmtTime(at)}: ${benchText.replace("目安は ", "目安(")})より早い進化`);
    }
  });

  // 機織り
  if (!free("Loom") && t.Loom !== undefined && t.Loom < 150) {
    add(advice, t.Loom, `機織りを ${fmtTime(t.Loom)} に研究。研究中の25秒は町の人を作れないので、猪の誘導や早いラッシュへの備えでなければ、領主の時代へ進む直前で十分`);
  }

  // 経済の研究
  if (a.feudal !== undefined) {
    const dba = t["Double-Bit Axe"];
    if (!free("Double-Bit Axe")) {
      if (dba === undefined) {
        if (end > a.feudal + 600) add(advice, a.feudal + 60, `両刃斧(木を切る人+20%)を研究していない。領主の時代に入ったら最初に研究したい`);
      } else if (dba > a.feudal + 240) {
        add(advice, dba, `両刃斧が ${fmtTime(dba)}(領主の時代から${Math.round((dba - a.feudal) / 60)}分後)。領主の時代に入ったらすぐ(${fmtTime(a.feudal + 60)}ごろまで)に研究したい`);
      } else if (dba <= a.feudal + 90) {
        add(good, dba, `両刃斧 ${fmtTime(dba)}: 領主の時代に入ってすぐ研究`);
      }
    }
    const wb = t.Wheelbarrow;
    if (!free("Wheelbarrow")) {
      const limit = a.castle !== undefined ? a.castle + 120 : a.feudal + 720;
      if (wb === undefined) {
        if (end > a.feudal + 900) add(advice, limit, `手押し車(町の人の運搬量+25%・移動速度+10%)を研究していない`);
      } else if (wb > limit) {
        add(advice, wb, `手押し車が ${fmtTime(wb)}。全部の資源の採集が速くなるので、領主の時代のうちに研究したい`);
      }
    }
  }
  if (!hd && !free("Horse Collar") && (b.Farm || 0) >= 10) {
    const hc = t["Horse Collar"];
    if (hc === undefined) add(advice, a.castle ?? (a.feudal ?? 600) + 600, `畑を${b.Farm}枚作ったのに引き具(畑の食料+75)を研究していない`);
    else if (a.castle !== undefined && hc > a.castle + 300) add(advice, hc, `引き具が ${fmtTime(hc)}。畑が増え始めたら(遅くとも城主の時代に入るころには)研究したい`);
  }
  if (a.castle !== undefined && end > a.castle + 900) {
    const want = ["Bow Saw", "Gold Mining"];
    if (!hd && (b.Farm || 0) >= 15) want.push("Heavy Plow");
    const missing = want.filter((x) => !free(x) && t[x] === undefined);
    if (missing.length) add(advice, a.castle + 300, `城主の時代の経済の研究のうち、${missing.map(techName).join("・")}を研究していない`);
  }

  if (!hd) {
    // 町の中心・町の人
    const tc = b["Town Center"] || 0;
    if (a.castle !== undefined && end > a.castle + 900) {
      if (tc < 2) add(advice, a.castle + 60, `町の中心が1つのまま。城主の時代に入ったら町の中心を2〜3個追加して、町の人を一気に増やす(ブーム)のが基本${role === "pocket" ? "。攻められにくい後衛は特に" : ""}`);
      else if (tc >= 3) add(good, null, `町の中心を3個以上建てて町の人を増やした`);
    }
    // 町の人は終了時の合計ではなく25分時点で比べる(優勢になった後に増えた分を入れないため)
    const vilAt = (n) => r.players[n].at?.["25"]?.v;
    const vil = vilAt(name);
    const withAt = humans.filter((n) => vilAt(n) !== undefined);
    const avgVil = withAt.reduce((sum, n) => sum + vilAt(n), 0) / (withAt.length || 1);
    if (vil !== undefined && vil < avgVil * 0.75) {
      add(advice, 1500, `25分までに作った町の人が${vil}人で、この試合の人間の平均(${Math.round(avgVil)}人)より少ない。町の中心の生産を止めない・町の中心を増やす、の2つで伸ばせる`);
    } else if (vil !== undefined && withAt.length >= 3 && withAt.every((n) => n === name || vilAt(n) <= vil)) {
      add(good, 1500, `25分までに作った町の人が${vil}人で、この試合の人間で最多`);
    }
    // 15〜20分に町の中心が休まず作れば12人(25秒に1人)
    const v15 = p.at?.["15"]?.v, v20 = p.at?.["20"]?.v;
    // 時代進化の研究中は町の人を作れないので、研究が15〜20分に重なる人は除く
    const researching = Object.entries(a).some(([g, at]) => at > 900 && at - ({ feudal: 130, castle: 160, imperial: 190 }[g] || 0) < 1200);
    if (v15 !== undefined && v20 !== undefined && v20 - v15 <= 5 && !researching) {
      add(advice, 900, `15〜20分の5分間に作った町の人が${v20 - v15}人(休まず作れば12人)。領主の時代の間も町の中心を止めずに作り続けたい`);
    }
    // 前衛の10〜15分の生産の手数(このグループで勝敗と関係していた操作)
    if (role === "flank" && p.aw?.length >= 3 && MIDGAME.queue1015FlankMedian) {
      const q = p.aw[2][2] / (5 / replaySpeed(r));
      const med = MIDGAME.queue1015FlankMedian;
      if (q < med * 0.6) add(advice, 600, `10〜15分の生産の命令が1分あたり${q.toFixed(1)}回(前衛の中央値は${med.toFixed(1)}回)。この時間帯の生産の手数が多い前衛が${MIDGAME.queue1015Flank.pct}%勝っているので、町の中心と軍事施設の予約を切らさないことに手数を使いたい`);
      else if (q >= med * 1.4) add(good, 600, `10〜15分の生産の命令が1分あたり${q.toFixed(1)}回(前衛の中央値は${med.toFixed(1)}回)と多く、領主の時代の生産を切らさずに回せていた`);
    }
    // 領主の時代の軍(15分時点)。このグループで勝敗とはっきり関係していた唯一の指標
    const m15 = p.at?.["15"]?.m;
    if (role === "flank" && m15 !== undefined && r.duration >= 1500) {
      if (m15 < 5) add(advice, 900, `前衛なのに15分までに作った軍が${m15}体${v15 !== undefined ? `(町の人は${v15}人)` : ""}。このグループの録画では、${MID_M15_FLANK}。町の人を止めなかった人ほど軍も出せている。町の中心を止めずに、領主の時代に入ったらすぐ軍を作り始めたい`);
      else if (m15 >= 10) add(good, 900, `前衛で15分までに軍を${m15}体出した。このグループでは${MID_M15_FLANK}`);
    }

    // 軍の量と鍛冶場
    const mix = militaryMix(u);
    if (end > 1800 && mix.sum < (role === "flank" ? 70 : 40)) {
      add(advice, null, role === "flank"
        ? `前衛なのに軍の生産が${mix.sum}体と少ない。前衛は相手の前衛と最初にぶつかる位置なので、領主の時代から軍を作り続けたい`
        : `軍の生産が${mix.sum}体と少ない。領主の時代から少しずつでも作り続けたい`);
    }
    const mixCastle = p.ua ? militaryMix(unitsSince(p, "castle")) : mix; // 城主の時代以降の主力
    if (mixCastle.sum >= 20 && a.castle !== undefined && end > a.castle + 600) {
      const cat = mixCastle.main;
      const atk = { infantry: "Forging", cavalry: "Forging", archer: "Fletching" }[cat];
      const arm = { infantry: "Scale Mail Armor", cavalry: "Scale Barding Armor", archer: "Padded Archer Armor" }[cat];
      const label = UNIT_CATEGORY.find((c) => c.key === cat)?.label;
      const spanish = civ === "Spanish" ? "(スペインは鍛冶場の研究に黄金がいらない)" : "";
      if (atk && !free(atk)) {
        if (t[atk] === undefined && t[arm] === undefined) {
          add(advice, a.castle + 120, `主力が${label}(${topUnitsText(u, 2)})なのに、鍛冶場で${techName(atk)}も${techName(arm)}も研究していない。攻撃と防御のアップグレードは城主の時代のうちに${spanish}`);
        } else if (t[atk] === undefined) {
          add(advice, a.castle + 120, `主力が${label}なのに${techName(atk)}(攻撃力+1)を研究していない${spanish}`);
        } else if (t[atk] > a.castle + 600) {
          add(advice, t[atk], `${techName(atk)}が ${fmtTime(t[atk])}(城主の時代から${Math.round((t[atk] - a.castle) / 60)}分後)。主力の${label}の攻撃力なので、城主の時代に入ったら早めに${spanish}`);
        } else if (t[atk] <= a.castle + 180) {
          add(good, t[atk], `${techName(atk)} ${fmtTime(t[atk])}: 主力の${label}の攻撃力を早めに上げた`);
        }
      }
    }

    // 兵のアップグレード
    const upgrades = [
      ["Militia", "Long Swordsman", 20, "castle"], ["Archer", "Crossbowman", 20, "castle"], ["Spearman", "Pikeman", 25, "castle"],
      ["Scout Cavalry", "Light Cavalry", 15, "castle"], ["Skirmisher", "Elite Skirmisher", 25, "castle"],
      ["Knight", "Cavalier", 15, "imperial"], ["Militia", "Two-Handed Swordsman", 25, "imperial"], ["Archer", "Arbalester", 20, "imperial"],
      ["Spearman", "Halberdier", 25, "imperial"],
    ];
    upgrades.forEach(([unit, up, n, age]) => {
      if (a[age] === undefined || end < a[age] + 600 || free(up) || t[up] !== undefined) return;
      // その時代に入ってから作った数で判断する(城主の時代の騎士が帝王の時代には残っていない、などを避けるため)
      const c = p.ua ? (unitsSince(p, age)[unit] || 0) : (u[unit] || 0);
      if (c < n) return;
      add(advice, a[age] + 180, `${AGE_JA[age]}に入ってから${unitName(unit)}を${c}体作ったのに、${techName(up)}へのアップグレードをしていない(その文明で研究できる場合)`);
    });
    const archers = (mixCastle.tot.archer || 0) - (unitsSince(p, "castle").Skirmisher || (p.ua ? 0 : u.Skirmisher || 0)); // 城主の時代以降。散兵には弾道学の効果が小さいので除く
    if (archers >= 30 && a.castle !== undefined && end > a.castle + 900 && t.Ballistics === undefined) {
      add(advice, a.castle + 600, `射撃ユニットを${archers}体作ったのに、大学で弾道学(動く相手に矢が当たる)を研究していない`);
    }

    // 攻囲兵器・交易
    const siege = countUnits(u, SIEGE_UNITS);
    const foeCastles = foes.filter((n) => ratingKey(n) !== AI_KEY).reduce((sum, n) => sum + (r.players[n].buildings?.Castle || 0), 0);
    if (end > 2400 && siege === 0 && foeCastles > 0) {
      add(advice, null, `相手チームは城を建てたのに、攻囲兵器を作っていない。城や塔は破城槌・遠投投石機で崩す(味方が作っているなら問題なし)`);
    } else if (siege >= 6) {
      add(good, null, `攻囲兵器を${siege}台(${topUnitsText(Object.fromEntries(SIEGE_UNITS.map((s) => [s, u[s] || 0]).filter(([, v]) => v)), 2)})用意した`);
    }
    const teamTrade = [name, ...mates].reduce((sum, n) => sum + (r.players[n].units?.["Trade Cart"] || 0), 0);
    const foeTrade = foes.reduce((sum, n) => sum + (r.players[n].units?.["Trade Cart"] || 0), 0);
    if (end > 3000 && role !== "flank" && !(u["Trade Cart"] > 0) && teamTrade < 10) {
      add(advice, 2400, `50分を超える試合で、チームの荷馬車が${teamTrade}台(相手は${foeTrade}台)。後半は金鉱が尽きるので、${role === "pocket" ? "後衛は" : "後衛(内側)の位置なら"}市場で交易を担当したい`);
    } else if ((u["Trade Cart"] || 0) >= 10) {
      add(good, null, `荷馬車${u["Trade Cart"]}台で交易し、後半の黄金を確保した`);
    }

    // 相手の軍への対応(ユニットごとの相性で見る。2026/10 の相談で「ハスカールに射手を勧めた」誤りを指摘されたため)
    const foeUnits = {};
    // AIの生産数は録画で多めに出ることがある(同じ命令が何度も記録される)ので、相手の軍の構成は人間だけで見る
    foes.filter((n) => ratingKey(n) !== AI_KEY).forEach((n) => Object.entries(r.players[n].units || {}).forEach(([k, v]) => (foeUnits[k] = (foeUnits[k] || 0) + v)));
    const fm = militaryMix(foeUnits);
    const pick = (pred) => Object.fromEntries(Object.entries(foeUnits).filter(([k]) => pred(k)));
    const foeArchers = pick((k) => unitCategory(k) === "archer" && k !== "Skirmisher"); // 散兵は射手への対抗ユニットなので射手に数えない
    const foeArcherCount = countUnits(foeArchers, Object.keys(foeArchers));
    if (fm.sum >= 60 && mix.sum >= 30) {
      const mine = (list) => countUnits(u, list) / mix.sum;
      if (fm.share("cavalry") >= 0.35) {
        const desc = `相手チーム(人間)の軍の${Math.round(fm.share("cavalry") * 100)}%が騎兵(${topUnitsText(pick((k) => unitCategory(k) === "cavalry"), 2)})`;
        if (mine(ANTI_CAV) < 0.12) add(advice, null, `${desc}。槍兵系やらくだ騎兵を混ぜると受け止めやすい`);
        else if (mine(ANTI_CAV) >= 0.25) add(good, null, `${desc}に、槍兵系などで対応できていた`);
      }
      const archerShare = foeArcherCount / fm.sum;
      if (archerShare >= 0.4) {
        const desc = `相手チーム(人間)の軍の${Math.round(archerShare * 100)}%が射手など(${topUnitsText(foeArchers, 2)})`;
        if (mine(ANTI_ARCHER) < 0.12) add(advice, null, `${desc}。散兵・投石機、騎兵、飛び道具に強い歩兵(ハスカールなど)で対応したい`);
        else if (mine(ANTI_ARCHER) >= 0.3) add(good, null, `${desc}に、散兵や騎兵などで対応できていた`);
      }
      if (fm.share("infantry") >= 0.5) {
        const foeInf = pick((k) => unitCategory(k) === "infantry");
        const infTotal = countUnits(foeInf, Object.keys(foeInf));
        const pierce = countUnits(foeUnits, PIERCE_ARMOR_INF);
        const desc = `相手チーム(人間)の軍の${Math.round(fm.share("infantry") * 100)}%が歩兵(${topUnitsText(foeInf, 2)})`;
        if (pierce / infTotal >= 0.35) {
          // ハスカール・イーグルが多いときは、射手ではなく騎兵・民兵系・砲撃手
          if (mine(ANTI_PIERCE_INF) < 0.2 || mix.share("archer") >= 0.3) {
            add(advice, null, `${desc}。${topUnitsText(pick((k) => PIERCE_ARMOR_INF.includes(k)), 2)}は飛び道具への防御が高く、射手は効かない(逆に狩られる)。騎士などの騎兵・長剣剣士〜近衛剣士・砲撃手で戦いたい${civ === "Japanese" ? "。日本なら武士も固有ユニットに強い" : ""}`);
          }
        } else if (mine(ANTI_INF) < 0.12) {
          add(advice, null, `${desc}。射手・砲撃手・スコーピオンや騎士が効きやすい`);
        }
      }
    }
    if (fm.sum >= 60) {
      // 日本の武士は固有ユニットに攻撃ボーナスがある
      const foeUnique = pick((k) => UNIQUE_UNITS.includes(k) && k !== "Samurai");
      const uniqueCount = countUnits(foeUnique, Object.keys(foeUnique));
      if (civ === "Japanese" && uniqueCount >= 40 && (u.Samurai || 0) < 10 && a.castle !== undefined) {
        add(advice, a.castle + 300, `相手の固有ユニット(${topUnitsText(foeUnique, 2)})が多い。武士は固有ユニットに攻撃ボーナスがあるので、城を建てて武士を混ぜたい`);
      }
      // 相手のスコーピオン・投石機には、速い騎兵で直接狩る
      const foeSiege = countUnits(foeUnits, FIELD_SIEGE);
      if (foeSiege >= 15 && mix.sum >= 30 && mix.share("infantry") + mix.share("archer") >= 0.6 && countUnits(u, SIEGE_HUNTERS) < Math.max(10, foeSiege)) {
        add(advice, null, `相手チーム(人間)はスコーピオン・投石機を${foeSiege}台(${topUnitsText(pick((k) => FIELD_SIEGE.includes(k)), 2)})。歩兵や射手の固まりは溶かされやすいので、軽騎兵・ユサールや騎士を混ぜて攻囲兵器を直接狩りたい`);
      }
    }
    // 相手に射手がほとんどいないのに散兵を多く作った
    if ((u.Skirmisher || 0) >= 30 && foeArcherCount < 20) {
      add(advice, null, `散兵を${u.Skirmisher}体作ったが、相手チーム(人間)の射手は${foeArcherCount ? `${foeArcherCount}体だけ` : "1体もいない"}。散兵は射手への対抗ユニットなので、その資源は相手の主力に合った兵に回したい`);
    }
    // 騎兵をほとんど作らないのに騎兵の研究をした
    const cavCount = mix.tot.cavalry || 0;
    const cavTechs = CAVALRY_TECHS.filter((x) => t[x] !== undefined && !free(x));
    if (cavTechs.length && cavCount < 15 && end > 1800) {
      const first = Math.min(...cavTechs.map((x) => t[x]));
      add(advice, first, `騎兵は${cavCount}体しか作っていないのに、${cavTechs.map((x) => `${techName(x)}(${fmtTime(t[x])})`).join("・")}を研究。その食料・黄金を時代進化や主力の研究に回したい`);
    }
  }

  const byTime = (x, y) => (x.time ?? 1e9) - (y.time ?? 1e9);
  return { good: good.sort(byTime), advice: advice.sort(byTime), notes };
}

// 試合の流れ(時代進化と主な研究)を時刻順に並べる
const TIMELINE_TECHS = [
  "Loom", "Double-Bit Axe", "Wheelbarrow", "Horse Collar", "Bow Saw", "Gold Mining", "Heavy Plow", "Hand Cart",
  "Forging", "Fletching", "Scale Mail Armor", "Padded Archer Armor", "Scale Barding Armor", "Bloodlines", "Ballistics", "Chemistry", "Conscription",
  "Man-at-Arms", "Long Swordsman", "Two-Handed Swordsman", "Champion", "Crossbowman", "Arbalester", "Pikeman", "Halberdier",
  "Elite Skirmisher", "Light Cavalry", "Cavalier", "Paladin", "Capped Ram", "Onager",
];
function replayTimeline(p) {
  const ev = [];
  ["feudal", "castle", "imperial"].forEach((age) => p.ages?.[age] !== undefined && ev.push({ time: p.ages[age], label: AGE_JA[age], age: true }));
  TIMELINE_TECHS.forEach((x) => p.techs?.[x] !== undefined && ev.push({ time: p.techs[x], label: techName(x) }));
  return ev.sort((x, y) => x.time - y.time);
}

// claude.ai に貼り付ける相談文
function playerLineForPrompt(r, n) {
  const p = r.players[n];
  if (!p) return `- ${displayName(n)}`;
  if (ratingKey(n) === AI_KEY) return `- ${displayName(n)}(${civName(p.civ)}${p.role ? "、" + ROLE_JA[p.role] : ""}): コンピューター。操作は録画に残らない`;
  const ages = ["feudal", "castle", "imperial"].map((g) => `${AGE_JA[g].replace("の時代", "")} ${fmtTime(p.ages?.[g])}`).join(" / ");
  const techs = TIMELINE_TECHS.filter((x) => p.techs?.[x] !== undefined).sort((x, y) => p.techs[x] - p.techs[y]).map((x) => `${techName(x)} ${fmtTime(p.techs[x])}`).join("、");
  const prod = r.edition === "HD" ? "生産数は不明(HD)" : `町の人 ${p.units?.Villager || 0}・町の中心の建設 ${p.buildings?.["Town Center"] || 0}回・軍 ${militaryMix(p.units).sum}(${topUnitsText(p.units, 4) || "なし"})・攻囲兵器 ${countUnits(p.units, SIEGE_UNITS)}・荷馬車 ${p.units?.["Trade Cart"] || 0}`;
  const resign = p.resign !== null && p.resign !== undefined && p.resign < r.duration - 30 ? `・${fmtTime(p.resign)} 投了` : "";
  const cps = Object.entries(p.at || {}).map(([cp, c]) => `${cp}分 町の人${c.v}・軍${c.m}`).join(" / ");
  const byAge = unitsByAgeText(p, 3);
  return `- ${displayName(n)}(${civName(p.civ)}、${p.role ? ROLE_JA[p.role] + "、" : ""}eAPM ${p.eapm ?? "?"}): ${ages}${resign}\n  ${prod}${byAge ? `\n  時代ごとに作った軍: ${byAge}` : ""}${cps ? `\n  途中経過(累計): ${cps}` : ""}\n  研究: ${techs || "なし"}`;
}

function buildAdvisorPrompt({ question, replay, player, diagnosis, agg, includeMatch, includeMembers }) {
  const L = [];
  L.push("あなたは Age of Empires II: Definitive Edition のコーチです。以下は、固定メンバーで遊んでいる仲間内のチーム戦(主に4v4のアラビア。AIを混ぜることもある)のデータです。");
  L.push("日本語で、ゲーム内の日本語版の表記(町の人、領主の時代、城主の時代、帝王の時代、両刃斧、引き具 など)を使って、具体的な時刻や数字を挙げながら答えてください。");
  L.push("");
  L.push("## 質問");
  L.push(question.trim() || "(質問を書いてください)");
  if (includeMatch && replay) {
    const r = replay;
    const winTeam = r.winner === "A" ? "チームA" : r.winner === "B" ? "チームB" : "不明";
    L.push("");
    L.push(`## 試合データ(${replayDate(r)} ${r.start.slice(11)}、${mapName(r.map) || "マップ不明"}、${fmtTime(r.duration)}、勝ち: ${winTeam}${r.edition === "HD" ? "、AoE2 HD" : ""})`);
    L.push("録画から取り出したもの。時刻はゲーム内時間で、時代進化は「時代に到達した時刻」、そのほかの研究は「研究を始めた時刻」。生産数は「キューに入れた数」、建物は「建設を指示した回数」なので目安(取り消した分も含む)。民兵系=民兵〜近衛剣士のように、アップグレード後も同じ系統で数えている。録画にスコアは入っていない。前衛=チームの両端の位置、後衛=内側の位置で、開始位置から判定したもの。「途中経過」はその時点までに作った数の累計。「時代ごとに作った軍」はその時代に予約した数で、録画には戦闘の結果が残らないため、その時点で何体残っているかは分からない(主力の切り替えはここから判断してほしい)。終了時の合計は優勢になった後に増えた分(結果)を含むので、勝負の分かれ目より前の数で判断してほしい。");
    ["A", "B"].forEach((side) => {
      L.push(`### チーム${side}${r.winner === side ? "(勝ち)" : ""}`);
      r["team" + side].forEach((n) => L.push(playerLineForPrompt(r, n)));
    });
    if (player && diagnosis) {
      L.push("");
      L.push(`## ${displayName(player)} についてツールが自動で出した診断(参考)`);
      diagnosis.good.forEach((x) => L.push(`- 良かった点: ${x.time !== null && x.time !== undefined ? fmtTime(x.time) + " " : ""}${x.text}`));
      diagnosis.advice.forEach((x) => L.push(`- 改善点: ${x.time !== null && x.time !== undefined ? fmtTime(x.time) + " " : ""}${x.text}`));
      if (!diagnosis.good.length && !diagnosis.advice.length) L.push("- 特に指摘なし");
    }
  }
  if (includeMembers) {
    L.push("");
    L.push("## メンバーの傾向(このツールの総評より)");
    const rs = roleStats(agg);
    Object.entries(PLAYER_REVIEWS).forEach(([n, rv]) => {
      if (n === AI_KEY) return;
      const elo = agg.ratingModel.ratings[n];
      const r = rs[n];
      const roles = r ? ["flank", "pocket"].filter((k) => r[k]?.decided).map((k) => `${ROLE_JA[k]} ${r[k].wins}勝${r[k].decided - r[k].wins}敗・城主の時代 ${fmtTime(median(r[k].castle))}`).join(" / ") : "";
      L.push(`- ${n}${elo ? `(推定レート ${Math.round(elo)})` : ""}: ${rv.type}。${rv.summary}${roles ? `
  前衛・後衛: ${roles} → ${roleVerdict(r).text}` : ""}`);
    });
    L.push("");
    L.push("## このグループの録画で分かっていること");
    L.push(`試合の途中の時点で両チームを比べると(その時点から15分以上続いた試合のみ)、勝敗とはっきり関係していたのは15分時点の軍の数(多いチームが${MIDGAME.m15.pct}%、前衛同士では${MIDGAME.m15Flank.pct}%勝ち)。途中時点の町の人・町の中心・鍛冶場の研究や、時代進化の早さはほとんど関係がなかった。町の人は前衛同士で比べると15〜25分時点で多いチームが${pctRange(MIDGAME.vFlankLo, MIDGAME.vFlankHi)}勝ち、町の人を多く作っている人ほど軍も多く出せている(内政→軍→勝敗の流れ)。試合終了時の合計(町の人・荷馬車・城・攻囲兵器)は勝ったチームの方が多いが、優勢になった結果として増えた分とみられる。ユニットの相性は兵種の大まかな分類ではなく、ユニットごとに考えてほしい(例: ハスカールは飛び道具に強いので射手は効かない)。操作(eAPM)は、合計や移動・指示の多さは勝敗とほとんど関係がなく、10〜15分の生産の命令が多いチームが${MIDGAME.queue1015.pct}%(前衛同士では${MIDGAME.queue1015Flank.pct}%)勝っている。`);
  }
  return L.join("\n");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // クリップボードAPIが使えない環境(http や古いブラウザ)向け
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

const ADVISOR_PLAYER_KEY = "aoe2_advisor_player";
const selectStyle = { background: "#221d18", border: "1px solid #4a4136", borderRadius: 8, padding: "7px 10px", color: "#ede4d3", fontFamily: "'Inter', sans-serif", fontSize: 13, outline: "none", maxWidth: "100%" };

// 途中の時点(5分ごと)での町の人・軍の累計を、本人・味方の人間の平均・相手の人間の平均で並べる
function checkpointRows(r, name) {
  const isA = r.teamA.includes(name);
  const humansOf = (mine) => Object.keys(r.players).filter((n) => ratingKey(n) !== AI_KEY && r.teamA.includes(n) === (mine ? isA : !isA));
  const avgAt = (names, cp, k) => {
    const v = names.map((n) => r.players[n].at?.[cp]?.[k]).filter((x) => x !== undefined);
    return v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null;
  };
  const mates = humansOf(true).filter((n) => n !== name), foes = humansOf(false);
  return Object.keys(r.players[name]?.at || {}).map((cp) => ({
    cp,
    me: r.players[name].at[cp],
    mateV: avgAt(mates, cp, "v"), mateM: avgAt(mates, cp, "m"),
    foeV: avgAt(foes, cp, "v"), foeM: avgAt(foes, cp, "m"),
  }));
}

function CheckpointTable({ replay, name }) {
  const rows = checkpointRows(replay, name);
  if (!rows.length) return null;
  const cell = { ...monoSmall, fontSize: 11, padding: "2px 6px", textAlign: "right" };
  const head = { ...cell, color: "#665c4f" };
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ borderCollapse: "collapse", minWidth: 360 }}>
        <thead>
          <tr>
            <th style={{ ...head, textAlign: "left" }}>時点</th>
            <th style={head}>町の人</th><th style={head}>軍</th>
            <th style={head}>味方 町の人/軍</th><th style={head}>相手 町の人/軍</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((x) => (
            <tr key={x.cp}>
              <td style={{ ...cell, textAlign: "left" }}>{x.cp}分</td>
              <td style={{ ...cell, color: "#ede4d3" }}>{x.me.v}</td>
              <td style={{ ...cell, color: x.foeM !== null && x.me.m < x.foeM ? "#c07a6f" : "#ede4d3" }}>{x.me.m}</td>
              <td style={cell}>{x.mateV ?? "−"}/{x.mateM ?? "−"}</td>
              <td style={cell}>{x.foeV ?? "−"}/{x.foeM ?? "−"}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdviceList({ items, color, empty }) {
  if (!items.length) return <div style={{ fontSize: 12, color: "#665c4f", fontFamily: "'Inter', sans-serif" }}>{empty}</div>;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      {items.map((x, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "48px 1fr", gap: 8, fontSize: 12, fontFamily: "'Inter', sans-serif", lineHeight: 1.6 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", color }}>{x.time !== null && x.time !== undefined ? fmtTime(x.time) : "全体"}</span>
          <span style={{ color: "#ede4d3" }}>{x.text}</span>
        </div>
      ))}
    </div>
  );
}

function Advisor({ agg }) {
  const rstats = useMemo(() => replayStats(), []);
  const replays = useMemo(() => [...REPLAYS].reverse(), []);
  const [replayId, setReplayId] = useState(replays[0]?.id || "");
  const replay = replays.find((r) => r.id === replayId) || null;
  const humans = replay ? Object.keys(replay.players).filter((n) => ratingKey(n) !== AI_KEY) : [];
  const [player, setPlayer] = useState(() => {
    try { return localStorage.getItem(ADVISOR_PLAYER_KEY) || ""; } catch (e) { return ""; }
  });
  const current = humans.includes(player) ? player : humans[0] || "";
  const choosePlayer = (n) => {
    setPlayer(n);
    try { localStorage.setItem(ADVISOR_PLAYER_KEY, n); } catch (e) { /* 保存できなくても動く */ }
  };
  const diagnosis = useMemo(() => (replay && current ? diagnoseReplay(replay, current, rstats[ratingKey(current)]) : null), [replay, current, rstats]);
  const p = replay?.players[current];

  const [question, setQuestion] = useState("");
  const [includeMatch, setIncludeMatch] = useState(true);
  const [includeMembers, setIncludeMembers] = useState(true);
  const [status, setStatus] = useState("");
  const [showPrompt, setShowPrompt] = useState(false);
  const prompt = buildAdvisorPrompt({ question, replay, player: current, diagnosis, agg, includeMatch, includeMembers });

  const send = async (openClaude) => {
    const ok = await copyText(prompt);
    if (openClaude) window.open("https://claude.ai/new", "_blank", "noopener");
    setStatus(ok
      ? openClaude ? "相談文をコピーしました。開いた Claude の入力欄に貼り付けて(Ctrl+V)送信してください。" : "相談文をコピーしました。"
      : "コピーできませんでした。下の「相談文を見る」から選択してコピーしてください。");
    if (!ok) setShowPrompt(true);
  };

  const small = { fontSize: 12, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };
  const label = (r) => {
    const w = r.winner === "A" ? "A勝ち" : r.winner === "B" ? "B勝ち" : "勝敗不明";
    return `${replayDate(r)} ${r.start.slice(11)}・${mapName(r.map) || "?"}・${fmtTime(r.duration)}・${w}${r.edition === "HD" ? "・HD" : ""}`;
  };

  return (
    <div>
      <h2 style={h2Style}>AoE相談</h2>
      <p style={subText}>
        録画から試合を選ぶと、そのプレイヤーの「良かった点」と「こうするとよかった点」を時刻つきで出します(ブラウザ内の計算なので無料)。
        自由な質問は、試合データとメンバーの傾向をまとめた相談文を作ってコピーし、Claude(claude.ai)に貼り付けて相談できます。Claude の契約(Pro)の使用量の範囲で使え、追加の料金はかかりません。
      </p>

      <h3 style={{ ...h3Style, marginTop: 20 }}>試合を振り返る</h3>
      {!replays.length ? (
        <div style={{ ...cardStyle, ...small }}>録画データがありません。tools/import_replays.py で取り込んでください。</div>
      ) : (
        <div style={{ ...cardStyle, marginBottom: 24 }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select value={replayId} onChange={(e) => setReplayId(e.target.value)} style={{ ...selectStyle, flex: "1 1 260px" }}>
              {replays.map((r) => <option key={r.id} value={r.id}>{label(r)}</option>)}
            </select>
            <select value={current} onChange={(e) => choosePlayer(e.target.value)} style={{ ...selectStyle, flex: "0 1 180px" }}>
              {humans.map((n) => <option key={n} value={n}>{displayName(n)}</option>)}
            </select>
          </div>
          {replay && (
            <div style={{ ...small, marginTop: 8 }}>
              <span style={{ color: replay.winner === "A" ? "#8fa876" : "#a89a86" }}>A{replay.winner === "A" ? "(勝)" : ""}: {teamWithCivs(replay.teamA, replay)}</span>
              <br />
              <span style={{ color: replay.winner === "B" ? "#8fa876" : "#a89a86" }}>B{replay.winner === "B" ? "(勝)" : ""}: {teamWithCivs(replay.teamB, replay)}</span>
            </div>

          {p && diagnosis && (

                </div>

              </div>

                <div>
                  <div style={{ fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif", marginBottom: 4 }}>
                    途中経過(その時点までに作った数の累計。味方・相手は人間の平均)。勝負が決まる前の差を見るためのもので、このグループでは15分時点の軍の差が勝敗と一番関係していた
                  </div>
                  <CheckpointTable replay={replay} name={current} />
                </div>
              )}
              <div>
                <div style={{ fontSize: 11, color: "#665c4f", fontFamily: "'Inter', sans-serif", marginBottom: 4 }}>試合の流れ(時代は到達した時刻、研究は始めた時刻)</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {replayTimeline(p).map((e, i) => (
                    <span key={i} style={{ ...monoSmall, fontSize: 11, padding: "2px 6px", borderRadius: 4, background: e.age ? "#3a3128" : "#171310", color: e.age ? "#d9b34a" : "#a89a86" }}>
                      {fmtTime(e.time)} {e.label}
                    </span>
                  ))}
                </div>
              </div>
              <div style={{ ...small, fontSize: 11, color: "#665c4f" }}>
                目安は、ネットの攻略情報とこのグループの録画の傾向から決めたもので、チーム戦のアラビアで内政を回しながら上がる場合の数字です。役割(端か内側か)や相手の動きで変わるので、気づきのきっかけとして使ってください。
                録画には操作しか入っていないため、戦闘の結果や資源の量は分かりません。
              </div>
              <ReplayToggle replay={replay} label="この試合の全員の詳細" />
            </div>
          )}
        </div>
      )}

      <h3 style={h3Style}>Claudeに相談</h3>
      <div style={{ ...cardStyle, marginBottom: 24 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          {ADVISOR_QUESTIONS.map((q) => (
            <button key={q} onClick={() => setQuestion(q)} style={{ background: "#171310", border: "1px solid #3a3128", borderRadius: 14, padding: "4px 10px", color: "#a89a86", fontSize: 11, fontFamily: "'Inter', sans-serif", cursor: "pointer" }}>
              {q}
            </button>
          ))}
        </div>
        <textarea
          value={question}
          onChange={(e) => setQuestion(e.target.value)}
          placeholder="例: 30分ごろに相手の騎士に押し込まれました。どのタイミングで何を作っていればよかったですか?"
          rows={4}
          style={{ ...inputStyle, width: "100%", boxSizing: "border-box", resize: "vertical", lineHeight: 1.6 }}
        />
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 8, ...small }}>
          <label style={{ cursor: "pointer" }}>
            <input type="checkbox" checked={includeMatch} onChange={(e) => setIncludeMatch(e.target.checked)} /> 上で選んだ試合のデータと診断を付ける{replay && includeMatch ? `(${replayDate(replay)}・${displayName(current)})` : ""}
          </label>
          <label style={{ cursor: "pointer" }}>
            <input type="checkbox" checked={includeMembers} onChange={(e) => setIncludeMembers(e.target.checked)} /> メンバーの傾向を付ける

      <p style={{ ...subText, marginTop: 0, marginBottom: 10 }}>
        ネットの攻略情報とゲーム内の文明説明をもとに、Claude Code がまとめたチーム戦の基本です。「このグループでは〜%」はこのツールの録画から計算した数字です。
      </p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

            {Object.entries(CIV_TIPS).map(([c, x]) => <li key={c}>{x}</li>)}
          </ul>
        </div>
      </div>
    </div>
  );
}

const h3Style = { fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 14, color: "#c9a227", margin: "0 0 10px" };
const subText = { fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#a89a86", marginTop: 6, maxWidth: 640, lineHeight: 1.6 };
const cardStyle = { background: "#221d18", border: "1px solid #3a3128", borderRadius: 10, padding: "12px 16px" };
const inputStyle = { flex: 1, background: "#221d18", border: "1px solid #4a4136", borderRadius: 8, padding: "8px 12px", color: "#ede4d3", fontFamily: "'Inter', sans-serif", fontSize: 13, outline: "none" };
const primaryButton = { background: "linear-gradient(135deg,#d9b34a,#c98a4b)", color: "#1b1712", border: "none", borderRadius: 8, padding: "10px 22px", fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 13, letterSpacing: "0.03em" };

// Google Apps Script のデプロイURL(.../exec)。設定するとFreeプランでもスプレッドシートに永続保存されます。
// 未設定の間はClaudeの共有ストレージ(要Pro以上)にフォールバックします。
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0M_D_YU1ZU79PGtw3_hesCasn8kbKXFGE18REqgd3nbxy8a-kuSFo_Rim3BT6VX1_/exec";

async function loadMatches() {
  if (GAS_URL) {
    const res = await fetch(GAS_URL);
    const json = await res.json();
    return Array.isArray(json) ? json : [];
  }
  const r = await window.storage.get("aoe2_matches", true);
  return r && r.value ? JSON.parse(r.value) : [];
}

async function saveMatches(next) {
  if (GAS_URL) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // プリフライトを避けるためtext/plainで送信
      body: JSON.stringify(next),
    });
    return;
  }
  await window.storage.set("aoe2_matches", JSON.stringify(next), true);
}

        録画から登録した試合はスコアがないので、スコアも残したいときは「試合を記録」から同じ試合を記録すると、そちらに置き換わります。

                  <span style={{ color: m.winner === "B" ? "#8fa876" : "#a89a86" }}>

                {replayOf(m) && <ReplayToggle replay={replayOf(m)} />}
              </div>
              <div>
                {m.source === "replay" ? (
                  <span style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif", whiteSpace: "nowrap" }}>録画から登録</span>
                ) : confirmId === m.id ? (
                  <div style={{ display: "flex", gap: 6 }}>
                    <button
                      onClick={() => { onDelete(m.id); setConfirmId(null); }}
                      style={{ background: "#a8524a", color: "#ede4d3", border: "none", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                    >
                      本当に削除
                    </button>
                    <button
                      onClick={() => setConfirmId(null)}
                      style={{ background: "transparent", color: "#a89a86", border: "1px solid #4a4136", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}

                    onClick={() => setConfirmId(m.id)}
                    style={{ background: "transparent", color: "#c07a6f", border: "1px solid #a8524a55", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}
                  >
                    削除
                  </button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  useFonts();
  const [matches, setMatches] = useState([]);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("board");

  useEffect(() => {
    (async () => {
      try {
        const loaded = await loadMatches();
        setMatches(loaded);
      } catch (e) {
        // 初回でデータが無い場合などはここに来る
      }
      setReady(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setMatches(next);
    try {
      await saveMatches(next);
    } catch (e) {
      console.error("保存に失敗しました", e);
    }
  }, []);

  const handleAddMatch = (m) => {
    persist([...matches, m]);
  };

  const handleDeleteMatch = (id) => {
    persist(matches.filter((m) => m.id !== id));
  };

  const replayLinks = useMemo(() => linkReplays([...SEED_MATCHES, ...matches]), [matches]);
  // ツールで記録していない録画の試合も、試合として集計に入れる(スコアなし)
  const allMatches = useMemo(() => [...matches, ...replayOnlyMatches(replayLinks)].sort((a, b) => a.id - b.id), [matches, replayLinks]);
  const agg = useMemo(() => computeAggregates(allMatches), [allMatches]);

  if (!ready) {
    return <div style={{ padding: 40, color: "#a89a86", fontFamily: "'Inter', sans-serif" }}>読み込み中...</div>;
  }

  const tabs = [
    { id: "board", label: "リーダーボード" },
    { id: "add", label: "試合を記録" },
    { id: "history", label: "試合履歴" },
    { id: "build", label: "チーム分け提案" },
    { id: "synergy", label: "相性データ" },
    { id: "replays", label: "録画分析" },
    { id: "review", label: "総評" },
    { id: "advisor", label: "AoE相談" },
  ];

  return (
    <div style={{ background: "#1b1712", minHeight: "100%", padding: 24, borderRadius: 12 }}>
      <div style={{ marginBottom: 22 }}>
        <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 24, color: "#d9b34a", letterSpacing: "0.03em" }}>
          AOE2 チーム分けトラッカー
        </div>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#665c4f", marginTop: 2 }}>
          記録試合数: {allMatches.length}(うち録画から登録 {allMatches.length - matches.length})・シード: 過去221戦・録画: {REPLAYS.length}試合
        </div>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 24, borderBottom: "1px solid #3a3128", paddingBottom: 12 }}>
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{
              background: tab === t.id ? "#2a2420" : "transparent",
              color: tab === t.id ? "#d9b34a" : "#a89a86",
              border: tab === t.id ? "1px solid #d9b34a55" : "1px solid transparent",
              borderRadius: 8,
              padding: "8px 16px",
              fontFamily: "'Cinzel', serif",
              fontWeight: 700,
              fontSize: 13,
              letterSpacing: "0.02em",
              whiteSpace: "nowrap",
              cursor: "pointer",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {tab === "board" && <Leaderboard agg={agg} />}
      {tab === "add" && <AddMatch agg={agg} onSave={handleAddMatch} />}
      {tab === "history" && <MatchHistory matches={allMatches} onDelete={handleDeleteMatch} replayLinks={replayLinks} />}
      {tab === "build" && <TeamBuilder agg={agg} matches={allMatches} />}
      {tab === "synergy" && <Synergy agg={agg} />}
      {tab === "replays" && <ReplayAnalysis agg={agg} />}
      {tab === "review" && <PlayerReviews agg={agg} matches={[...SEED_MATCHES, ...matches]} replayLinks={replayLinks} />}
      {tab === "advisor" && <Advisor agg={agg} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>

  var source = document.getElementById("app-source").textContent;

</body>
</html>
