function teamWithCivs(names, replay) {
  return names.map((n) => (replay?.players[n] ? `${displayName(n)}(${civName(replay.players[n].civ)})` : displayName(n))).join(", ");
}

function ReplayAnalysis({ agg }) {
  const stats = useMemo(() => replayStats(), []);
  const ratingOf = (k) => agg.ratingModel.ratings[k] ?? priorRating(k);
  const names = Object.keys(stats).filter((k) => stats[k].games >= 3).sort((a, b) => ratingOf(b) - ratingOf(a));
  const civTotals = {};
  Object.entries(stats).forEach(([k, s]) => {
    if (k === AI_KEY) return;
    Object.entries(s.civs).forEach(([c, v]) => {
      const t = (civTotals[c] = civTotals[c] || { games: 0, wins: 0, decided: 0, players: new Set() });
      t.games += v.games;
      t.wins += v.wins;
      t.decided += v.decided;
      t.players.add(k);
    });
  });
  const civRows = Object.entries(civTotals).sort((a, b) => b[1].games - a[1].games);
  const first = REPLAYS[0], last = REPLAYS[REPLAYS.length - 1];
  const small = { fontSize: 12, fontFamily: "'Inter', sans-serif", color: "#a89a86", lineHeight: 1.7 };

  if (!REPLAYS.length) {
    return (
      <div>
        <h2 style={h2Style}>録画分析</h2>
        <p style={subText}>録画データがありません。tools/import_replays.py で取り込んでください。</p>
      </div>
    );
  }
  return (
    <div>
      <h2 style={h2Style}>録画分析</h2>
      <p style={subText}>
        AoE2 DE の録画ファイル {REPLAYS.length}試合({replayDate(first)}〜{replayDate(last)})から取り出したデータです。
        録画には各プレイヤーの操作だけが入っていて、スコアは入っていません。時代進化は「研究を始めた時刻」(ゲーム内時間)、
        生産数は「キューに入れた数」で、あとで取り消した分や資源不足で作られなかった分も混じるので目安です。
        民兵系は民兵〜近衛剣士のように、アップグレード後のユニットも含みます。
      </p>

      <h3 style={{ ...h3Style, marginTop: 20 }}>プレイヤー別の傾向(現在のレート順)</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
        {names.map((k) => {
          const s = stats[k];
          return (
            <div key={k} style={cardStyle}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 14, color: "#ede4d3" }}>
                  {k === AI_KEY ? "AI(AI1〜5の合算)" : displayName(k)}
                </span>
                <span style={{ ...monoSmall, fontSize: 12 }}>
                  {s.games}試合{s.decided ? `・${s.wins}勝${s.decided - s.wins}敗` : ""}
                </span>
              </div>
              {k === AI_KEY ? (
                <div style={{ ...small, marginTop: 4 }}>
                  文明: {s.topCivs.slice(0, 6).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
                  <br />
                  <span style={{ color: "#665c4f" }}>AIの操作はほとんど録画に残らないため、時代進化や生産の傾向は出せません。</span>
                </div>
              ) : (<>
              <div style={{ ...small, marginTop: 4 }}>
                時代進化(中央値): 領主 {fmtTime(median(s.feudal))}・城主 {fmtTime(median(s.castle))}・帝王 {fmtTime(median(s.imperial))}
                <span style={{ color: "#665c4f" }}>(帝王の時代まで行った試合 {s.imperial.length}/{s.games})</span>
                <br />
                eAPM {Math.round(median(s.eapm))}・町の人 平均{Math.round(s.villagers.reduce((a, b) => a + b, 0) / s.games)}人
                {s.techs.Wheelbarrow ? `・手押し車 ${fmtTime(median(s.techs.Wheelbarrow))}` : ""}
                {s.techs["Double-Bit Axe"] ? `・両刃斧 ${fmtTime(median(s.techs["Double-Bit Axe"]))}` : ""}
                {s.techs["Horse Collar"] ? `・引き具 ${fmtTime(median(s.techs["Horse Collar"]))}` : ""}
                <br />
                主な軍: {s.topUnits.map((x) => `${unitName(x.unit)} ${Math.round(x.perGame)}`).join("・")}
                <span style={{ color: "#665c4f" }}>(1試合あたり)</span>
                <br />
                文明: {s.topCivs.slice(0, 4).map(([c, v]) => `${civName(c)} ${v.games}試合${v.decided ? `${v.wins}勝` : ""}`).join("・")}
              </div>
              <div style={{ marginTop: 6 }}>
                <UnitMixBar mix={s.mix} note="(軍の生産数の内訳)" />
              </div>
              </>)}
            </div>
          );
        })}
      </div>

      <h3 style={h3Style}>文明別の成績(人間のみ)</h3>
      <div style={{ ...cardStyle, marginBottom: 24, overflowX: "auto" }}>
        <div style={{ minWidth: 420 }}>
          {civRows.map(([c, t]) => (
            <div key={c} style={{ display: "grid", gridTemplateColumns: "120px 70px 80px 1fr", gap: 8, padding: "3px 0", ...monoSmall, fontSize: 12 }}>
              <span style={{ color: "#ede4d3" }}>{civName(c)}</span>
              <span>{t.games}試合</span>
              <span style={{ color: t.decided && t.wins / t.decided >= 0.5 ? "#8fa876" : "#c07a6f" }}>
                {t.decided ? `${t.wins}勝${t.decided - t.wins}敗` : "−"}
              </span>
              <span style={{ color: "#8b7a6b" }}>{[...t.players].map(displayName).join(", ")}</span>
            </div>
          ))}
        </div>
        <div style={{ ...small, fontSize: 11, color: "#665c4f", marginTop: 6 }}>
          ほとんどの人が毎回同じ文明を使っているので、文明の勝率はほぼ「その文明を使う人の勝率」です。文明そのものの強さとしては読めません。
        </div>
      </div>

      <h3 style={h3Style}>試合一覧(新しい順)</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {[...REPLAYS].reverse().map((r) => (
          <div key={r.id} style={cardStyle}>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#8b7a6b" }}>
              {replayDate(r)} {r.start.slice(11)}・{mapName(r.map)}・{fmtTime(r.duration)}
              {r.start < REPLAY_SEED_END ? "" : "・このツールの記録と同じ試合"}
            </div>
            <div style={{ marginTop: 4, fontFamily: "'Inter', sans-serif", fontSize: 12, lineHeight: 1.6 }}>
              <span style={{ color: r.winner === "A" ? "#8fa876" : "#a89a86" }}>A{r.winner === "A" ? "(勝)" : ""}: {teamWithCivs(r.teamA, r)}</span>
              <br />
              <span style={{ color: r.winner === "B" ? "#8fa876" : "#a89a86" }}>B{r.winner === "B" ? "(勝)" : ""}: {teamWithCivs(r.teamB, r)}</span>
            </div>
            <ReplayToggle replay={r} label="詳細" />
          </div>
        ))}
      </div>
    </div>
  );
}

// Google Apps Script のデプロイURL(.../exec)。設定するとFreeプランでもスプレッドシートに永続保存されます。
// 未設定の間はClaudeの共有ストレージ(要Pro以上)にフォールバックします。
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0M_D_YU1ZU79PGtw3_hesCasn8kbKXFGE18REqgd3nbxy8a-kuSFo_Rim3BT6VX1_/exec";

async function loadMatches() {
  if (GAS_URL) {
    const res = await fetch(GAS_URL);
    const json = await res.json();
    return Array.isArray(json) ? json : [];
  }
  const r = await window.storage.get("aoe2_matches", true);
  return r && r.value ? JSON.parse(r.value) : [];
}

async function saveMatches(next) {
  if (GAS_URL) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // プリフライトを避けるためtext/plainで送信
      body: JSON.stringify(next),
    });
    return;
  }
  await window.storage.set("aoe2_matches", JSON.stringify(next), true);
}

function MatchScoreDetail({ scores }) {
  const [open, setOpen] = useState(false);
  const entries = Object.entries(scores);
  return (
    <div style={{ marginTop: 4 }}>
      <button
        onClick={() => setOpen((v) => !v)}
        style={{ background: "none", border: "none", padding: 0, color: "#c9a227", fontSize: 11, fontFamily: "'Inter', sans-serif", cursor: "pointer" }}
      >
        {open ? "▾ 詳細スコアを閉じる" : "▸ 詳細スコアを見る"}
      </button>
      {open && (
        <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 2 }}>
          {entries.map(([n, s]) => {
            const total = (s.military || 0) + (s.economy || 0) + (s.tech || 0) + (s.society || 0);
            return (
              <div
                key={n}
                style={{
                  display: "grid",
                  gridTemplateColumns: "84px repeat(5, 1fr)",
                  gap: 4,
                  fontSize: 11,
                  fontFamily: "'JetBrains Mono', monospace",
                  color: "#a89a86",
                }}
              >
                <span style={{ color: "#ede4d3" }}>{displayName(n)}</span>
                <span style={{ textAlign: "right" }}>軍{s.military || 0}</span>
                <span style={{ textAlign: "right" }}>経{s.economy || 0}</span>
                <span style={{ textAlign: "right" }}>技{s.tech || 0}</span>
                <span style={{ textAlign: "right" }}>社{s.society || 0}</span>
                <span style={{ textAlign: "right", color: "#c9a227" }}>総{total}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MatchHistory({ matches, onDelete, replayLinks = {} }) {
  const replayOf = (m) => replayLinks[m.id] || m.replay;
  const [confirmId, setConfirmId] = useState(null);

  return (
    <div>
      <h2 style={h2Style}>試合履歴</h2>
      <p style={subText}>
        ここに表示されるのは、あなたやお友達がこのツールから記録した試合と、録画ファイルから自動で登録した試合です(過去221戦分の元データや、スコア画像から登録した最初の1戦はここには出ません)。
        誤って入力した試合は削除できます。削除するとレート・戦績・相性データも自動で再計算されます。
        録画から登録した試合はスコアがないので、スコアも残したいときは「試合を記録」から同じ試合を記録すると、そちらに置き換わります。
      </p>

      {matches.length === 0 && (
        <div style={{ color: "#665c4f", fontSize: 13, fontFamily: "'Inter', sans-serif", marginTop: 16 }}>
          まだ記録がありません。
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 16 }}>
        {[...matches].reverse().map((m) => (
          <div key={m.id} style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#8b7a6b" }}>
                  {m.date || "日付なし"} {m.map ? `・${m.map}` : ""}
                </div>
                <div style={{ marginTop: 6, fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#ede4d3" }}>
                  <span style={{ color: m.winner === "A" ? "#8fa876" : "#a89a86" }}>
                    Team A{m.winner === "A" ? "(勝)" : ""}: {teamWithCivs(m.teamA, replayOf(m))}
                  </span>
                  <br />
                  <span style={{ color: m.winner === "B" ? "#8fa876" : "#a89a86" }}>
                    Team B{m.winner === "B" ? "(勝)" : ""}: {teamWithCivs(m.teamB, replayOf(m))}
                  </span>
                </div>
                {m.notes && (
                  <div style={{ marginTop: 6, fontSize: 12, color: "#8b7a6b", fontFamily: "'Inter', sans-serif" }}>{m.notes}</div>
                )}
                {m.scores && <MatchScoreDetail scores={m.scores} />}
                {replayOf(m) && <ReplayToggle replay={replayOf(m)} />}
              </div>
              <div>
                {m.source === "replay" ? (
                  <span style={{ fontSize: 11, color: "#8b7a6b", fontFamily: "'Inter', sans-serif", whiteSpace: "nowrap" }}>録画から登録</span>
                ) : confirmId === m.id ? (
                  <div style={{ display: "flex", gap: 6 }}>
                    <button
                      onClick={() => { onDelete(m.id); setConfirmId(null); }}
                      style={{ background: "#a8524a", color: "#ede4d3", border: "none", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                    >
                      本当に削除
                    </button>
                    <button
                      onClick={() => setConfirmId(null)}
                      style={{ background: "transparent", color: "#a89a86", border: "1px solid #4a4136", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}
                    >
                      キャンセル
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setConfirmId(m.id)}
                    style={{ background: "transparent", color: "#c07a6f", border: "1px solid #a8524a55", borderRadius: 6, padding: "6px 10px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}
                  >
                    削除
                  </button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  useFonts();
  const [matches, setMatches] = useState([]);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("board");

  useEffect(() => {
    (async () => {
      try {
        const loaded = await loadMatches();
        setMatches(loaded);
      } catch (e) {
        // 初回でデータが無い場合などはここに来る
      }
      setReady(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setMatches(next);
    try {
      await saveMatches(next);
    } catch (e) {
      console.error("保存に失敗しました", e);
    }
  }, []);

  const handleAddMatch = (m) => {
    persist([...matches, m]);
  };

  const handleDeleteMatch = (id) => {
    persist(matches.filter((m) => m.id !== id));
  };

  const replayLinks = useMemo(() => linkReplays([...SEED_MATCHES, ...matches]), [matches]);
  // ツールで記録していない録画の試合も、試合として集計に入れる(スコアなし)
  const allMatches = useMemo(() => [...matches, ...replayOnlyMatches(replayLinks)].sort((a, b) => a.id - b.id), [matches, replayLinks]);
  const agg = useMemo(() => computeAggregates(allMatches), [allMatches]);

  if (!ready) {
    return <div style={{ padding: 40, color: "#a89a86", fontFamily: "'Inter', sans-serif" }}>読み込み中...</div>;
  }

  const tabs = [
    { id: "board", label: "リーダーボード" },
    { id: "add", label: "試合を記録" },
    { id: "history", label: "試合履歴" },
    { id: "build", label: "チーム分け提案" },
    { id: "synergy", label: "相性データ" },
    { id: "replays", label: "録画分析" },
    { id: "review", label: "総評" },
  ];

  return (
    <div style={{ background: "#1b1712", minHeight: "100%", padding: 24, borderRadius: 12 }}>
      <div style={{ marginBottom: 22 }}>
        <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 700, fontSize: 24, color: "#d9b34a", letterSpacing: "0.03em" }}>
          AOE2 チーム分けトラッカー
        </div>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: "#665c4f", marginTop: 2 }}>
          記録試合数: {allMatches.length}(うち録画から登録 {allMatches.length - matches.length})・シード: 過去221戦・録画: {REPLAYS.length}試合
        </div>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 24, borderBottom: "1px solid #3a3128", paddingBottom: 12 }}>
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{
              background: tab === t.id ? "#2a2420" : "transparent",
              color: tab === t.id ? "#d9b34a" : "#a89a86",
              border: tab === t.id ? "1px solid #d9b34a55" : "1px solid transparent",
              borderRadius: 8,
              padding: "8px 16px",
              fontFamily: "'Cinzel', serif",
              fontWeight: 700,
              fontSize: 13,
              letterSpacing: "0.02em",
              whiteSpace: "nowrap",
              cursor: "pointer",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {tab === "board" && <Leaderboard agg={agg} />}
      {tab === "add" && <AddMatch agg={agg} onSave={handleAddMatch} />}
      {tab === "history" && <MatchHistory matches={allMatches} onDelete={handleDeleteMatch} replayLinks={replayLinks} />}
      {tab === "build" && <TeamBuilder agg={agg} matches={allMatches} />}
      {tab === "synergy" && <Synergy agg={agg} />}
      {tab === "replays" && <ReplayAnalysis agg={agg} />}
      {tab === "review" && <PlayerReviews agg={agg} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
